function setReceptIngredientOverride(productId, val){
  const n = parseFloat(String(val).replace(',','.'));
  if(!window._receptBestelling.overrides) window._receptBestelling.overrides = {};
  window._receptBestelling.overrides[productId] = (!n || n<0) ? 0 : n;
  renderMain();
}
function removeReceptIngredient(productId){
  const rb = window._receptBestelling;
  if(!rb.uitgesloten) rb.uitgesloten = [];
  if(!rb.uitgesloten.includes(productId)) rb.uitgesloten.push(productId);
  if(rb.overrides) delete rb.overrides[productId];
  renderMain();
}
function restoreReceptIngredient(productId){
  const rb = window._receptBestelling;
  rb.uitgesloten = (rb.uitgesloten||[]).filter(id=>id!==productId);
  renderMain();
}
function cancelReceptBestelling(){ window._receptBestelling=null; renderMain(); }
function addReceptToCart(){
  const rb = window._receptBestelling;
  const r = state.recipes.find(x=>x.id===rb.recipeId);
  if(!r) return;
  const factor = rb.aantalPersonen / r.basisPersonen;
  const uitgesloten = rb.uitgesloten || [];
  const overrides = rb.overrides || {};
  const zonderArtikel = [];
  r.ingredienten.forEach(l=>{
    const info = regelInfo(l, factor);
    if(uitgesloten.includes(info.key)) return;
    if(info.ontbreekt){ zonderArtikel.push(info.naam); return; }
    const hoeveelheid = overrides[info.key]!=null ? overrides[info.key] : info.hoeveelheid;
    if(hoeveelheid<=0) return;
    const productAantal = rond(hoeveelheid / info.inhoud, 3);
    cart[info.product.id] = rond((cart[info.product.id]||0) + productAantal, 3);
  });
  if(!r.gebruiksteller) r.gebruiksteller = {};
  r.gebruiksteller[currentUser().id] = (r.gebruiksteller[currentUser().id]||0) + 1;
  window._receptBestelling = null;
  save();
  toast(`Ingrediënten voor "${r.naam}" (${fmt(rb.aantalPersonen)} personen) toegevoegd aan je bestelaanvraag. Controleer en verstuur op het tabblad Bestellen.${zonderArtikel.length?` Niet toegevoegd (nog geen artikel gekoppeld): ${zonderArtikel.join(', ')}.`:''}`);
  switchTab('bestellen');
}

/* ---------- Weekplanning: chefs plannen recepten per les, het magazijn ziet de week ---------- */
// state.planning = [{id, leerkrachtId, leerkracht, datum, les, recipeId, personen, orderId}]
// Een geplande les zonder orderId is "gepland"; met orderId is ze aangevraagd bij het magazijn.
const WEEKDAGEN = ['maandag','dinsdag','woensdag','donderdag','vrijdag'];
function maandagVan(d){ const x = new Date(d); x.setHours(12,0,0,0); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
// In het weekend toont de planning al de komende week.
function standaardWeek(){ const d = new Date(); if(d.getDay()===6 || d.getDay()===0) d.setDate(d.getDate()+2); return isoDag(maandagVan(d)); }
function planWeek(){ if(!window._planWeek) window._planWeek = standaardWeek(); return window._planWeek; }
function weekDagen(maandagIso){ const m = new Date(maandagIso+'T12:00:00'); return WEEKDAGEN.map((n,i)=>{ const d = new Date(m); d.setDate(m.getDate()+i); return {naam:n, iso:isoDag(d), kort:d.toLocaleDateString('nl-BE',{weekday:'short',day:'numeric',month:'short'})}; }); }
function planVerschuif(n){ const m = new Date(planWeek()+'T12:00:00'); m.setDate(m.getDate()+7*n); window._planWeek = isoDag(m); renderMain(); }
function planDezeWeek(){ window._planWeek = standaardWeek(); renderMain(); }
function weekTitel(maandagIso){ const d = weekDagen(maandagIso); const f = x=>new Date(x+'T12:00:00').toLocaleDateString('nl-BE',{day:'numeric',month:'short'}); return 'Week van '+f(d[0].iso)+' tot '+f(d[4].iso); }
// Periode: standaard deze week plus een maand vooruit (5 weken); terug te zetten naar één week.
const PLAN_MAAND_WEKEN = 5;
function planWeken(){ return window._planWeken || PLAN_MAAND_WEKEN; }
function planModus(n){ window._planWeken = n; renderMain(); }
function periodeMaandagen(maandagIso){ const out = []; for(let i=0;i<planWeken();i++){ const d = new Date(maandagIso+'T12:00:00'); d.setDate(d.getDate()+7*i); out.push(isoDag(d)); } return out; }
function periodeDagen(maandagIso){ return periodeMaandagen(maandagIso).flatMap(weekDagen); }
function planInPeriode(maandagIso, filter){ const d = periodeDagen(maandagIso); const van = d[0].iso, tot = d[d.length-1].iso; return (state.planning||[]).filter(p=>p.datum>=van && p.datum<=tot && (!filter || filter(p))); }
function periodeTitel(maandagIso){ if(planWeken()===1) return weekTitel(maandagIso); const d = periodeDagen(maandagIso); const f = x=>new Date(x+'T12:00:00').toLocaleDateString('nl-BE',{day:'numeric',month:'short'}); return 'Van '+f(d[0].iso)+' tot '+f(d[d.length-1].iso)+' ('+planWeken()+' weken)'; }
function planModusKnoppen(){ const m = planWeken()>1; return `<button class="btn ${m?'ghost ':''}small" onclick="planModus(1)" aria-pressed="${!m}">1 week</button><button class="btn ${m?'':'ghost '}small" onclick="planModus(${PLAN_MAAND_WEKEN})" aria-pressed="${m}">+1 maand</button>`; }
function planInWeek(maandagIso, filter){ const d = weekDagen(maandagIso); const van = d[0].iso, tot = d[4].iso; return (state.planning||[]).filter(p=>p.datum>=van && p.datum<=tot && (!filter || filter(p))); }

// Producten die een geplande les nodig heeft (zelfde omrekening als "Per recept").
function planRegels(p){
  const r = state.recipes.find(x=>x.id===p.recipeId);
  if(!r) return {regels:[], zonder:[], r:null};
  const factor = (p.personen||r.basisPersonen) / (r.basisPersonen||1);
  const regels = [], zonder = [];
  r.ingredienten.forEach(l=>{ const info = regelInfo(l, factor); if(info.ontbreekt){ zonder.push(info.naam); return; } if(info.productAantal>0) regels.push({product:info.product, aantal:info.productAantal}); });
  return {regels, zonder, r};
}
function planOrder(p){ return p.orderId ? state.orders.find(o=>o.id===p.orderId) : null; }
function planStatusTag(p){
  const o = planOrder(p);
  if(!o) return '<span class="tag none">Gepland</span>';
  const f = orderFase(o);
  const lab = {ingediend:'Aangevraagd', verwerkt:'Verwerkt', klaargezet:'Klaargezet', geleverd:'Geleverd', geweigerd:'Geweigerd'}[f] || f;
  return `<span class="tag ${f==='geleverd'||f==='klaargezet'?'ok':f==='geweigerd'?'crit':'pending'}">${lab}</span>`;
}

function viewWeekplanning(){
  const me = currentUser();
  const week = planWeek(), dagen = periodeDagen(week), vandaag = isoDag(new Date());
  const mijn = planInPeriode(week, p=>p.leerkrachtId===me.id);
  const open = mijn.filter(p=>!p.orderId && p.datum>=vandaag);
  const q = (window._planQ||'').toLowerCase();
  const recepten = state.recipes.filter(r=>r.status==='goedgekeurd' && zieRecept(r));

// Opgetelde behoefte van geplande lessen tegenover de vrije voorraad.
function planBehoefte(lijst){
  const m = {}, zonder = new Set();
  lijst.forEach(p=>{ const {regels, zonder:z} = planRegels(p); z.forEach(n=>zonder.add(n)); regels.forEach(x=>{ const k = x.product.id; (m[k] = m[k] || {product:x.product, aantal:0}).aantal = rond(m[k].aantal + x.aantal, 3); }); });
  const rijen = Object.values(m).map(x=>{ const vrij = vrijeVoorraad(x.product.id); return {...x, vrij, tekort: rond(Math.max(0, x.aantal - vrij),3)}; }).sort((a,b)=>(b.tekort>0)-(a.tekort>0) || a.product.naam.localeCompare(b.product.naam));
  return {rijen, zonder:[...zonder]};
}
function planBehoefteTabel(lijst, metLeverancier){
  const {rijen, zonder} = planBehoefte(lijst);
  if(!rijen.length && !zonder.length) return '';

/* ---------- Voorraadbewegingen en verschilrapport (verwacht tegenover geteld) ---------- */
// Elke beweging komt in state.mutaties: {t: tijdstip in ms, pid, d: hoeveelheid (+ in, − uit), s: soort}.
// Bij een telling is "verwacht" = vorige telling + alle bewegingen sindsdien. Het verschil met wat geteld is,
// is wat zonder verklaring verdween (of opdook): verlies, diefstal, niet geregistreerde uitgifte, foute telling.
const MUT_SOORTEN = {levering:'geleverd', uitgifte:'uitgegeven aan chefs', balie:'balie', retour:'retour', kassa:'verkocht (kassa)', verspilling:'weggegooid', correctie:'correctie', samenvoegen:'samengevoegd'};
const MUT_MAX = 15000;
function boekMut(pid, d, s){
  if(!pid || !d || isNaN(d)) return;
  if(!Array.isArray(state.mutaties)) state.mutaties = [];
  state.mutaties.push({t:Date.now(), pid, d:rond(d,3), s});
  if(state.mutaties.length > MUT_MAX) state.mutaties.splice(0, state.mutaties.length - MUT_MAX + 1000);
}
// Laatste telling van een product: {t, geteld} of null.
function laatsteTelling(pid){
  const ts = state.tellingen || [];
  for(let i=ts.length-1; i>=0; i--){ const r = ts[i].regels.find(x=>x.pid===pid); if(r) return {t:ts[i].t, geteld:r.geteld}; }
  return null;
}
// Verwachte voorraad + uitleg per soort beweging sinds de vorige telling.
function verwachteVoorraad(p){
  const vorige = laatsteTelling(p.id);
  const mutStart = state._mutStart || 0;
  const sinds = {};
  const vanaf = vorige ? vorige.t : mutStart;
  (state.mutaties||[]).forEach(m=>{ if(m.pid===p.id && m.t>vanaf) sinds[m.s] = rond((sinds[m.s]||0)+m.d, 3); });
  if(vorige && vorige.t>=mutStart){
    const verwacht = rond(vorige.geteld + Object.values(sinds).reduce((a,b)=>a+b,0), 3);
    return {verwacht, sinds, basis:'telling', vorigeT:vorige.t};
  }
  // Nog geen eerdere telling sinds de bewegingen bijgehouden worden: wat de app nu denkt.
  return {verwacht: rond(p.voorraad||0, 3), sinds, basis:'app', vorigeT:null};
}
// Een telling vastleggen vóór de voorraad overschreven wordt. regels = {pid: geteld}.
function registreerTelling(regels, bron){
  const nu = Date.now();
  const lijst = Object.entries(regels).map(([pid, geteld])=>{
    const p = state.products.find(x=>x.id===pid); if(!p) return null;
    const v = verwachteVoorraad(p);
    return {pid, naam:p.naam, eenheid:p.eenheid, prijs:p.prijs||0, verwacht:v.verwacht, geteld:rond(geteld,3), sinds:v.sinds, basis:v.basis, vorigeT:v.vorigeT};
  }).filter(Boolean);
  if(!lijst.length) return null;
  if(!Array.isArray(state.tellingen)) state.tellingen = [];
  const t = {id:'tl'+nu, t:nu, datum:nowStr(), door:currentUser().naam, bron:bron||'telling', regels:lijst};
  state.tellingen.push(t);
  return t;
}
function tellingVerschil(r){ return rond(r.geteld - r.verwacht, 3); }
function tellingSamenvatting(t){
  let manco = 0, overschot = 0, nVerschil = 0;
  t.regels.forEach(r=>{ const v = tellingVerschil(r); if(Math.abs(v)<0.001) return; nVerschil++; const w = v*(r.prijs||0); if(w<0) manco += w; else overschot += w; });
  return {manco:rond(manco,2), overschot:rond(overschot,2), nVerschil, n:t.regels.length};
}
function sindsTekst(r){
  const delen = Object.entries(r.sinds||{}).filter(([,d])=>Math.abs(d)>0.0005).map(([s,d])=>`${d>0?'+':'−'}${fmt(Math.abs(d))} ${MUT_SOORTEN[s]||s}`);
  const begin = r.basis==='telling' ? `vorige telling ${fmt(r.verwacht - Object.values(r.sinds||{}).reduce((a,b)=>a+b,0))}` : 'eerste telling, volgens app';
  return begin + (delen.length ? ' · ' + delen.join(' · ') : '');
}
function viewVerschilrapport(){
  const ts = (state.tellingen||[]).slice().reverse();
  if(!ts.length) return `<div class="panel"><h2>Verschilrapport</h2><div class="empty">Nog geen tellingen. Na de eerste telling (Voorraad › Tellen) zie je hier per product wat er volgens de app had moeten zijn en wat je echt telde.</div></div>`;
  const sel = ts.find(t=>t.id===window._vrTelling) || ts[0];
  const alleen = window._vrAlleen!==false;
  const s = tellingSamenvatting(sel);
  const rijen = sel.regels.map(r=>({...r, v:tellingVerschil(r), w:rond(tellingVerschil(r)*(r.prijs||0),2)}))
    .filter(r=>!alleen || Math.abs(r.v)>=0.001).sort((a,b)=>Math.abs(b.w)-Math.abs(a.w) || Math.abs(b.v)-Math.abs(a.v));
  // Grootste verliezen over de laatste 90 dagen
  const grens = Date.now() - 90*864e5, top = {};
  (state.tellingen||[]).filter(t=>t.t>=grens).forEach(t=>t.regels.forEach(r=>{ const v = tellingVerschil(r); if(v>=0) return; const x = top[r.pid] = top[r.pid] || {naam:r.naam, eenheid:r.eenheid, qty:0, w:0, n:0}; x.qty = rond(x.qty+v,3); x.w = rond(x.w+v*(r.prijs||0),2); x.n++; }));
  const topLijst = Object.values(top).sort((a,b)=>a.w-b.w || a.qty-b.qty).slice(0,10);
  return `<div class="panel">
    <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap;">
      <h2 style="margin:0;">Verschilrapport</h2>
      <div class="row" style="gap:6px;">
        <button class="btn ghost small" onclick="csvVerschil()">CSV</button>
        <button class="btn ghost small" onclick="printVerschil()">Afdrukken</button>
      </div>
    </div>

/* ---------- Slim bestelvoorstel: verbruik van de voorbije weken + geplande lessen ---------- */
const DEKKING_KEUZES = [[3,'3 dagen'],[7,'1 week'],[14,'2 weken']];
function dekkingDagen(){ return window._dekking || 7; }
// Gemiddeld verbruik per week over de laatste 4 weken: uitgifte aan chefs (uit voorraad), balie (min retour) en kassa.
function verbruikPerWeek(){
  const dagen = 28, grens = Date.now() - dagen*864e5, m = {};
  state.orders.forEach(o=>{
    if(o.status==='geweigerd') return;
    const d = bkDatum(o.aangemaakt); if(!d || d.getTime()<grens) return;
    const teken = o.type==='balie_retour' ? -1 : 1;
    o.items.forEach(i=>{ const q = o.type ? i.aantal : (i.uitVoorraad!=null ? i.uitVoorraad : i.aantal); if(q) m[i.productId] = (m[i.productId]||0) + teken*q; });
  });
  (state.mutaties||[]).forEach(x=>{ if(x.s==='kassa' && x.t>=grens) m[x.pid] = (m[x.pid]||0) - x.d; });
  Object.keys(m).forEach(k=>{ m[k] = Math.max(0, rond(m[k]/(dagen/7), 3)); });
  return m;
}
// Wat geplande lessen (nog niet aangevraagd) binnen de dekking nodig hebben.
function geplandBinnen(dagen){
  const van = isoDag(new Date()), t = new Date(); t.setDate(t.getDate()+dagen); const tot = isoDag(t), m = {};
  (state.planning||[]).filter(p=>!p.orderId && p.datum>=van && p.datum<tot).forEach(p=>planRegels(p).regels.forEach(x=>{ m[x.product.id] = rond((m[x.product.id]||0)+x.aantal, 3); }));
  return m;
}
// Per product met voorraadbeheer: hoeveel bestellen om de dekking te halen zonder onder het minimum te zakken.
function slimVoorstellen(){
  const dagen = dekkingDagen(), vb = verbruikPerWeek(), gp = geplandBinnen(dagen);
  const uit = [];
  state.products.forEach(p=>{
    if(!p.opVoorraad) return;
    const vrij = vrijeVoorraad(p.id), min = p.minimum||0;
    const verbruik = vb[p.id]||0, gepland = gp[p.id]||0;
    const prognose = rond(Math.max(verbruik*dagen/7, gepland), 3);
    const nodig = rond(min + prognose, 3);
    const besteld = p.besteldStatus==='besteld';
    if(!(vrij < nodig) && !(besteld && onderMin(p))) return;
    const doel = Math.max(p.aanvulniveau||0, nodig);
    const aantal = heleVerpakking(Math.max(0, doel - vrij), p.eenheid);
    const redenen = [];
    if(vrij < min) redenen.push('onder minimum');
    if(gepland>0 && vrij - gepland < min) redenen.push('geplande lessen');
    if(verbruik>0 && verbruik*dagen/7 >= gepland && vrij - verbruik*dagen/7 < min) redenen.push('verbruik');
    if(!aantal && !besteld) return;
    uit.push({p, vrij, verbruik, gepland, aantal, redenen, besteld});
  });
  return uit.sort((a,b)=>(a.p.leverancier||'').localeCompare(b.p.leverancier||'') || a.p.naam.localeCompare(b.p.naam));
}
function zetDekking(n){ window._dekking = n; renderTabs(); renderMain(); }
function viewSlimVoorstel(){
  const lijst = slimVoorstellen(), dagen = dekkingDagen();
  const perLev = {};
  lijst.forEach(x=>{ (perLev[x.p.leverancier||''] = perLev[x.p.leverancier||''] || []).push(x); });
  const levs = Object.keys(perLev).sort();
  return `<div class="panel">
  <h2>Bestelvoorstel</h2>

  <div class="row" style="gap:6px;margin:6px 0 10px;"><span class="note" style="margin:0;">Bestellen voor:</span>${DEKKING_KEUZES.map(([n,l])=>`<button class="chip${n===dagen?' active':''}" onclick="zetDekking(${n})">${l}</button>`).join('')}</div>
  ${levs.length===0 ? '<div class="empty">Niets te bestellen voor deze periode.</div>' : levs.map(s=>{
    const lev = state.leveranciers.find(l=>l.naam.toLowerCase()===s.toLowerCase());
    return `
    <div class="row" style="justify-content:space-between; margin:16px 0 8px;">
      <h3 style="font-size:15px;margin:0;">${esc(s)||'Nog geen leverancier gekozen <span class="note" style="margin:0;font-weight:400;">(vul ze in bij Voorraad)</span>'}</h3>
      <div class="row">
        ${lev && lev.bestelurl ? `<a class="btn ghost small" href="${lev.bestelurl}" target="_blank" rel="noopener">Ga naar bestelsite ↗</a>` : ''}

      </div>
    </div>
    <div class="table-wrap">
    <table class="sv-tabel"><thead><tr><th>Product</th><th class="num-cell">Vrij</th><th class="num-cell">Verbruik/week</th><th class="num-cell">Gepland</th><th class="num-cell">Voorstel</th><th>Waarom</th><th style="width:140px;"></th></tr></thead><tbody>
    ${perLev[s].map(x=>{ const p = x.p; const ontvang = Math.max(x.aantal, heleVerpakking(Math.max(0,(p.aanvulniveau||0)-p.voorraad), p.eenheid));
      return `<tr>
        <td>${esc(p.naam)}<div class="note" style="margin:0;font-size:11.5px;">min ${fmt(p.minimum||0)} · max ${fmt(p.aanvulniveau||0)} ${esc(p.eenheid)}</div></td>
        <td class="num-cell">${fmt(x.vrij)} ${esc(p.eenheid)}</td>
        <td class="num-cell">${x.verbruik?fmt(rond(x.verbruik,1)):'—'}</td>
        <td class="num-cell">${x.gepland?fmt(x.gepland):'—'}</td>
        <td class="num-cell" style="font-weight:600;">${x.besteld?'<span class="tag pending">besteld</span>':fmt(x.aantal)+' '+esc(p.eenheid)}</td>
        <td>${x.redenen.map(r=>`<span class="tag ${r==='onder minimum'?'low':'pending'}">${r}</span>`).join(' ')}</td>
        <td style="text-align:right;">${x.besteld
          ? `<button class="btn small secondary" onclick="receiveOrder('${p.id}', ${ontvang})">Ontvangen</button>`
          : `<button class="btn small" onclick="markOrdered('${p.id}')">Markeer besteld</button>`}</td>
      </tr>`; }).join('')}
    </tbody></table>
    </div>`; }).join('')}
  </div>`;
}

// de kost per les en een rekenmodule waarmee de chef snel een gerecht of menu samenstelt en doorrekent.
const BTW_HORECA = 12;

function mijnCalculaties(){ const me = currentUser(); return (state.calculaties||[]).filter(c=>c.leerkrachtId===me.id); }
function huidigeCalc(){ const l = mijnCalculaties(); return l.find(c=>c.id===window._calcId) || null; }
// Kost per persoon van één onderdeel.
function onderdeelKost(o){
  if(o.type==='recept'){
    const r = state.recipes.find(x=>x.id===o.ref);
    if(!r) return {naam:'(recept verwijderd)', kost:0, incompleet:true, uitleg:''};
    const k = recipeKost(r, r.basisPersonen);
    const pp = (k.totaal/(r.basisPersonen||1)) * (o.porties||1);
    return {naam:r.naam, kost:rond(pp,4), incompleet:k.incompleet, uitleg:`recept voor ${fmt(r.basisPersonen)} pers., € ${fmt(rond(k.totaal,2))} totaal`};
  }
  const l = o.type==='ing' ? {ingredientId:o.ref, hoeveelheid:o.hoeveelheid||0} : {productId:o.ref, hoeveelheid:o.hoeveelheid||0};
  const i = regelInfo(l, 1);
  if(i.ontbreekt) return {naam:i.naam, eenheid:i.eenheid, kost:0, incompleet:true, uitleg:i.geenArtikel?'nog geen artikel gekoppeld':'niet gevonden'};
  return {naam:i.naam, eenheid:i.eenheid, kost:rond(i.kost||0,4), incompleet:!!i.zonderPrijs, uitleg:i.eenheidsprijs?`€ ${fmt(rond(i.eenheidsprijs,2))} per ${i.eenheid}`:'geen prijs bekend'};
}
function calcTotalen(c){
  let pp = 0, incompleet = false;
  const regels = c.onderdelen.map(o=>{ const k = onderdeelKost(o); pp += k.kost; incompleet = incompleet || k.incompleet; return {o, k}; });
  pp = rond(pp, 2);
  const fc = c.foodcost || 30;
  const verkoopExcl = rond(pp/(fc/100), 2), verkoopIncl = rond(verkoopExcl*(1+BTW_HORECA/100), 2);
  const echteFc = c.verkoopprijs>0 ? rond(pp/(c.verkoopprijs/(1+BTW_HORECA/100))*100, 1) : null;
  return {regels, pp, totaal:rond(pp*(c.personen||1),2), incompleet, verkoopExcl, verkoopIncl, echteFc};
}

function calcBewaar(c){ c.gewijzigd = Date.now(); save(); renderMain(); }
function calcNieuw(){
  if(!Array.isArray(state.calculaties)) state.calculaties = [];
  const me = currentUser();
  const c = {id:'kc'+Date.now()+Math.random().toString(36).slice(2,5), leerkrachtId:me.id, naam:'Nieuw gerecht', personen:10, foodcost:30, verkoopprijs:0, onderdelen:[]};
  state.calculaties.push(c); window._calcId = c.id; window._calcQ = '';
  calcBewaar(c);
}
function calcOpen(id){ window._calcId = id; window._calcQ = ''; renderMain(); }
function calcZet(veld, val){
  const c = huidigeCalc(); if(!c) return;
  if(veld==='naam'){ c.naam = String(val).trim() || 'Naamloos'; }
  else { const n = parseFloat(String(val).replace(',','.')); if(veld==='personen') c.personen = n>0?n:1; else if(veld==='foodcost') c.foodcost = n>0?Math.min(n,100):30; else if(veld==='verkoopprijs') c.verkoopprijs = n>0?n:0; }

// Periode van een taak: week (ma–zo), kalendermaand of schooltrimester (sep–dec, jan–mrt, apr–aug).
function hdPeriode(freq, iso){
  const d = new Date(iso+'T12:00:00');
  if(freq==='week'){ const m = maandagVan(d); const e = new Date(m); e.setDate(m.getDate()+6); return [isoDag(m), isoDag(e)]; }
  if(freq==='maand'){ return [isoDag(new Date(d.getFullYear(), d.getMonth(), 1, 12)), isoDag(new Date(d.getFullYear(), d.getMonth()+1, 0, 12))]; }
  if(freq==='trimester'){ const j = d.getFullYear(), m = d.getMonth(); const [a,b,jj] = m>=8 ? [8,11,j] : m<=2 ? [0,2,j] : [3,7,j]; return [isoDag(new Date(jj,a,1,12)), isoDag(new Date(jj,b+1,0,12))]; }
  return [iso, iso];

// Taak is gedaan als ze ergens in dezelfde periode afgevinkt werd.
function hdGedaan(k, iso, C){

  const [van, tot] = hdPeriode(k.freq, iso);
  const dagen = Object.keys(C.dagen).filter(d=>d>=van && d<=tot).sort();
  for(const d of dagen){ const r = C.dagen[d]; if(r && r.taken && r.taken[k.id]) return {iso:d, ...r.taken[k.id]}; }

function hdWie(){ return {tijd: new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}), door: currentUser().naam}; }
function hdTemp(tid, val){
  const r = hdRec(hdDag(), true); if(r.afgetekend) return;
  const s = String(val).trim().replace(',','.');
  if(s===''){ delete r.temps[tid]; save(); renderMain(); return; }
  const n = parseFloat(s); if(isNaN(n)){ renderMain(); return; }
  r.temps[tid] = {...(r.temps[tid]||{}), v:n, ...hdWie()};
  const t = (hdC().toestellen||[]).find(x=>x.id===tid);
  save(); renderMain();
  if(t && n>t.max) toast(`${t.naam} is te warm (${fmt(n)} °C, max ${fmt(t.max)} °C). Noteer wat je gedaan hebt en controleer de producten erin.`);
}
function hdActie(tid, val){ const r = hdRec(hdDag(), true); if(r.afgetekend || !r.temps[tid]) return; r.temps[tid].actie = String(val).trim(); save(); renderMain(); }
function hdTaak(kid, aan){ const r = hdRec(hdDag(), true); if(r.afgetekend) return; if(aan) r.taken[kid] = hdWie(); else delete r.taken[kid]; save(); renderTabs(); renderMain(); }
function hdOpmerking(val){ const r = hdRec(hdDag(), true); if(r.afgetekend) return; r.opmerking = String(val); save(); }
function hdAftekenen(){
  const iso = hdDag(), st = hdStatus(iso), C = hdC();
  if(st.tempsOpen){ toast(`Nog ${st.tempsOpen} ${st.tempsOpen===1?'temperatuur':'temperaturen'} in te vullen voor je kan aftekenen.`); return; }
  if(st.zonderActie){ toast('Een toestel was te warm. Noteer eerst wat je gedaan hebt.'); return; }
  if(st.takenOpen && !confirm(`${st.takenOpen} taak/taken van vandaag zijn nog niet afgevinkt. Toch aftekenen?`)) return;
  const r = hdRec(iso, true); r.afgetekend = hdWie();
  state.activity.push({tijd:nowStr(), tekst:`HACCP ${C.mag?'magazijn':C.naam} van ${iso} afgetekend door ${currentUser().naam}.`});
  save(); renderTabs(); renderMain(); toast('Dag afgetekend.');
}
function hdHeropen(){ const r = hdRec(hdDag(), true); if(!confirm('Aftekening ongedaan maken?')) return; delete r.afgetekend; save(); renderTabs(); renderMain(); }
function hdToestelZet(id, veld, val){ const t = hdC().toestellen.find(x=>x.id===id); if(!t) return; if(veld==='max'){ const n = parseFloat(String(val).replace(',','.')); if(!isNaN(n)) t.max = n; } else t[veld] = veld==='naam' ? (String(val).trim()||t.naam) : val; save(); renderMain(); }
function hdToestelNieuw(){ hdC().toestellen.push({id:'hk'+Date.now(), naam:'Nieuw toestel', type:'koel', max:4}); save(); renderMain(); }
function hdToestelWeg(id){ if(!confirm('Toestel verwijderen? Eerdere metingen blijven in het register.')) return; const C = hdC(); C.toestellen = C.toestellen.filter(x=>x.id!==id); save(); renderMain(); }
function hdTaakZet(id, veld, val){ const k = hdC().taken.find(x=>x.id===id); if(!k) return; k[veld] = veld==='naam' ? (String(val).trim()||k.naam) : val; save(); renderMain(); }
function hdTaakNieuw(){ hdC().taken.push({id:'ht'+Date.now(), naam:'Nieuwe taak', freq:'dag'}); save(); renderMain(); }
function hdTaakWeg(id){ if(!confirm('Taak verwijderen?')) return; const C = hdC(); C.taken = C.taken.filter(x=>x.id!==id); save(); renderMain(); }
function hdMaandDagen(){ const d = new Date(hdDag()+'T12:00:00'); const j = d.getFullYear(), m = d.getMonth(); const uit = []; for(let i=1;i<=31;i++){ const x = new Date(j,m,i,12); if(x.getMonth()!==m) break; uit.push(isoDag(x)); } return uit; }
function printHaccpDag(){
  const C = hdC(), dagen = hdMaandDagen(), ts = C.toestellen||[], ks = C.taken||[];
  const maand = new Date(dagen[0]+'T12:00:00').toLocaleDateString('nl-BE',{month:'long', year:'numeric'});
  const periodiek = ks.filter(k=>k.freq!=='dag');
  printDoc(`<h1>HACCP-register ${maand}</h1><div class="meta">Coloma · Huis van de Gastronomie — ${C.mag?'magazijn':esc(C.naam)}. Temperaturen in °C; normen: ${ts.map(t=>`${esc(t.naam)} max ${fmt(t.max)}`).join(', ')}.</div>
  <table><thead><tr><th>Dag</th>${ts.map(t=>`<th>${esc(t.naam)}</th>`).join('')}<th>Dagtaken</th><th>Actie / opmerking</th><th>Afgetekend</th></tr></thead><tbody>
  ${dagen.map(di=>{ const r = C.dagen[di]; const wd = new Date(di+'T12:00:00').getDay(); if(!r && (wd===0||wd===6)) return ''; const dagTaken = ks.filter(k=>k.freq==='dag'); return `<tr><td>${new Date(di+'T12:00:00').toLocaleDateString('nl-BE',{weekday:'short',day:'numeric'})}</td>${ts.map(t=>{ const m = r && r.temps[t.id]; return `<td>${m && m.v!=null ? fmt(+m.v)+(+m.v>t.max?' ⚠':'') : ''}</td>`; }).join('')}<td>${r ? dagTaken.filter(k=>r.taken[k.id]).length+'/'+dagTaken.length : ''}</td><td>${r ? esc([...ts.map(t=>r.temps[t.id]&&r.temps[t.id].actie?t.naam+': '+r.temps[t.id].actie:'').filter(Boolean), r.opmerking||''].filter(Boolean).join(' · ')) : ''}</td><td>${r && r.afgetekend ? esc(r.afgetekend.door)+' '+esc(r.afgetekend.tijd) : ''}</td></tr>`; }).join('')}
  </tbody></table>
  ${periodiek.length ? `<h2>Wekelijkse en grote schoonmaak</h2><table><thead><tr><th>Taak</th><th>Hoe vaak</th><th>Gedaan in ${maand}</th></tr></thead><tbody>${periodiek.map(k=>{ const keer = dagen.filter(di=>C.dagen[di] && C.dagen[di].taken[k.id]).map(di=>`${new Date(di+'T12:00:00').toLocaleDateString('nl-BE',{day:'numeric',month:'short'})} (${esc(C.dagen[di].taken[k.id].door)})`); return `<tr><td>${esc(k.naam)}</td><td>${(HD_FREQ.find(f=>f[0]===k.freq)||[,,k.freq])[2]}</td><td>${keer.join(', ')||'—'}</td></tr>`; }).join('')}</tbody></table>` : ''}`, 'HACCP-register '+maand);
}
function csvHaccpDag(){
  const C = hdC(), ts = C.toestellen||[], ks = C.taken||[];

  if(!dagen.length){ toast('Nog geen dagtaken ingevuld.'); return; }

    dagen.map(di=>{ const r = C.dagen[di]; return [di, ...ts.map(t=>r.temps[t.id] && r.temps[t.id].v!=null ? String(r.temps[t.id].v).replace('.',',') : ''), ks.filter(k=>r.taken[k.id]).map(k=>k.naam).join(' | '), ts.map(t=>r.temps[t.id]&&r.temps[t.id].actie?t.naam+': '+r.temps[t.id].actie:'').filter(Boolean).join(' | '), r.opmerking||'', r.afgetekend?r.afgetekend.door:'', r.afgetekend?r.afgetekend.tijd:'']; }));
}

      <select aria-label="Locatie ${esc(p.naam)}" onchange="locProduct('${p.id}',this.value)"><option value="">Volgens categorie (${esc((ls.find(l=>(l.cats||[]).includes(p.categorie))||{naam:'geen'}).naam)})</option>${ls.map(l=>`<option value="${l.id}" ${p.locatie===l.id?'selected':''}>${esc(l.naam)}</option>`).join('')}</select></div>`).join('') || (q.length>=2?'<div class="empty">Geen producten gevonden.</div>':'')}
    ${state.products.some(p=>p.locatie) ? `<div class="section-title">Eigen plaats ingesteld</div>${state.products.filter(p=>p.locatie).map(p=>`<div class="lc-prod"><span>${esc(p.naam)}<small>${esc(locNaam(p))}</small></span><button class="btn ghost small" onclick="locProduct('${p.id}','')">Terug naar categorie</button></div>`).join('')}` : ''}

}
function locZet(id, naam){ const l = state.locaties.find(x=>x.id===id); if(!l) return; l.naam = String(naam).trim() || l.naam; save(); renderMain(); }
function locSchuif(id, d){ const i = state.locaties.findIndex(x=>x.id===id); const j = i+d; if(i<0 || j<0 || j>=state.locaties.length) return; const [l] = state.locaties.splice(i,1); state.locaties.splice(j,0,l); save(); renderMain(); }
function locWeg(id){ const l = state.locaties.find(x=>x.id===id); if(!l || !confirm(`Locatie "${l.naam}" verwijderen? Producten die hier stonden volgen weer hun categorie.`)) return; state.locaties = state.locaties.filter(x=>x.id!==id); state.products.forEach(p=>{ if(p.locatie===id) delete p.locatie; }); save(); renderMain(); }
function locNieuw(){ state.locaties.push({id:'lc'+Date.now(), naam:'Nieuwe locatie', cats:[]}); save(); renderMain(); }
// Een categorie staat standaard op één plaats: aanklikken verplaatst ze hierheen.
function locCat(id, cat){ const l = state.locaties.find(x=>x.id===id); if(!l) return; const had = (l.cats||[]).includes(cat); state.locaties.forEach(x=>{ x.cats = (x.cats||[]).filter(c=>c!==cat); }); if(!had) l.cats.push(cat); save(); renderMain(); }
function locProduct(pid, lid){ const p = state.products.find(x=>x.id===pid); if(!p) return; if(lid) p.locatie = lid; else delete p.locatie; save(); renderMain(); }

/* ---------- Kelderbeheer: wijn, bier en frisdranken (Stefan 2026-10-07) ---------- */

//                    voorraad (flessen/blikken/vaten), minimum, aankoop (€ per stuk excl. btw), verkoop (€ per fles), glas (€ per glas),

// state.kelderMut = [{t, kid, d, soort:'in'|'uit'|'breuk'|'telling', voor, door, prijs}]
const KELDER_SOORTEN = [['wijn','Wijn','🍷'],['bubbels','Bubbels','🥂'],['bier','Bier','🍺'],['fris','Frisdrank & water','🥤'],['sterk','Sterke drank','🥃'],['overig','Overig','🧃']];
const WIJN_KLEUREN = ['rood','wit','rosé','dessert','oranje'];
const KELDER_VOOR = ['Restaurant 1','Restaurant 2','Restaurant 3','Bar / self','Les wijnkennis','Proeverij','Receptie / evenement'];
function kSoort(s){ return KELDER_SOORTEN.find(x=>x[0]===s) || KELDER_SOORTEN[5]; }
function kNaam(k){ return k.naam + (k.jaargang?' '+k.jaargang:''); }
function kMag(){ return currentUser().rol==='keldermeester'; }
function kMut(k, d, soort, extra){
  if(!Array.isArray(state.kelderMut)) state.kelderMut = [];
  state.kelderMut.push(Object.assign({t:Date.now(), kid:k.id, d:rond(d,2), soort, door:currentUser().naam}, extra||{}));
  if(state.kelderMut.length>20000) state.kelderMut.splice(0, 2000);
}
function kDrinkStatus(k){
  if(!k.drinkTot || !(k.voorraad>0)) return null;
  const j = new Date().getFullYear();
  return k.drinkTot < j ? 'over' : k.drinkTot === j ? 'nu' : null;
}
function kLijst(){
  const q = (window._kQ||'').trim().toLowerCase(), s = window._kSoort||'alle', f = window._kFilter||'';
  return (state.kelder||[]).filter(k=>!k.uit || f==='uit')
    .filter(k=>s==='alle' || k.soort===s)
    .filter(k=>!q || [k.naam,k.producent,k.regio,k.druif,k.plaats,k.jaargang,k.leverancier].some(v=>String(v||'').toLowerCase().includes(q)))
    .filter(k=>!f || (f==='laag' && (k.voorraad||0) < (k.minimum||0)) || (f==='drink' && kDrinkStatus(k)) || (f==='uit' && k.uit))
    .sort((a,b)=>KELDER_SOORTEN.findIndex(x=>x[0]===a.soort)-KELDER_SOORTEN.findIndex(x=>x[0]===b.soort) || String(a.plaats||'').localeCompare(String(b.plaats||''),'nl',{numeric:true}) || a.naam.localeCompare(b.naam,'nl'));
}
function kModus(m){ window._kModus = m; window._kEdit = null; renderMain(); }
function viewKelder(){
  if(!Array.isArray(state.kelder)) state.kelder = [];

  const waardeV = actief.reduce((s,k)=>s+(k.voorraad||0)*(k.verkoop||0),0);
  const laag = actief.filter(k=>(k.voorraad||0)<(k.minimum||0)).length;
  const drink = actief.filter(k=>kDrinkStatus(k)).length;
  const knop = (id,l)=>`<button class="chip${m===id?' active':''}" onclick="kModus('${id}')">${l}</button>`;
  return `<div class="cards k-cards">

    <div class="card"><div class="num">${laag}</div><div class="lbl">onder minimum${drink?` · ${drink} op dronk`:''}</div></div>

function kBewaar(id){
  const f = document.getElementById('kForm'), g = n=>{ const el = f.querySelector(`[name="${n}"]`); return el ? el.value.trim() : ''; };
  const num = n=>{ const x = parseFloat(g(n).replace(',','.')); return isNaN(x) ? null : x; };
  if(!g('naam')){ toast('Geef een naam op.'); return; }
  let k = id ? state.kelder.find(x=>x.id===id) : null;
  const nieuw = !k;
  if(nieuw){ k = {id:'kl'+Date.now()+Math.random().toString(36).slice(2,5), voorraad:0}; state.kelder.push(k); }
  ['soort','naam','producent','kleur','regio','druif','verpakking','plaats','leverancier','notitie'].forEach(n=>{ k[n] = g(n); });
  ['jaargang','inhoud','minimum','aankoop','verkoop','glas','drinkTot'].forEach(n=>{ k[n] = num(n); });
  const vr = Math.max(0, num('voorraad')||0);
  if(vr !== (k.voorraad||0)){ kMut(k, vr-(k.voorraad||0), nieuw?'in':'telling', {voor: nieuw?'beginvoorraad':'correctie bij bewerken', prijs:k.aankoop||0}); k.voorraad = vr; }
  window._kEdit = null; save(); renderMain();
}
function kUitAssortiment(id){ const k = state.kelder.find(x=>x.id===id); if(!k) return; k.uit = !k.uit; window._kEdit = null; save(); renderMain(); }
function kSnel(id, d){
  const k = state.kelder.find(x=>x.id===id); if(!k) return;
  if(d<0 && !(k.voorraad>0)){ toast(`${kNaam(k)}: er staat niets meer in de kelder volgens het kelderboek. Tel na of boek eerst een levering in.`); return; }
  k.voorraad = rond((k.voorraad||0)+d, 2); kMut(k, d, d<0?'uit':'in', {voor: d<0?'snel uit':'snel in'}); save(); renderMain();
}
// Inslaan (levering) of uitgifte: een lijst regels in één keer boeken.

           <label>Les, klas of opmerking<input value="${esc(b.ref)}" placeholder="bv. 6HB, receptie 12/10" oninput="window._kBew.ref=this.value"></label>`}
    </div>
    <label class="kp-zoeklabel">Artikel toevoegen<input id="kBZoek" placeholder="Zoek in de kelder…" value="${esc(window._kBQ||'')}" autocomplete="off"></label>
    ${kand.length ? `<div class="kp-zoekres">${kand.map(k=>`<button class="kp-res" onclick="kBewRegel('${k.id}',1)">${kSoort(k.soort)[2]} ${esc(kNaam(k))} <small>${esc(k.plaats||'')} · ${fmt(k.voorraad||0)} in kelder</small></button>`).join('')}</div>` : (q.length>=2?'<p class="note">Niets gevonden. Nieuw artikel? Maak het eerst aan in het kelderboek.</p>':'')}
    ${regels.length ? `<div class="table-wrap" style="margin-top:10px;"><table><thead><tr><th>Artikel</th><th class="num-cell">Aantal</th>${m==='in'?'<th class="num-cell">Aankoop/stuk</th>':''}<th class="num-cell">In kelder</th><th></th></tr></thead><tbody>
      ${regels.map(({k,n})=>`<tr><td>${esc(kNaam(k))}<div class="k-meta">${esc(k.plaats||'')}</div></td>
        <td class="num-cell"><input type="number" min="0" step="1" value="${n}" style="width:80px;" aria-label="Aantal" onchange="kBewRegel('${k.id}',this.value,true)"></td>

        <td style="text-align:right;"><button class="btn ghost small" onclick="kBewRegel('${k.id}',0,true)" aria-label="Weghalen">✕</button></td></tr>`).join('')}

  </div>`;
}
function kBewRegel(id, n, vast){
  const b = window._kBew; const x = parseFloat(String(n).replace(',','.'))||0;
  const nieuw = vast ? x : (b.regels[id]||0) + x;
  if(nieuw>0) b.regels[id] = nieuw; else delete b.regels[id];
  if(!vast) window._kBQ = '';
  renderMain();
}
function kBewPrijs(id, val){ const k = state.kelder.find(x=>x.id===id); if(!k) return; const x = parseFloat(String(val).replace(',','.')); k._nieuwePrijs = isNaN(x) ? null : x; renderMain(); }
function kBewBoek(){
  const b = window._kBew, m = b.m;
  const regels = Object.entries(b.regels).map(([id,n])=>({k:state.kelder.find(x=>x.id===id), n})).filter(r=>r.k && r.n>0);
  if(!regels.length) return;
  if(m==='uit' && !b.voor){ toast('Kies eerst voor wie de uitgifte is.'); return; }
  const tekort = m==='uit' ? regels.filter(r=>r.n>(r.k.voorraad||0)) : [];
  if(tekort.length && !confirm(`Volgens het kelderboek is er te weinig van: ${tekort.map(r=>kNaam(r.k)).join(', ')}. Toch boeken? De voorraad wordt dan 0 en je telt best na.`)) return;
  regels.forEach(({k,n})=>{
    if(m==='in'){ if(k._nieuwePrijs!=null && k._nieuwePrijs!==k.aankoop){ k.aankoop = k._nieuwePrijs; } delete k._nieuwePrijs; k.voorraad = rond((k.voorraad||0)+n, 2); kMut(k, n, 'in', {voor:b.ref||'levering', prijs:k.aankoop||0}); }
    else { const echt = Math.min(n, Math.max(0,k.voorraad||0)); k.voorraad = rond((k.voorraad||0)-echt, 2); kMut(k, -echt, b.voor==='Breuk'?'breuk':'uit', {voor:b.voor+(b.ref?' · '+b.ref:''), prijs:k.verkoop||0}); }
  });
  state.activity.push({tijd:nowStr(), tekst:`Kelder: ${m==='in'?'levering ingeboekt':'uitgifte voor '+b.voor} (${regels.reduce((s,r)=>s+r.n,0)} stuks) door ${currentUser().naam}.`});
  if(m==='in' && b.bestelling){ const kb = (state.kelderBestellingen||[]).find(x=>x.id===b.bestelling); if(kb){ kb.regels.forEach(r=>{ r.ontv = b.regels[r.kid]||0; }); kb.status = 'geleverd'; kb.geleverd = {t:nowStr(), door:currentUser().naam}; } }
  window._kBew = null; window._kBQ = ''; save(); renderMain();
  toast(m==='in'?'Levering ingeboekt in het kelderboek.':'Uitgifte geboekt.');
}

  const n = Object.keys(c).length; let vorige = null;
  return `<div class="panel">
    <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap;"><h2 style="margin:0;">Kelder tellen</h2>

    <p class="note">Per plaats in de kelder, zodat je één keer rondloopt. Vul in wat er echt staat; pas bij opslaan wordt het kelderboek aangepast en zie je de verschillen.</p>
    ${lijst.map(k=>{ const kop = (k.plaats||'Zonder plaats')!==vorige ? `<h3 class="tel-cat">📍 ${esc(k.plaats||'Zonder plaats')}</h3>` : ''; vorige = k.plaats||'Zonder plaats'; const w = c[k.id];

function kTelZet(id, val){ const t = String(val).trim(); if(t===''){ delete window._kTel[id]; } else { const x = parseFloat(t.replace(',','.')); if(!isNaN(x) && x>=0) window._kTel[id] = x; } renderMain(); }
function kTelOpslaan(){
  const c = window._kTel||{}; let verschil = 0, waarde = 0;
  Object.entries(c).forEach(([id,n])=>{ const k = state.kelder.find(x=>x.id===id); if(!k) return; const d = rond(n-(k.voorraad||0),2); if(d){ verschil++; waarde += d*(k.aankoop||0); kMut(k, d, 'telling', {voor:'telling', prijs:k.aankoop||0}); } k.voorraad = n; k.geteld = nowStr(); });
  const aantal = Object.keys(c).length; window._kTel = {};
  state.activity.push({tijd:nowStr(), tekst:`Kelder geteld door ${currentUser().naam}: ${aantal} artikels, ${verschil} met verschil (${euro(waarde)}).`});
  save(); renderMain();
  toast(`Telling opgeslagen: ${aantal} artikels geteld, ${verschil} met een verschil${verschil?` (samen ${euro(waarde)} aan aankoopprijs)`:''}. Je ziet ze in de historiek.`);
}
function viewKelderHistoriek(){
  const lijst = (state.kelderMut||[]).slice().reverse().slice(0, window._kHToon||150);

  ${lijst.length?`<div class="table-wrap" style="margin-top:8px;"><table><thead><tr><th>Wanneer</th><th>Soort</th><th>Artikel</th><th class="num-cell">Aantal</th><th>Voor / bron</th><th>Door</th></tr></thead><tbody>
  ${lijst.map(x=>{ const k = (state.kelder||[]).find(y=>y.id===x.kid); const l = lab[x.soort]||[x.soort,'none']; return `<tr><td>${new Date(x.t).toLocaleString('nl-BE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td><span class="tag ${l[1]}">${l[0]}</span></td><td>${esc(k?kNaam(k):'(verwijderd)')}</td><td class="num-cell">${x.d>0?'+':''}${fmt(x.d)}</td><td>${esc(x.voor||'')}</td><td>${esc(x.door||'')}</td></tr>`; }).join('')}
  </tbody></table></div>`:'<div class="empty">Nog geen bewegingen.</div>'}</div>`;
}
function kVoorstel(k){ const ruw = Math.max(0, 2*(k.minimum||0) - (k.voorraad||0)); const m = String(k.verpakking||'').match(/(\d+)/); const per = m ? parseInt(m[1],10) : 1; return per>1 ? Math.ceil(ruw/per)*per : Math.ceil(ruw); }
// Kelderbestelling (Stefan 2026-10-09): de keldermeester stelt de bestelling samen en stuurt ze naar het economaat;
// het economaat bestelt bij de leverancier; bij levering boekt de keldermeester ze in via Inslaan.
// state.kelderBestellingen = [{id, nr, t, door, opm, regels:[{kid, naam, producent, verpakking, leverancier, n, ontv}],
//                             status:'ingediend'|'besteld'|'geleverd'|'geannuleerd', besteld:{t,door}, geleverd:{t,door}}]
const KB_STATUS = {ingediend:['Bij het economaat','pending'], besteld:['Besteld bij leverancier','low'], geleverd:['Geleverd','ok'], geannuleerd:['Geannuleerd','none']};
function kbTag(b){ const s = KB_STATUS[b.status]||[b.status,'none']; return `<span class="tag ${s[1]}">${s[0]}</span>`; }
function kbLijst(){ return state.kelderBestellingen || (state.kelderBestellingen = []); }
// Wat al onderweg is (ingediend of besteld) per artikel, zodat het voorstel het niet dubbel bestelt.
function kbOnderweg(kid){ return kbLijst().filter(b=>b.status==='ingediend'||b.status==='besteld').reduce((s,b)=>s+b.regels.filter(r=>r.kid===kid).reduce((x,r)=>x+r.n,0),0); }
function kbConcept(){
  if(window._kbConcept) return window._kbConcept;
  const regels = {};
  (state.kelder||[]).filter(k=>!k.uit && (k.voorraad||0)+kbOnderweg(k.id)<(k.minimum||0)).forEach(k=>{ const n = kVoorstel({...k, voorraad:(k.voorraad||0)+kbOnderweg(k.id)}); if(n>0) regels[k.id] = n; });
  return (window._kbConcept = {regels, opm:''});
}

    <p class="note">Klaargezet: alles onder het minimum, aangevuld tot twee keer het minimum en afgerond op de verpakking. Wat al besteld is, telt mee. Pas de aantallen aan of voeg iets toe, en stuur de bestelling naar het economaat. Het economaat bestelt bij de leverancier.</p>
    <label class="kp-zoeklabel">Artikel toevoegen<input id="kbZoek" placeholder="Zoek in de kelder…" value="${esc(window._kbQ||'')}" autocomplete="off"></label>
    ${kand.length ? `<div class="kp-zoekres">${kand.map(k=>`<button class="kp-res" onclick="kbZet('${k.id}',${Math.max(1,kVoorstel(k))})">${kSoort(k.soort)[2]} ${esc(kNaam(k))} <small>${esc(k.leverancier||'geen leverancier')} · ${fmt(k.voorraad||0)} in kelder</small></button>`).join('')}</div>` : (q.length>=2?'<p class="note">Niets gevonden. Nieuw artikel? Maak het eerst aan in het kelderboek.</p>':'')}
    ${regels.length ? Object.entries(per).map(([l,rs])=>`<div class="section-title">${esc(l)}</div>${rs.map(({k,n})=>`<div class="ka-mand"><span>${kSoort(k.soort)[2]} ${esc(kNaam(k))}<small class="k-meta"> ${esc([k.producent, k.verpakking].filter(Boolean).join(' · '))} · ${fmt(k.voorraad||0)} in kelder, min ${fmt(k.minimum||0)}${kbOnderweg(k.id)?` · ${fmt(kbOnderweg(k.id))} onderweg`:''}</small></span>

      + `<label class="hd-opm">Opmerking voor het economaat<textarea rows="2" placeholder="bv. nodig voor de receptie van 24/10" oninput="window._kbConcept.opm=this.value">${esc(c.opm||'')}</textarea></label>

      : '<div class="empty">Niets onder het minimum. Zoek hierboven een artikel om toch te bestellen.</div>'}
  </div>
  <div class="panel"><h2>Mijn kelderbestellingen</h2>
    ${mijn.length ? mijn.map(b=>`<div class="ka-blok"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><strong>${esc(b.nr)}</strong> · ${esc(b.t)}<div class="k-meta">${b.regels.reduce((s,r)=>s+r.n,0)} stuks · ${[...new Set(b.regels.map(r=>r.leverancier||'geen leverancier'))].map(esc).join(', ')}${b.besteld?` · besteld ${esc(b.besteld.t)}`:''}</div></div>${kbTag(b)}</div>

  </div>`;
}
function kbZet(id, val){ const c = kbConcept(); const n = Math.max(0, Math.round(parseFloat(String(val).replace(',','.'))||0)); if(n) c.regels[id] = n; else delete c.regels[id]; window._kbQ = ''; renderMain(); }
function kbIndienen(){
  const c = kbConcept();
  const regels = Object.entries(c.regels).map(([kid,n])=>({k:state.kelder.find(x=>x.id===kid), n})).filter(r=>r.k && r.n>0)
    .map(({k,n})=>({kid:k.id, naam:kNaam(k), producent:k.producent||'', verpakking:k.verpakking||'', leverancier:k.leverancier||'', n}));
  if(!regels.length) return;
  const lijst = kbLijst(); const nr = 'KB' + String(lijst.length+1).padStart(3,'0');
  lijst.push({id:'kb'+Date.now(), nr, t:nowStr(), door:currentUser().naam, opm:c.opm||'', regels, status:'ingediend'});
  state.activity.push({tijd:nowStr(), tekst:`Kelderbestelling ${nr} (${regels.reduce((s,r)=>s+r.n,0)} stuks) naar het economaat gestuurd door ${currentUser().naam}.`});
  window._kbConcept = null; save(); renderMain();
  toast(`Bestelling ${nr} staat bij het economaat. Je ziet hier wanneer ze besteld is.`);
}
function kbAnnuleer(id){ const b = kbLijst().find(x=>x.id===id); if(!b || b.status!=='ingediend' || !confirm(`Bestelling ${b.nr} annuleren?`)) return; b.status = 'geannuleerd'; save(); renderTabs(); renderMain(); }
// Levering ontvangen: Inslaan openen met de bestelde aantallen; bij het inboeken wordt de bestelling afgesloten.
function kbOntvang(id){
  const b = kbLijst().find(x=>x.id===id); if(!b) return;
  const regels = {}; b.regels.forEach(r=>{ if(state.kelder.some(k=>k.id===r.kid)) regels[r.kid] = (regels[r.kid]||0) + r.n; });
  window._kBew = {m:'in', regels, voor:'', ref:`${b.nr} · ${[...new Set(b.regels.map(r=>r.leverancier).filter(Boolean))].join(', ')}`, bestelling:b.id};
  window._kModus = 'in'; window._kEdit = null; window.scrollTo(0,0); renderMain();
}
function printKelderBestel(){
  const c = kbConcept();
  const regels = Object.entries(c.regels).map(([kid,n])=>({k:state.kelder.find(x=>x.id===kid), n})).filter(r=>r.k).sort((a,b)=>String(a.k.leverancier||'').localeCompare(String(b.k.leverancier||'')));
  printDoc(`<h1>Bestellijst kelder</h1><div class="meta">${nowStr()}</div><table><thead><tr><th>Leverancier</th><th>Artikel</th><th>Verpakking</th><th>Bestellen</th></tr></thead><tbody>${regels.map(({k,n})=>`<tr><td>${esc(k.leverancier||'')}</td><td>${esc(kNaam(k))} ${esc(k.producent||'')}</td><td>${esc(k.verpakking||'')}</td><td>${fmt(n)}</td></tr>`).join('')}</tbody></table>`, 'Bestellijst kelder');

function kbBesteld(id){ const b = kbLijst().find(x=>x.id===id); if(!b) return; b.status = 'besteld'; b.besteld = {t:nowStr(), door:currentUser().naam}; state.activity.push({tijd:nowStr(), tekst:`Kelderbestelling ${b.nr} besteld door ${currentUser().naam}.`}); save(); renderTabs(); renderMain(); }

  printDoc(`<h1>Kelderboek</h1><div class="meta">${nowStr()} · ${l.length} artikels · waarde aankoop ${euro(l.reduce((s,k)=>s+(k.voorraad||0)*(k.aankoop||0),0))}</div><table><thead><tr><th>Artikel</th><th>Producent</th><th>Plaats</th><th>Voorraad</th><th>Aankoop</th>${mag?'<th>Verkoop</th>':''}</tr></thead><tbody>${l.map(k=>`<tr><td>${esc(kNaam(k))}</td><td>${esc(k.producent||'')}</td><td>${esc(k.plaats||'')}</td><td>${fmt(k.voorraad||0)}</td><td>${k.aankoop?euro(k.aankoop):''}</td>${mag?`<td>${k.verkoop?euro(k.verkoop):''}</td>`:''}</tr>`).join('')}</tbody></table>`, 'Kelderboek');

function printKelderTellijst(){
  const l = (state.kelder||[]).filter(k=>!k.uit).sort((a,b)=>String(a.plaats||'~').localeCompare(String(b.plaats||'~'),'nl',{numeric:true}) || a.naam.localeCompare(b.naam,'nl'));
  printDoc(`<h1>Tellijst kelder</h1><div class="meta">${new Date().toLocaleDateString('nl-BE')}</div><table><thead><tr><th>Plaats</th><th>Artikel</th><th style="width:110px;">Geteld</th></tr></thead><tbody>${l.map(k=>`<tr><td>${esc(k.plaats||'')}</td><td>${esc(kNaam(k))} ${esc(k.producent||'')}</td><td></td></tr>`).join('')}</tbody></table>`, 'Tellijst kelder');
}
// Wijnkaart: alles met een verkoopprijs en voorraad, per soort en kleur.
function printWijnkaart(){
  const l = (state.kelder||[]).filter(k=>!k.uit && k.verkoop>0 && (k.voorraad||0)>0);
  if(!l.length){ toast('Er zijn nog geen artikels met een verkoopprijs en voorraad.'); return; }
  const groepen = [];
  KELDER_SOORTEN.forEach(([s,naam])=>{ const g = l.filter(k=>k.soort===s); if(!g.length) return;
    if(s==='wijn') WIJN_KLEUREN.concat(['']).forEach(c=>{ const gg = g.filter(k=>(k.kleur||'')===c); if(gg.length) groepen.push([c?'Wijn '+c:'Wijn', gg]); });
    else groepen.push([naam, g]); });
  printDoc(`<h1>Wijn- en drankkaart</h1><div class="meta">Coloma · Huis van de Gastronomie</div>${groepen.map(([t,g])=>`<h2>${esc(t)}</h2><table><tbody>${g.sort((a,b)=>a.naam.localeCompare(b.naam,'nl')).map(k=>`<tr><td><strong>${esc(kNaam(k))}</strong><br><span style="font-size:11.5px;">${esc([k.producent,k.regio,k.druif].filter(Boolean).join(' · '))}${k.notitie?'<br><em>'+esc(k.notitie)+'</em>':''}</span></td><td style="width:90px;">${k.glas?'glas '+euro(k.glas):''}</td><td style="width:90px;">${euro(k.verkoop)}</td></tr>`).join('')}</tbody></table>`).join('')}`, 'Wijnkaart');
}

}

/* ---------- Kelder: aanvragen van zaal / maître, klaargezet door de keldermeester (Stefan 2026-10-07) ---------- */
// state.kelderAanvragen = [{id, uid, naam, voor, ref, nodigOp, regels:[{kid, n, mee}], status:'ingediend'|'klaargezet'|'meegegeven'|'geannuleerd', t, klaar, mee}]
// Koks bestellen niet in de kelder; enkel de rol 'zaal' vraagt aan, de rol 'keldermeester' beheert.
const KA_STATUS = {ingediend:['Ingediend','pending'], klaargezet:['Klaargezet','low'], meegegeven:['Meegegeven','ok'], geannuleerd:['Geannuleerd','none']};
function kaOpen(){ return (state.kelderAanvragen||[]).filter(a=>a.status==='ingediend'||a.status==='klaargezet'); }
function kaTag(a){ const s = KA_STATUS[a.status]||[a.status,'none']; return `<span class="tag ${s[1]}">${s[0]}</span>`; }
function kaDatum(iso){ return iso ? new Date(iso+'T12:00').toLocaleDateString('nl-BE',{weekday:'short', day:'numeric', month:'short'}) : 'zo snel mogelijk'; }
// Zaal: drank aanvragen
function viewKelderAanvragen(){
  const z = window._kaNieuw || (window._kaNieuw = {regels:{}, voor:'', ref:'', nodigOp:isoDag(new Date())});
  const q = (window._kaQ||'').trim().toLowerCase(), s = window._kaSoort||'alle';
  const lijst = (state.kelder||[]).filter(k=>!k.uit && (s==='alle'||k.soort===s) && (!q || [k.naam,k.producent,k.regio,k.druif,k.jaargang].some(v=>String(v||'').toLowerCase().includes(q))))
    .sort((a,b)=>KELDER_SOORTEN.findIndex(x=>x[0]===a.soort)-KELDER_SOORTEN.findIndex(x=>x[0]===b.soort) || a.naam.localeCompare(b.naam,'nl'));
  const regels = Object.entries(z.regels).map(([id,n])=>({k:state.kelder.find(x=>x.id===id), n})).filter(r=>r.k);
  const mijn = (state.kelderAanvragen||[]).filter(a=>a.uid===currentUser().id).slice().reverse().slice(0,15);
  const chip = (id,l)=>`<button class="chip${s===id?' active':''}" onclick="window._kaSoort='${id}';renderMain()">${l}</button>`;
  return `<div class="ka-grid">
  <div class="panel">
    <h2>Drank aanvragen uit de kelder</h2>
    <div class="searchbar"><input id="kaZoek" placeholder="Zoek wijn, bier, frisdrank…" value="${esc(window._kaQ||'')}" autocomplete="off"></div>
    <div class="bp-chips">${chip('alle','Alles')}${KELDER_SOORTEN.filter(x=>(state.kelder||[]).some(k=>!k.uit&&k.soort===x[0])).map(x=>chip(x[0], x[2]+' '+x[1])).join('')}</div>
    ${lijst.map(k=>{ const n = z.regels[k.id]||0, op = !(k.voorraad>0);
      return `<div class="ka-rij"><div class="ka-naam">${kSoort(k.soort)[2]} ${esc(kNaam(k))}<small>${esc([k.producent,k.kleur,k.regio,k.inhoud?fmt(k.inhoud)+' cl':''].filter(Boolean).join(' · '))}${op?' · <b>op</b>':(k.voorraad<10?` · nog ${fmt(k.voorraad)}`:'')}${k.verkoop?` · kaart ${euro(k.verkoop)}`:''}</small></div>
        <div class="qtybox"><button onclick="kaZet('${k.id}',-1)" aria-label="Minder">−</button><span>${n}</span><button onclick="kaZet('${k.id}',1)" aria-label="Meer">+</button></div></div>`; }).join('') || `<div class="empty">${(state.kelder||[]).length?'Niets gevonden.':'De keldermeester heeft de kelder nog niet ingevuld.'}</div>`}
  </div>
  <div class="panel">
    <h2>Mijn aanvraag</h2>
    <div class="k-grid" style="grid-template-columns:minmax(0,1fr);">
      <label>Voor<select onchange="window._kaNieuw.voor=this.value"><option value="">Kies…</option>${KELDER_VOOR.map(x=>`<option ${z.voor===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label>Nodig op<input type="date" value="${z.nodigOp}" onchange="window._kaNieuw.nodigOp=this.value"></label>
      <label>Klas, les of opmerking<input value="${esc(z.ref)}" placeholder="bv. 6HB, menu 3 gangen" oninput="window._kaNieuw.ref=this.value"></label>
    </div>
    ${regels.length ? regels.map(({k,n})=>`<div class="ka-mand"><span>${n} × ${esc(kNaam(k))}</span>${n>(k.voorraad||0)?'<span class="tag crit">te weinig in kelder</span>':''}</div>`).join('') + `<button class="btn" style="width:100%;margin-top:12px;" onclick="kaIndienen()">Aanvraag indienen (${regels.reduce((s,r)=>s+r.n,0)})</button>` : '<div class="empty">Kies in de lijst wat je nodig hebt.</div>'}
  </div></div>
  <div class="panel"><h2>Mijn aanvragen</h2>
    ${mijn.length ? `<div class="table-wrap"><table><thead><tr><th>Nodig op</th><th>Voor</th><th>Wat</th><th>Status</th><th></th></tr></thead><tbody>${mijn.map(a=>`<tr><td>${kaDatum(a.nodigOp)}</td><td>${esc(a.voor)}${a.ref?`<div class="k-meta">${esc(a.ref)}</div>`:''}</td>
      <td>${a.regels.map(r=>{ const k = state.kelder.find(x=>x.id===r.kid); return `${a.status==='meegegeven'&&r.mee!=null&&r.mee!==r.n?`${fmt(r.mee)} van ${fmt(r.n)}`:fmt(r.n)} × ${esc(k?kNaam(k):'?')}`; }).join('<br>')}</td>
      <td>${kaTag(a)}</td><td>${a.status==='ingediend'?`<button class="btn ghost small" onclick="kaAnnuleer('${a.id}')">Annuleren</button>`:''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nog geen aanvragen.</div>'}
  </div>`;
}
function kaZet(id, d){ const r = window._kaNieuw.regels; const n = Math.max(0,(r[id]||0)+d); if(n) r[id] = n; else delete r[id]; renderMain(); }
function kaIndienen(){
  const z = window._kaNieuw; const regels = Object.entries(z.regels).filter(([,n])=>n>0).map(([kid,n])=>({kid, n}));
  if(!regels.length) return;
  if(!z.voor){ toast('Kies eerst waarvoor de drank is.'); return; }
  if(!Array.isArray(state.kelderAanvragen)) state.kelderAanvragen = [];
  const u = currentUser();
  state.kelderAanvragen.push({id:'ka'+Date.now(), uid:u.id, naam:u.naam, voor:z.voor, ref:z.ref, nodigOp:z.nodigOp, regels, status:'ingediend', t:nowStr()});
  state.activity.push({tijd:nowStr(), tekst:`Kelder: aanvraag van ${u.naam} voor ${z.voor} (${regels.reduce((s,r)=>s+r.n,0)} stuks).`});
  window._kaNieuw = null; window._kaQ = ''; save(); renderTabs(); renderMain();
  toast('Aanvraag ingediend. De keldermeester zet ze klaar.');
}
function kaAnnuleer(id){ const a = (state.kelderAanvragen||[]).find(x=>x.id===id); if(!a || a.status!=='ingediend' || !confirm('Deze aanvraag annuleren?')) return; a.status = 'geannuleerd'; save(); renderMain(); }
// Keldermeester: aanvragen klaarzetten en meegeven
function viewKelderAanvragenBeheer(){
  const open = kaOpen().sort((a,b)=>(a.nodigOp||'').localeCompare(b.nodigOp||''));
  const klaar = (state.kelderAanvragen||[]).filter(a=>a.status==='meegegeven').slice(-10).reverse();
  return `<div class="panel"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap;"><h2 style="margin:0;">Aanvragen van de zaal</h2>${open.length?'<button class="btn ghost small" onclick="printKaPick()">Picklijst afdrukken</button>':''}</div>
    <p class="note">Pas het aantal aan als je minder meegeeft. Bij "Meegegeven" gaat het van de kelder af en staat het in de historiek.</p>
    ${open.map(a=>`<div class="ka-blok"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><strong>${esc(a.naam)}</strong> · ${esc(a.voor)}${a.ref?' · '+esc(a.ref):''}<div class="k-meta">nodig ${kaDatum(a.nodigOp)} · ingediend ${esc(a.t)}</div></div>${kaTag(a)}</div>
      ${a.regels.map((r,i)=>{ const k = state.kelder.find(x=>x.id===r.kid); const mee = r.mee!=null?r.mee:r.n;
        return `<div class="ka-mand"><span>${esc(k?kNaam(k):'(verwijderd)')}<small class="k-meta"> ${esc(k&&k.plaats||'')} · ${fmt(k?k.voorraad||0:0)} in kelder</small></span>
        <span>${fmt(r.n)} gevraagd · mee <input type="number" min="0" step="1" value="${mee}" style="width:70px;" aria-label="Mee ${esc(k?kNaam(k):'')}" onchange="kaMee('${a.id}',${i},this.value)"></span></div>`; }).join('')}
      <div class="row" style="justify-content:flex-end;gap:6px;margin-top:8px;">${a.status==='ingediend'?`<button class="btn secondary small" onclick="kaKlaar('${a.id}')">Klaargezet</button>`:''}<button class="btn small" onclick="kaMeegeven('${a.id}')">Meegegeven</button></div></div>`).join('') || '<div class="empty">Geen open aanvragen.</div>'}
  </div>
  ${klaar.length?`<div class="panel"><h2>Laatst meegegeven</h2>${klaar.map(a=>`<div class="ka-mand"><span>${esc(a.naam)} · ${esc(a.voor)}</span><span class="k-meta">${esc(a.mee||'')} · ${a.regels.reduce((s,r)=>s+(r.mee!=null?r.mee:r.n),0)} stuks</span></div>`).join('')}</div>`:''}`;
}
function kaMee(id, i, val){ const a = state.kelderAanvragen.find(x=>x.id===id); if(!a) return; const x = parseFloat(String(val).replace(',','.')); a.regels[i].mee = isNaN(x)||x<0 ? 0 : x; save(); }
function kaKlaar(id){ const a = state.kelderAanvragen.find(x=>x.id===id); if(!a) return; a.status = 'klaargezet'; a.klaar = nowStr(); save(); renderTabs(); renderMain(); }
function kaMeegeven(id){
  const a = state.kelderAanvragen.find(x=>x.id===id); if(!a) return;
  const tekort = a.regels.filter(r=>{ const k = state.kelder.find(x=>x.id===r.kid); return k && (r.mee!=null?r.mee:r.n) > (k.voorraad||0); });
  if(tekort.length && !confirm('Volgens het kelderboek staat er te weinig. Toch meegeven? De voorraad wordt dan 0 en je telt best na.')) return;
  a.regels.forEach(r=>{ const k = state.kelder.find(x=>x.id===r.kid); if(!k) return; const n = r.mee!=null?r.mee:r.n; r.mee = n; if(!n) return;
    const echt = Math.min(n, Math.max(0,k.voorraad||0)); k.voorraad = rond((k.voorraad||0)-echt, 2);
    kMut(k, -echt, 'uit', {voor:a.voor+' · '+a.naam+(a.ref?' · '+a.ref:''), prijs:k.verkoop||0}); });
  a.status = 'meegegeven'; a.mee = nowStr();
  state.activity.push({tijd:nowStr(), tekst:`Kelder: aanvraag van ${a.naam} (${a.voor}) meegegeven door ${currentUser().naam}.`});
  save(); renderTabs(); renderMain();
}
function printKaPick(){
  const open = kaOpen().sort((a,b)=>(a.nodigOp||'').localeCompare(b.nodigOp||''));
  printDoc(`<h1>Picklijst kelder</h1><div class="meta">${nowStr()}</div>${open.map(a=>`<h2>${esc(a.naam)} · ${esc(a.voor)} · ${kaDatum(a.nodigOp)}</h2><table><thead><tr><th>Plaats</th><th>Artikel</th><th>Aantal</th><th style="width:60px;">✓</th></tr></thead><tbody>${a.regels.map(r=>{ const k = state.kelder.find(x=>x.id===r.kid)||{}; return `<tr><td>${esc(k.plaats||'')}</td><td>${esc(k.naam?kNaam(k):'')}</td><td>${fmt(r.n)}</td><td></td></tr>`; }).join('')}</tbody></table>`).join('')}`, 'Picklijst kelder');
}

/* ---------- Leverancierscatalogus Horeca Totaal ---------- */
// De catalogus (±12.700 voedingsartikelen) staat in aparte bestanden naast de
// app en wordt pas geladen wanneer iemand de catalogus opent. Foto's zitten
// per afdeling in een eigen bestand en worden pas opgehaald als ze in beeld komen.
const HT = { data:null, loading:null, error:false, fotos:{}, fotoBezig:{} };
const HT_STATUSSEN = ['Alle','Direct leverbaar','Op bestelling','Beste koop','Nieuw artikel','Leverprobleem producent','Uitl. daarna op bestel.'];
function htLoad(){
  if(HT.data || HT.loading) return;
  HT.loading = catFetch('catalogus/horecatotaal.json')
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{ HT.data = d; HT.byArt = {}; d.producten.forEach(p=>{ HT.byArt[p[0]] = p; }); htSyncPrijzen(); HT.cat = d.producten.map(p=>htCategorie(d.afdelingen[p[4]], p)); htHersorteer(); if(activeTab==='catalogus' || activeTab==='ingredienten' || activeTab==='bestellen' || htPrijzenGewijzigd) renderMain(); })
    .catch(()=>{ HT.error = true; HT.loading = null; if(activeTab==='catalogus' || activeTab==='ingredienten') renderMain(); });
}
// Producten die uit de catalogus komen volgen automatisch de prijs van
// Horeca Totaal, tot iemand de prijs zelf aanpast (htPrijsVast).
let htPrijzenGewijzigd = false;
function htSyncPrijzen(){
  let n = 0;
  state.products.forEach(prod=>{
    if(!prod.htArt || prod.htPrijsVast) return;
    const c = HT.byArt[prod.htArt];
    if(!c || c[7]==null) return;
    if(prod.prijs !== c[7]){ prod.prijs = c[7]; n++; }
    prod.htPrijsDatum = HT.data.opgehaald;
  });
  if(n){ htPrijzenGewijzigd = true; state.activity.push({tijd:nowStr(), tekst:`Prijzen van ${n} product(en) bijgewerkt volgens Horeca Totaal.`}); save(); }
}
function htPrijsTekst(c){
  if(!c || c[7]==null) return '<span class="ht-meta">Prijs op aanvraag</span>';
  return `<span class="ht-prijs">€ ${c[7].toFixed(2).replace('.',',')}</span> <span class="ht-meta">per ${c[8]||((c[2]||'').split(' ')[0])||'stuk'}</span>`;
}
function htFotoHtml(art, afd, size){
  const s = size||64;
  const map = HT.fotos[afd];
  if(map && map[art]) return `<img class="ht-foto" width="${s}" height="${s}" alt="" src="data:image/webp;base64,${map[art]}">`;
  if(map) return `<span class="ht-foto leeg" style="width:${s}px;height:${s}px;"></span>`;
  return `<img class="ht-foto leeg" width="${s}" height="${s}" alt="" data-ht-art="${art}" data-ht-afd="${afd}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">`;
}
/* Productfoto's: eigen foto (magazijn), anders Horeca Totaal-foto, anders een icoon per categorie. */
const CAT_ICOON = {'Verse groenten & fruit':'🥕','Vlees & gevogelte':'🥩','Vis & zeevruchten':'🐟','Zuivel & eieren':'🧀','Droge voeding & kruiden':'🥫','Bakkerij & bloem':'🥖','Diepvries':'❄️','Traiteur & apero':'🥗','Dranken':'🥤','Non-food & materiaal':'🧻'};
// Solucious-artikelfoto's (webshop, 04-10-2026) en voorbeeldfoto's: OrderFlow- en courante producten
// zonder eigen foto tonen de foto van een gelijkaardig Horeca Totaal-artikel, gemarkeerd als voorbeeld.
const SOL = { fotos:null, bezig:false };
function solLoad(){
  if(SOL.fotos || SOL.bezig) return; SOL.bezig = true;

function htCategorie(afdNaam, p){
  const a = afdNaam||'';
  const naam = p ? (p[1]||'') : '';
  const verp = p ? (p[2]||'').toLowerCase() : '';
  if(/^(Groenten|Fruit|Aardappelproducten)/.test(a) && p){
    // Gekoelde spreads en salades in een pot: traiteur. Vers fruit, kiemgroenten, zwammen en tomaatjes in een pot: vers.
    if(/^pot/.test(verp) && /hummus|guacamole|coleslaw|tzatziki|babaganoush|bietensalade|\bdip\b|aardappeldip|koelvers|picado|mediterraanse aubergines|african pepper/i.test(naam)) return 'Traiteur & apero';
    const versInPot = /cress|tuinkers|waterkers|kruiden|plant|aardbei|framboo|frambo|\bbes\b|\bbessen\b|goudbes|physalis|blauwe bes|bosbes|braam|bramen|\bkersen\b|tomaatjes|snoeptomaten|kerstomaat|fruitsalade|\bfresh\b|shoots|zwam/i.test(naam) && !/^(borde|delices des bois)|tartaar/i.test(naam);
    if(/^(blik|bokaal|bus|emmer)/.test(verp) || (/^pot/.test(verp) && !versInPot)) return 'Droge voeding & kruiden';
    if(/diepvries|\bdv\b|\biqf\b|gevroren|bevroren/i.test(naam) || HT_DV_MERKEN.test(naam) || /^zak van 2500 gram/.test(verp)) return 'Diepvries';
    if(/gepekeld|ingelegd|in azijn|poeder|zeewier|kikkererwt|doypack|cr[eè]me|st\.? ?mamet|gedroogd|op (lichte )?siroop|op sap|confituur|olvarit|passata|gepelde tomaten|tomatenpuree|in olie|augurk|zuurkool|tapenade/i.test(naam)) return 'Droge voeding & kruiden';
    if(/^(fles|tray)/.test(verp) || /\bsap\b|smoothie/i.test(naam)) return 'Dranken';
    if(/^Aardappelproducten/.test(a)){
      if(/vlokken|puree|poeder/i.test(naam) && !/vers/i.test(naam)) return /knorr|mousline|maggi|lutosa|peka|aardappelpuree met melk/i.test(naam) ? 'Droge voeding & kruiden' : 'Diepvries';
      if(/friet|fries|kroket|r[oö]sti|dauphine|rissol|wafel|gratin|pom/i.test(naam) && !/\bvers/i.test(naam)) return 'Diepvries';
    }
  }
  if(/^Frituursnacks/.test(a)) return 'Diepvries';
  // Desserts: ijs hoort in de diepvries, kant-en-klare potjes bij zuivel; poeders en toppings blijven droge voeding.
  if(/^Dessert/.test(a) && p){
    if(/roomijs|sorbet|schepijs|ijsbeker|\bijs|aardbeienijs|cornet|one shot|coupe|bavar|ijstijd|ijsboerke|van gil|gelato|pagotini|missault|ola /i.test(naam)) return 'Diepvries';
    if(/^tray/.test(verp) && !/poeder/i.test(naam)) return 'Zuivel & eieren';
  }
  if(/Diepvries|^Ijs/.test(a)) return 'Diepvries';
  if(/^(Aperitiefhapjes|Bereide Gerechten)/.test(a)) return 'Traiteur & apero';
  if(/^(Groenten|Fruit|Aardappelproducten)/.test(a)) return 'Verse groenten & fruit';
  if(/^(Vlees|Gevogelte|Wild|Fijne Vleeswaren)/.test(a)) return 'Vlees & gevogelte';
  if(/^(Vis|Schaal)/.test(a)) return 'Vis & zeevruchten';
  if(/^(Zuivel|Eieren|Ijs)/.test(a)) return 'Zuivel & eieren';
  if(/^(Brood|Patisserie|Koeken|Toast)/.test(a)) return 'Bakkerij & bloem';
  if(/^(Koffie|Thee)/.test(a)) return 'Dranken';
  return 'Droge voeding & kruiden';
}

    const code = e && e.code;

    if(code==='server_not_connected' || code==='server_not_found') m = 'De verbinding "Claude Code Remote" is niet beschikbaar voor je account. Vraag de update dan in de chat aan Claude.';
    else if(code==='needs_reauth') m = 'De verbinding "Claude Code Remote" moet opnieuw aangemeld worden in claude.ai → Instellingen → Connectors.';

    else if(code==='tool_error') m = 'De taak kon niet gestart worden: ' + (e.message||'onbekende fout') + '.';

const LC = {};
Object.keys(LEVCAT).forEach(k=>{ LC[k] = {data:null, loading:null, error:false, byArt:{}, fotos:null, fotoBezig:false}; });

    if(code==='server_not_connected' || code==='server_not_found') m = 'De verbinding "Claude Code Remote" is niet beschikbaar. Vraag de update dan in de chat aan Claude.';
    else if(code==='needs_reauth') m = 'De verbinding "Claude Code Remote" moet opnieuw aangemeld worden in claude.ai → Instellingen → Connectors.';
    else if(code==='not_in_manifest' || code==='not_granted' || code==='consent_required') m = 'Je hebt de app nog geen toestemming gegeven. Klik opnieuw en kies "Toestaan".';
    else if(code==='server_unavailable' || code==='upstream_error') m = 'Het is niet zeker of de update gestart is. Kijk eerst bij je geplande taken in Claude voor je opnieuw klikt.';
    else if(code==='tool_error') m = 'De taak kon niet gestart worden: ' + (e.message||'onbekende fout') + '.';
    else m = 'De update kon niet gestart worden. Vraag ze in de chat aan Claude.';
    zet({status:'fout', melding:m});
  }
}

function fulfillOrder(oid){
  const o = state.orders.find(x=>x.id===oid);
  let kost = 0;
  const tekortMeldingen = [];
  o.items.forEach(i=>{
    const p = state.products.find(x=>x.id===i.productId);
    if(!p) return;
    // Alleen het deel dat uit voorraad kwam; wat bij het aanvragen al te kort was, staat al bij de leverancier.
    const nodig = i.uitVoorraad!=null ? i.uitVoorraad : i.aantal;
    const beschikbaar = Math.min(nodig, Math.max(0,p.voorraad));
    const tekort = Math.round((nodig - beschikbaar)*100)/100;
    p.voorraad = Math.round((p.voorraad - beschikbaar)*100)/100;
    boekMut(p.id, -beschikbaar, 'uitgifte');
    i.uitVoorraad = beschikbaar;
    i.prijs = p.prijs;
    kost += i.aantal * p.prijs;
    if(tekort > 0){
      maakTekort(p, tekort, o);
      i.teBestellen = Math.round(((i.teBestellen||0) + tekort)*100)/100;
      tekortMeldingen.push(`${fmt(tekort)} ${p.eenheid} ${p.naam}`);
    }
  });
  o.status = state.tekorten.some(t=>t.orderId===o.id) ? 'deels' : 'geleverd';
  o.kost = Math.round(kost*100)/100;
  o.geleverdOp = nowStr();
  state.activity.push({tijd:nowStr(), tekst:`Aanvraag van ${o.leerkracht}${o.les?' ('+o.les+')':''} verwerkt${o.status==='deels'?' (deel komt van de leverancier)':''}, voorraad automatisch aangepast. Kost: € ${fmt(o.kost)}.`
    + (tekortMeldingen.length ? ` Niet op voorraad, doorgestuurd naar leverancier: ${tekortMeldingen.join(', ')}.` : '')});
  save(); renderMain();
}
function rejectOrder(oid){
  const o = state.orders.find(x=>x.id===oid);
  o.status='geweigerd';
  // Nog niet bestelde tekorten van deze aanvraag vervallen; al bestelde gaan bij ontvangst naar de voorraad.
  state.tekorten = state.tekorten.filter(t=>!(t.orderId===oid && t.status==='open'));
  state.tekorten.forEach(t=>{ if(t.orderId===oid){ delete t.orderId; t.les = (t.les||'') + ' (aanvraag geweigerd — naar voorraad)'; } });
  state.activity.push({tijd:nowStr(), tekst:`Aanvraag van ${o.leerkracht} geweigerd.`});
  save(); renderMain();
}
function markOrderBesteld(oid){
  const o = state.orders.find(x=>x.id===oid);
  o.besteld = true;

  save(); renderMain();
}

function ontkoppelBarcode(pid, code){
  const p = state.products.find(x=>x.id===pid);

  p.barcodes = (p.barcodes||[]).filter(c=>c!==code);

  return state.products.find(p=>(p.barcodes||[]).includes(code));

function verwerkBarcode(raw){
  const code = String(raw||'').replace(/\s+/g,'').trim();
  if(!code) return;
  const p = productBijBarcode(code);
  if(p){
    const bs = window._balieState;
    const step = p.eenheid==='kg' || p.eenheid==='l' ? 0.5 : 1;
    bs.cart[p.id] = Math.round(((bs.cart[p.id]||0)+step)*10)/10;
    window._balieScan = {melding:`+${fmt(step)} ${p.eenheid} ${p.naam} — nu ${fmt(bs.cart[p.id])} geselecteerd`};
  } else {
    window._balieScan = {onbekend: code};
    window._balieLinkQ = '';
  }
  renderMain();
}
function koppelBarcode(pid){
  const code = (window._balieScan||{}).onbekend;
  const p = state.products.find(x=>x.id===pid);
  if(!code || !p) return;
  state.products.forEach(x=>{ if(x.barcodes) x.barcodes = x.barcodes.filter(c=>c!==code); });
  p.barcodes = (p.barcodes||[]).concat(code);
  state.activity.push({tijd:nowStr(), tekst:`Barcode ${code} gekoppeld aan ${p.naam}.`});
  save();
  window._balieScan = {};
  verwerkBarcode(code);
}
let _zxingLaden = null;
function laadZxing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(_zxingLaden) return _zxingLaden;
  _zxingLaden = new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    sc.onload = ()=> window.ZXing ? res(window.ZXing) : rej(new Error('geen ZXing'));
    sc.onerror = ()=>{ _zxingLaden = null; rej(new Error('laden mislukt')); };
    document.head.appendChild(sc);
  });
  return _zxingLaden;
}
async function scanBarcodeFoto(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  window._balieScan = {melding:'Barcode wordt gelezen…'}; renderMain();
  let code = null;
  try{
    if('BarcodeDetector' in window){
      const det = new BarcodeDetector();
      const bmp = await createImageBitmap(file);
      const res = await det.detect(bmp);
      if(res && res.length) code = res[0].rawValue;
    }
  }catch(e){}
  if(!code){
    try{
      const Z = await laadZxing();
      const url = URL.createObjectURL(file);
      const reader = new Z.BrowserMultiFormatReader();
      const r = await reader.decodeFromImageUrl(url);
      URL.revokeObjectURL(url);
      code = r && (r.getText ? r.getText() : r.text);
    }catch(e){}
  }
  if(code) verwerkBarcode(code);
  else { window._balieScan = {melding:'Geen barcode gevonden op de foto. Neem de foto van dichterbij, recht en scherp, of typ de code over.', fout:true}; renderMain(); }
}
function setBalieModus(m){

}
function balieStep(pid, delta){
  const p = state.products.find(x=>x.id===pid);
  const step = p.eenheid==='kg' || p.eenheid==='l' ? 0.5 : 1;
  const cur = window._balieState.cart[pid]||0;
  const next = Math.max(0, Math.round((cur+delta*step)*10)/10);
  if(next<=0) delete window._balieState.cart[pid]; else window._balieState.cart[pid]=next;
  renderMain();
}
function balieSet(pid, val){
  const n = parseFloat(String(val).replace(',','.'));
  if(!n || n<=0) delete window._balieState.cart[pid]; else window._balieState.cart[pid]=n;
  renderMain();
}
function processBalie(){
  const bs = window._balieState;
  const items = Object.entries(bs.cart).map(([pid,qty])=>{
    const p = state.products.find(x=>x.id===pid);
    return {productId:pid, naam:p.naam, eenheid:p.eenheid, aantal:qty, prijs:p.prijs};
  });
  if(!items.length) return;
  let kost = 0;
  const teLaag = [];
  items.forEach(i=>{
    const p = state.products.find(x=>x.id===i.productId);
    if(bs.modus==='uitgifte'){
      // Voorraad nooit onder 0: meer uitgeven dan er geteld staat betekent dat de telling niet klopt.
      if(i.aantal > p.voorraad) teLaag.push(`${p.naam} (${fmt(Math.max(0,p.voorraad))} ${p.eenheid} geteld)`);
      p.voorraad = Math.max(0, Math.round((p.voorraad - i.aantal)*100)/100);
      boekMut(p.id, -i.aantal, 'balie');
      kost += i.aantal*i.prijs;
    } else {
      p.voorraad = Math.round((p.voorraad + i.aantal)*100)/100;
      boekMut(p.id, i.aantal, 'retour');
      kost -= i.aantal*i.prijs;
    }
  });
  const order = {
    id:'b'+Date.now(), leerkracht: currentUser().naam+' (balie)', leerkrachtId: currentUser().id,
    les: (bs.les||'').trim(), leerling: (bs.leerling||'').trim(), items, status:'geleverd', type: bs.modus==='uitgifte'?'balie_extra':'balie_retour',
    kost: Math.round(kost*100)/100, aangemaakt: nowStr(), geleverdOp: nowStr()
  };
  state.orders.push(order);
  const wieTekst = order.leerling ? ` (${order.leerling})` : '';
  state.activity.push({tijd:nowStr(), tekst: bs.modus==='uitgifte'
    ? `Extra uitgifte aan balie${order.les?' voor '+order.les:''}${wieTekst}: ${items.length} product(en), € ${fmt(order.kost)}.`
    : `Retour verwerkt aan balie${order.les?' voor '+order.les:''}${wieTekst}: ${items.length} product(en), € ${fmt(Math.abs(order.kost))} teruggeboekt.`
  });
  if(teLaag.length) state.activity.push({tijd:nowStr(), tekst:`Balie: meer uitgegeven dan in voorraad stond, voorraad op 0 gezet. Tel deze producten na: ${teLaag.join(', ')}.`});
  window._balieState = {modus:bs.modus, les:'', leerling:'', cart:{}};
  save();
  toast(bs.modus==='uitgifte'
    ? (teLaag.length ? `Extra uitgifte verwerkt. Er werd meer uitgegeven dan er in voorraad stond, de voorraad staat nu op 0. Tel na: ${teLaag.join(', ')}.` : 'Extra uitgifte verwerkt, voorraad aangepast.')
    : 'Retour verwerkt, voorraad aangevuld.');
  renderMain();
}

/* ---------- Magazijn: Voorraad ---------- */
/* ---------- Dubbele producten ----------
   Sleutel: naam zonder merk/leverancier-toevoegingen tussen haakjes, zonder accenten, met synoniemen (ui = ajuin).
   Zelfde sleutel = voor de chef hetzelfde product. */
const PROD_SYNONIEMEN = {ui:'ajuin', uien:'ajuin', knoflook:'look', look:'look', wortelen:'wortel', wortels:'wortel'};
function prodSleutel(naam){
  return String(naam||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\((economaat|vers|vers, kg|los|stuk|kg)\)/g,' ').replace(/\b(vers|los)\b/g,' ')
    .replace(/[^a-z0-9,./ ]/g,' ').split(/\s+/).filter(Boolean).map(w=>PROD_SYNONIEMEN[w]||w).join(' ');
}
// Voor de chef één regel per product: de beste kandidaat (op voorraad, dan goedkoopst met prijs).
function zonderDubbels(list){
  const beste = new Map();
  list.forEach(p=>{ const k = prodSleutel(p.naam); const b = beste.get(k);
    if(!b){ beste.set(k,p); return; }
    const score = x=>[(x.voorraad>0?0:1), (x.prijs>0?x.prijs:1e9)];
    const [a1,a2]=score(p), [b1,b2]=score(b);
    if(a1<b1 || (a1===b1 && a2<b2)) beste.set(k,p); });
  const keep = new Set([...beste.values()].map(p=>p.id));
  return list.filter(p=>keep.has(p.id) || cart[p.id]);
}
function dubbeleGroepen(){
  const g = {};
  state.products.forEach(p=>{ const k = prodSleutel(p.naam); (g[k]=g[k]||[]).push(p); });
  return Object.values(g).filter(ps=>ps.length>1);
}
function voegSamen(houdId, wegId, stil){
  const houd = state.products.find(p=>p.id===houdId), weg = state.products.find(p=>p.id===wegId);
  if(!houd || !weg || houd===weg) return;
  if(houd.eenheid===weg.eenheid){ houd.voorraad = Math.round((houd.voorraad + (weg.voorraad||0))*100)/100; boekMut(houd.id, weg.voorraad||0, 'samenvoegen'); }
  const her = id=>id===wegId ? houdId : id;
  state.orders.forEach(o=>(o.items||[]).forEach(i=>{ i.productId = her(i.productId); }));
  state.tekorten.forEach(t=>{ t.productId = her(t.productId); });
  state.recipes.forEach(rc=>(rc.ingredienten||[]).forEach(i=>{ if(i.productId) i.productId = her(i.productId); }));
  (state.ingredienten||[]).forEach(ing=>{ (ing.artikelen||[]).forEach(a=>{ a.productId = her(a.productId); });
    ing.artikelen = (ing.artikelen||[]).filter((a,i,arr)=>arr.findIndex(b=>b.productId===a.productId)===i); if(ing.vastProductId===wegId) ing.vastProductId = houdId; });
  Object.values(state.favorieten||{}).forEach(f=>{ const i=f.indexOf(wegId); if(i>=0){ if(f.includes(houdId)) f.splice(i,1); else f[i]=houdId; } });
  (state.lijsten||[]).forEach(l=>{ if(l.items[wegId]!=null){ l.items[houdId]=(l.items[houdId]||0)+l.items[wegId]; delete l.items[wegId]; } });
  if(cart[wegId]){ cart[houdId]=(cart[houdId]||0)+cart[wegId]; delete cart[wegId]; }
  state.products = state.products.filter(p=>p.id!==wegId);
  state.activity.push({tijd:nowStr(), tekst:`Dubbel product samengevoegd: "${weg.naam}" (${weg.leverancier||'—'}) gaat verder als "${houd.naam}" (${houd.leverancier||'—'}).${houd.eenheid!==weg.eenheid?` Voorraad niet opgeteld: andere eenheid (${weg.eenheid} vs ${houd.eenheid}).`:''}`});
  if(!stil){ save(); renderMain(); }
}
// Alle dubbels in één keer (Stefan 2026-10-09). Alleen producten met dezelfde eenheid, anders klopt de voorraad of
// de hoeveelheid in recepten niet meer; die blijven staan om zelf te kiezen. We houden het product dat in recepten
// en ingrediënten gebruikt wordt, daarna dat met voorraad, met een prijs en met een leverancier.
function dubbelPlan(){
  const gebruik = {};
  (state.ingredienten||[]).forEach(i=>{ (i.artikelen||[]).forEach(a=>{ gebruik[a.productId] = (gebruik[a.productId]||0)+1; }); if(i.vastProductId) gebruik[i.vastProductId] = (gebruik[i.vastProductId]||0)+1; });
  state.recipes.forEach(r=>(r.ingredienten||[]).forEach(x=>{ if(x.productId) gebruik[x.productId] = (gebruik[x.productId]||0)+1; }));
  const score = p=>[-(gebruik[p.id]||0), p.voorraad>0?0:1, p.prijs>0?0:1, p.leverancier?0:1];
  const plan = [];
  dubbeleGroepen().forEach(ps=>{ const per = {}; ps.forEach(p=>(per[p.eenheid] = per[p.eenheid]||[]).push(p));
    Object.values(per).forEach(g=>{ if(g.length<2) return;
      g.sort((a,b)=>{ const A = score(a), B = score(b); for(let i=0;i<A.length;i++) if(A[i]!==B[i]) return A[i]-B[i]; return 0; });
      plan.push({houd:g[0], weg:g.slice(1)}); }); });
  return plan;
}
function voegAllesSamen(){
  const plan = dubbelPlan(); const n = plan.reduce((s,x)=>s+x.weg.length,0);
  if(!n){ toast('Er zijn geen dubbels met dezelfde eenheid. Kies bij de overige zelf welk product blijft.'); return; }
  if(!confirm(`${n} dubbele producten samenvoegen in ${plan.length} producten? Voorraad wordt opgeteld; bestellingen, recepten, favorieten en lijsten gaan mee. Dit kan je niet ongedaan maken, maak eventueel eerst een back-up (Cijfers & back-up).`)) return;
  plan.forEach(x=>x.weg.forEach(w=>voegSamen(x.houd.id, w.id, true)));
  state.activity.push({tijd:nowStr(), tekst:`${currentUser().naam} voegde ${n} dubbele producten in één keer samen.`});
  save(); renderMain();
  const rest = dubbeleGroepen().length;
  toast(`${n} dubbele producten samengevoegd.`+(rest ? ` Nog ${rest} groep(en) met een andere eenheid (bv. per stuk en per kg): kies daar zelf welk product blijft.` : ''));
}
