// Een leverancier die niet (meer) in de lijst Leveranciers staat, is weg of fictief: het product blijft,
// en gaat naar de leverancier waar het vandaan komt (Solucious-, Horeca Totaal-, Claessens-, Delidis-artikels), anders naar "geen".
function levVolgensHerkomst(p){
  const id = p.id||'';
  if(/^sl\d/.test(id) || p.levArt && /^sl/.test(id)) return 'Solucious';
  if(p.htArt || /^ht-/.test(id)) return 'Horeca Totaal';
  if(/^cla\d/.test(id)) return 'Claessens';
  if(/^del\d/.test(id) || p.levArt && /^dl/.test(id)) return 'Delidis';
  if(p.levArt && /^vb/.test(id)) return 'Verbiest';
  return '';
}
function levOpruimen(){
  const echt = new Map(state.leveranciers.map(l=>[(l.naam||'').trim().toLowerCase(), l.naam]));
  const juist = (naam, p)=>{
    const k = (naam||'').trim().toLowerCase();
    if(k && echt.has(k)) return echt.get(k);
    const h = p ? levVolgensHerkomst(p) : '';
    return h && echt.has(h.toLowerCase()) ? echt.get(h.toLowerCase()) : '';
  };
  state.products.forEach(p=>{ p.leverancier = juist(p.leverancier, p); });
  state.tekorten.forEach(t=>{ const p = state.products.find(x=>x.id===t.productId); t.leverancier = p ? p.leverancier : juist(t.leverancier); });
}
function levOpties(huidig){

}

function zetMinMax(pid, veld, val){
  const p = state.products.find(x=>x.id===pid);

  if(!p || isNaN(n) || n<0){ renderMain(); return; }
  p[veld] = Math.round(n*100)/100;

  if(veld==='aanvulniveau' && p.aanvulniveau<p.minimum){ p.aanvulniveau = p.minimum; toast('Het maximum kan niet lager zijn dan het minimum ('+fmt(p.minimum)+' '+esc(p.eenheid)+').'); }

async function exportProductenCsv(){
  if(!state.products.length){ toast('Er staan nog geen producten in het systeem om te exporteren.'); return; }
  let csv = 'Naam;Categorie;Eenheid;Prijs (EUR);Op voorraad;Voorraad;Minimum;Maximum;Leverancier\n';
  state.products.forEach(p=>{
    const cell = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
    csv += [cell(p.naam), cell(p.categorie), cell(p.eenheid), cell(fmt(p.prijs).replace('.', ',')), cell(p.opVoorraad?'ja':'nee'), cell(fmt(p.voorraad).replace('.', ',')), cell(fmt(p.minimum).replace('.', ',')), cell(fmt(p.aanvulniveau).replace('.', ',')), cell(p.leverancier)].join(';') + '\n';
  });
  try{
    if(!window.claude || !window.claude.use){ toast('Bestand downloaden is in deze weergave niet beschikbaar.'); return; }
    const downloads = await window.claude.use('downloads');
    if(!downloads){ toast('Bestand downloaden is in deze weergave niet beschikbaar.'); return; }
    const res = await downloads.save({filename:'producten-colomarkt.csv', data:csv});
    if(res && res.status){ toast('Export gestart — controleer je downloads.'); }
  }catch(e){
    toast('Downloaden is niet gelukt of werd geannuleerd.');
  }
}

/* ---------- Magazijn: Levering verwerken ---------- */
function normalizeText(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function matchProduct(norm){
  let best=null, bestScore=0;
  state.products.forEach(p=>{
    const pn = normalizeText(p.naam);
    let score=0;
    norm.split(' ').forEach(w=>{ if(w.length>2 && pn.includes(w)) score++; });
    if(norm && (pn.includes(norm) || norm.includes(pn))) score+=3;
    if(score>bestScore){ bestScore=score; best=p; }
  });
  return bestScore>0 ? best.id : '';
}
function cleanRest(rest){
  return rest.replace(/\b(kg|kgs|l|liter|stuk|stuks|fles|flessen|doos|dozen|pak|rol|blik|x|st|btw|excl|incl)\b/gi,' ').replace(/[€$]|EUR/gi,' ').replace(/\s+/g,' ').trim();
}
// Getallen op een regel van een leverbon of factuur. Artikelnummers (22.000.10) en barcodes tellen niet mee.
// Een maat die aan de naam vastzit (140g, 1kg, 1L, 45+, "(pot 500g)") hoort bij de productnaam, niet bij het aantal of de prijs.
function regelGetallen(line){
  const l = line.replace(/\b\d{2}\.\d{3}\.\d{2}\b/g,' ').replace(/\b\d{6,}\b/g,' ');
  const alle = [...l.matchAll(/\d+(?:[.,]\d+)?/g)].map(m=>{
    const voor = l[m.index-1]||'', na = l[m.index+m[0].length]||'', ervoor = l.slice(0,m.index);
    const inHaakjes = (ervoor.match(/\(/g)||[]).length > (ervoor.match(/\)/g)||[]).length;
    return {val:parseFloat(m[0].replace(',','.')), start:m.index, len:m[0].length, maat: /[a-zµ+%]/i.test(na) || /[a-wyz]/i.test(voor) || inHaakjes};
  });
  const los = alle.filter(n=>!n.maat);
  return {l, alle, los: los.length ? los : alle};
}
function parseLeverbon(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>1);
  return lines.map(line=>{
    const {l, los} = regelGetallen(line);
    // "x 4" of "4 x" is het aantal; anders het eerste losse getal ("Spaghetti 5 kg", "Tomatenpuree 140g 6").
    const m = l.match(/(?:^|\s)[x×]\s*(\d+(?:[.,]\d+)?)(?![\d.,])/i)
           || l.match(/(?:^|\s)(\d+(?:[.,]\d+)?)\s*[x×](?=\s|$)/i);
    let qty = 0, rest = l;
    if(m){
      qty = parseFloat(m[1].replace(',','.'));
      rest = (l.slice(0,m.index) + ' ' + l.slice(m.index+m[0].length)).trim();
    } else if(los.length){
      const n = los[0]; qty = n.val;
      rest = (l.slice(0,n.start) + ' ' + l.slice(n.start+n.len)).trim();
    }
    const norm = normalizeText(cleanRest(rest));
    return {raw:line, qty, matchedId: matchProduct(norm)};
  }).filter(r=>r.raw);
}
function parseFactuur(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>1);
  return lines.map(line=>{
    const {l, los: numMatches} = regelGetallen(line);
    let rest = l;
    for(let i=numMatches.length-1;i>=0;i--){
      const n = numMatches[i];
      rest = rest.slice(0,n.start) + ' ' + rest.slice(n.start+n.len);
    }
    const norm = normalizeText(cleanRest(rest));
    const matchedId = matchProduct(norm);
    const nums = numMatches.map(n=>n.val);
    let qty=0, eenheidsprijs=null;
    if(nums.length>=3){ qty=nums[0]; eenheidsprijs=nums[nums.length-2]; }
    else if(nums.length===2){ qty=nums[0]; eenheidsprijs = qty>0 ? Math.round((nums[1]/qty)*100)/100 : nums[1]; }
    else if(nums.length===1){ qty=nums[0]; }
    return {raw:line, qty, eenheidsprijs, matchedId};
  }).filter(r=>r.raw);
}
function leverbonQtyFor(pid){
  if(window._leveringRows) return window._leveringRows.filter(r=>r.matchedId===pid).reduce((s,r)=>s+r.qty,0);
  // Geen levering open op het scherm: vergelijk met de laatst bevestigde levering, als dit product erin zat.
  const ll = state.laatsteLevering;
  if(!ll || !ll.regels.some(r=>r.productId===pid)) return null;
  return ll.regels.filter(r=>r.productId===pid).reduce((s,r)=>s+r.qty,0);
}

let pdfWorkerReady = false;
function ensurePdfWorker(){
  if(pdfWorkerReady) return;
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    pdfWorkerReady = true;
  }
}
async function extractPdfText(file){
  ensurePdfWorker();
  if(!window.pdfjsLib) throw new Error('pdf.js niet beschikbaar');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let fullText = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const items = content.items.filter(it=>it.str !== undefined && it.str !== '');
    const lines = [];
    items.forEach(it=>{
      const y = it.transform[5];
      let line = lines.find(l=>Math.abs(l.y - y) < 2.5);
      if(!line){ line = {y, parts:[]}; lines.push(line); }
      line.parts.push({x: it.transform[4], str: it.str});
    });
    lines.sort((a,b)=>b.y - a.y);
    lines.forEach(line=>{
      line.parts.sort((a,b)=>a.x - b.x);
      let lineText = '';
      let prevEndX = null;
      line.parts.forEach(p=>{
        if(prevEndX !== null){
          const gap = p.x - prevEndX;
          lineText += gap > 10 ? '   ' : (gap > 1.5 ? ' ' : '');
        }
        lineText += p.str;
        prevEndX = p.x + p.str.length * (p.width ? p.width/Math.max(p.str.length,1) : 4);
      });
      if(lineText.trim()) fullText += lineText.trim() + '\n';
    });
    fullText += '\n';
  }
  return fullText.trim();
}
async function handlePdfUpload(inputEl, which){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const statusEl = document.getElementById(which==='levering' ? 'leveringPdfStatus' : 'factuurPdfStatus');
  const textareaId = which==='levering' ? 'leveringInput' : 'factuurInput';
  if(statusEl) statusEl.textContent = 'PDF wordt gelezen…';
  try{
    const text = await extractPdfText(file);
    if(!text){
      if(statusEl) statusEl.textContent = 'Geen tekst gevonden in dit PDF-bestand (mogelijk een scan). Plak de tekst hieronder manueel.';
      return;
    }
    if(which==='levering') window._leveringText = text; else window._factuurText = text;

    if(ta) ta.value = text;

    if(statusEl) statusEl.textContent = 'PDF kon niet automatisch gelezen worden. Kopieer de tekst manueel uit het document en plak ze hieronder.';
  }
  inputEl.value = '';
}
function toNumberLoose(v){
  if(v===null || v===undefined || v==='') return null;
  if(typeof v === 'number') return isNaN(v) ? null : v;
  const cleaned = String(v).replace(/[€\s]/g,'').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? null : n;
}

Herken per artikel-regel het product en het aantal${isFactuur?', en de prijs per eenheid indien vermeld':''}. Kies het productId uit de lijst dat het beste overeenkomt (ook bij afwijkende schrijfwijze of typefouten); laat productId leeg ("") als er geen redelijke match is. Negeer regels die geen artikel zijn (totalen, adres, btw-samenvatting, ...).
Geef qty${isFactuur?' en eenheidsprijs':''} als gewone getallen met een PUNT als decimaalteken (bv. 4.5, niet 4,5 of "4,50 €")${isFactuur?'; als er geen prijs op de regel staat, gebruik dan null':''}.
Antwoord met UITSLUITEND een JSON-array, zonder uitleg, in dit formaat:
[{"raw":"<originele regeltekst>","productId":"<id of \\"\\">","qty":<getal>${isFactuur?',"eenheidsprijs":<getal of null>':''}}]

Bekende producten:
${JSON.stringify(productList)}

Tekst:
${text.slice(0,20000)}`;
    const rows = await sample.json(prompt, fotos.length ? {modelTier:'default', images:fotos} : {modelTier:'quick'});
    if(!Array.isArray(rows) || !rows.length){ toast('AI vond geen herkenbare artikelregels in deze tekst.'); return; }
    const cleaned = rows.map(r=>{
      const base = {

      if(isFactuur){

      return base;
    }).filter(r=>r.raw);
    if(isFactuur){ window._factuurRows = cleaned; } else { window._leveringRows = cleaned; }
    renderMain();
    toast('AI-herkenning voltooid — controleer de resultaten hieronder voor je bevestigt.');
  }catch(e){
    const map = {
      not_granted:'Je hebt AI-toegang voor dit document niet toegestaan.',

  }finally{
    if(btn){ btn.disabled = false; btn.textContent = origLabel; }

}

// Verdeelt een geleverde hoeveelheid over de open tekorten van chef-aanvragen (zoals
// "Ontvangen" bij Bestelvoorstellen) en geeft terug wat overblijft voor de voorraad.
function leverTekortenAf(p, qty){
  let rest = qty;
  const toegewezen = [];
  const r2 = n=>Math.round(n*100)/100;
  const open = state.tekorten.filter(t=>t.productId===p.id)
    .sort((a,b)=>(a.status==='besteld'?0:1)-(b.status==='besteld'?0:1));
  open.forEach(t=>{
    if(rest<=0) return;
    const o = t.orderId ? state.orders.find(x=>x.id===t.orderId) : null;
    const deel = r2(Math.min(rest, t.aantal));
    if(o && o.status!=='geweigerd'){
      const it = o.items.find(i=>i.productId===p.id);
      if(it) it.ontvangenVanLeverancier = r2((it.ontvangenVanLeverancier||0) + deel);
      rest = r2(rest - deel);
      toegewezen.push(`${fmt(deel)} ${p.eenheid} ${p.naam} voor ${t.leerkracht}`);
    }
    // Tekorten zonder aanvraag (bv. geweigerd) worden afgesloten; die hoeveelheid gaat gewoon in de voorraad.
    t.aantal = r2(t.aantal - deel);
    if(t.aantal<=0) state.tekorten = state.tekorten.filter(x=>x.id!==t.id);
    if(o && o.status==='deels' && !state.tekorten.some(x=>x.orderId===o.id)){ o.status='geleverd'; o.geleverdOp = nowStr(); }
  });
  return {rest, toegewezen};
}
function confirmLevering(){

  save();
  window._leveringRows=null; window._leveringText='';
  toast(voorChefs.length
    ? `Levering verwerkt. Zet klaar voor de chef: ${voorChefs.join(', ')}. De rest staat in de voorraad.`
    : 'Levering verwerkt, voorraad is bijgewerkt.');
  renderMain();
}

function setFactuurMatch(idx, val){ window._factuurRows[idx].matchedId = val; }
function handleFactuurSelect(idx, val){

  setFactuurMatch(idx, val);
}
function setFactuurQty(idx, val){ window._factuurRows[idx].qty = parseFloat(String(val).replace(',','.'))||0; }
function setFactuurPrijs(idx, val){ const n = parseFloat(String(val).replace(',','.')); window._factuurRows[idx].eenheidsprijs = isNaN(n) ? null : n; }
function confirmFactuur(){
  const rows = (window._factuurRows||[]).filter(r=>r.matchedId);
  if(!rows.length){ toast('Geen regels om te verwerken — koppel minstens één product.'); return; }
  let mismatches=[], prijsUpdates=0;
  // Voor de factuurcontrole van de boekhouding: bewaren met geleverd aantal en de prijs die we kenden.
  if(!state.facturen) state.facturen = [];
  { const regels = rows.map(r=>{ const p = state.products.find(x=>x.id===r.matchedId); return {productId:p.id, naam:p.naam, eenheid:p.eenheid, qty:r.qty, lvQty:leverbonQtyFor(r.matchedId), prijs: r.eenheidsprijs!=null ? r.eenheidsprijs : p.prijs, oudPrijs: p.prijs>0 ? p.prijs : null, leverancier:p.leverancier||''}; });
    state.facturen.push(bkFactuurSamenvatting({id:'F-'+new Date().getFullYear()+'-'+String(state.facturen.length+1).padStart(4,'0'), datum: nowStr(), leverancier: bkMeestVoorkomend(regels.map(r=>r.leverancier)), regels, door: currentUser().naam})); }
  rows.forEach(r=>{
    const p = state.products.find(x=>x.id===r.matchedId);
    const lvQty = leverbonQtyFor(r.matchedId);
    if(lvQty!==null && Math.abs(lvQty - r.qty) > 0.01){
      mismatches.push(`${p.naam}: levering ${fmt(lvQty)} ${p.eenheid} vs factuur ${fmt(r.qty)} ${p.eenheid}`);
    }
    if(r.eenheidsprijs!=null && Math.abs(r.eenheidsprijs - p.prijs) > 0.005){
      state.activity.push({tijd:nowStr(), tekst:`Prijs bijgewerkt: ${p.naam} € ${fmt(p.prijs)} → € ${fmt(r.eenheidsprijs)}.`});
      p.prijs = Math.round(r.eenheidsprijs*100)/100;
      prijsUpdates++;
    }
  });
  if(mismatches.length){
    state.activity.push({tijd:nowStr(), tekst:`Afwijking factuur t.o.v. levering: ${mismatches.join(' · ')}`});
  }
  save();
  window._factuurRows=null; window._factuurText='';
  toast(
    (prijsUpdates ? prijsUpdates+' prijs(en) bijgewerkt. ' : 'Geen prijswijzigingen. ') +
    (mismatches.length ? mismatches.length+' afwijking(en) tussen levering en factuur gevonden — zie Historiek.' : 'Aantallen komen overeen met de levering.')
  );
  renderMain();
}

// Kost per les: een leerkracht ziet alleen zijn eigen aanvragen; de TA ziet alles bij Kost per klas & chef.
function mijnGeleverd(){ const me = currentUser(); return state.orders.filter(o=>(o.status==='geleverd' || o.status==='deels') && o.leerkrachtId===me.id); }
function viewKostPerLes(){
  const geleverd = mijnGeleverd();

    perLes[key].kost += (o.kost||0);
    perLes[key].aantalAanvragen += 1;
    perLes[key].orders.push(o);
  });
  const keys = Object.keys(perLes).sort((a,b)=>perLes[b].kost-perLes[a].kost);
  const totaal = geleverd.reduce((s,o)=>s+(o.kost||0),0);
  return `

    <div class="table-wrap">
    <table><thead><tr><th>${lesLabel(currentUser()).kort}</th><th class="num-cell">Aantal aanvragen</th><th class="num-cell">Totale kost</th></tr></thead><tbody>
    ${keys.map(k=>`<tr><td>${esc(k)}</td><td class="num-cell">${perLes[k].aantalAanvragen}</td><td class="num-cell" style="font-weight:600;">€ ${fmt(perLes[k].kost)}</td></tr>`).join('') || '<tr><td class="empty" colspan="3">Nog geen geleverde bestellingen.</td></tr>'}
    </tbody></table>
    </div>
  </div>
  ${keys.map(k=>`
  <div class="panel">
    <h2 style="font-size:15px;">${esc(k)}</h2>
    <div class="table-wrap">
    <table><thead><tr><th>Datum</th><th>Leerkracht</th><th class="num-cell">Kost</th></tr></thead><tbody>
    ${perLes[k].orders.map(o=>`<tr><td>${o.geleverdOp||o.aangemaakt}</td><td>${esc(o.leerkracht)}</td><td class="num-cell">€ ${fmt(o.kost||0)}</td></tr>`).join('')}
    </tbody></table>
    </div>
  </div>`).join('')}`;
}
async function exportKostPerLesCsv(){
  const geleverd = mijnGeleverd();
  const perLes = {};
  geleverd.forEach(o=>{
    const key = o.les && o.les.trim() ? o.les.trim() : 'Geen les opgegeven';
    if(!perLes[key]) perLes[key] = 0;
    perLes[key] += (o.kost||0);
  });
  let csv = 'Les/klas;Totale kost (EUR)\n';
  Object.keys(perLes).sort((a,b)=>perLes[b]-perLes[a]).forEach(k=>{
    csv += `"${k.replace(/"/g,'""')}";${fmt(perLes[k]).replace('.', ',')}\n`;
  });
  try{
    if(!window.claude || !window.claude.use){ toast('Bestand downloaden is in deze weergave niet beschikbaar.'); return; }
    const downloads = await window.claude.use('downloads');
    if(!downloads){ toast('Bestand downloaden is in deze weergave niet beschikbaar.'); return; }
    const res = await downloads.save({filename:'kost-per-les.csv', data:csv});
    if(res && res.status){ toast('Export gestart — controleer je downloads.'); }
  }catch(e){
    toast('Downloaden is niet gelukt of werd geannuleerd.');
  }
}

function bkDatum(str){
  if(!str) return null;
  const m = String(str).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(str); return isNaN(d) ? null : d;
}
function isoDag(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function maandSleutel(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function maandLabel(k){ const [y,m]=k.split('-'); return MAANDEN[+m-1].slice(0,3)+' '+y.slice(2); }
function schooljaarStart(d){ d = d||new Date(); return new Date(d.getMonth()>=8 ? d.getFullYear() : d.getFullYear()-1, 8, 1); }
// Schoolritme (Stefan, 2026-10-04): schooljaar 1/9–31/8, trimesters 1/9–31/12, 1/1–31/3, 1/4–30/6 (juli–augustus = vakantie).
function bkPeriodes(){
  const sj = schooljaarStart(); const j = sj.getFullYear(); const kort = y => String(y).slice(2);
  return [
    ['schooljaar', `Dit schooljaar (${j}–${kort(j+1)})`, sj, new Date(j+1,8,1)],
    ['t1', `1ste trimester (sep–dec ${j})`, new Date(j,8,1), new Date(j+1,0,1)],
    ['t2', `2de trimester (jan–maa ${j+1})`, new Date(j+1,0,1), new Date(j+1,3,1)],
    ['t3', `3de trimester (apr–jun ${j+1})`, new Date(j+1,3,1), new Date(j+1,6,1)],
    ['vorig', `Vorig schooljaar (${j-1}–${kort(j)})`, new Date(j-1,8,1), sj],
    ['alles', 'Alles', null, null],
  ];
}
function bkPeriode(){
  const lijst = bkPeriodes();
  const rij = lijst.find(p=>p[0]===(window._bkPer||'schooljaar')) || lijst[0];
  const [k, label, van, tot] = rij;
  return {k, van, tot, label, inPer: d => !!d && (!van || d>=van) && (!tot || d<tot)};
}
function bkMaanden(){
  // De maanden van de gekozen periode tot vandaag, ook lege, zodat de grafiek geen gaten verbergt.
  const per = bkPeriode(); const nu = new Date();
  let van = per.van;
  if(!van){ const alle = bkAlleDatums(); van = alle.length ? new Date(Math.min(...alle)) : schooljaarStart(); }
  const eind = per.tot && per.tot<=nu ? new Date(per.tot.getTime()-864e5) : nu;
  const uit = []; const d = new Date(van.getFullYear(), van.getMonth(), 1);
  while(d<=eind){ uit.push(maandSleutel(d)); d.setMonth(d.getMonth()+1); }
  return uit.length ? uit : [maandSleutel(van)];
}
function bkAlleDatums(){
  const d = bkData();
  return d.bonnen.map(b=>bkDatum(b.datum)).concat(d.orders.map(o=>bkDatum(o.geleverdOp||o.aangemaakt))).filter(Boolean).map(x=>x.getTime());
}
function bkFilterbalk(extra){
  return `<div class="bk-filter">
    <label>Periode ${`<select onchange="window._bkPer=this.value;renderMain()">${bkPeriodes().map(([k,l])=>`<option value="${k}" ${bkPeriode().k===k?'selected':''}>${l}</option>`).join('')}</select>`}</label>
    ${extra||''}
    <button class="btn ghost small" onclick="window._bkDemo=!window._bkDemo;window._bkDemoCache=null;renderMain()">${window._bkDemo?'Echte gegevens tonen':'Voorbeeldgegevens tonen'}</button>
  </div>
  ${window._bkDemo?'<div class="bk-demo">Je ziet <b>voorbeeldgegevens</b> om de grafieken te tonen. Ze zijn niet echt en worden niet bewaard.</div>':''}`;
}

/* Gegevens: echt of voorbeeld */
function bkData(){
  if(window._bkDemo){ const dd = bkDemoData(); return bkScope() ? Object.assign({}, dd, {orders: dd.orders.filter(o=>inScope(o.leerkrachtId))}) : dd; }
  return {
    bonnen: state.bestelbonnen||[],
    orders: state.orders.filter(o=>(o.status==='geleverd' || o.status==='deels') && inScope(o.leerkrachtId)),
    leveringen: state.leveringen||[], facturen: state.facturen||[],
    prijsLog: state.prijsLog||{}, waardeLog: state.waardeLog||[], budgetten: state.budgetten||{},
  };
}
function bkDemoData(){
  if(window._bkDemoCache) return window._bkDemoCache;
  let seed = 11; const rnd = ()=>{ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; };
  const pick = a => a[Math.floor(rnd()*a.length)];
  const levs = state.leveranciers.map(l=>l.naam);
  const gewicht = {'Solucious':4,'Claessens':3,'Delidis':1.6,'Verbiest':1.4,'Rombouts':0.8,'Horeca Totaal':2.2};
  const chefs = state.users.filter(u=>u.rol==='leerkracht');
  const lessen = ['1ste graad A','2de graad B','3de graad keuken','Restaurantdag','Banket 6de jaar','Proeverij'];
  const prods = state.products.filter(p=>p.prijs>0);
  const nu = new Date(); const bonnen=[], orders=[], leveringen=[], facturen=[], waardeLog=[]; const prijsLog={};
  let nr = 0;
  const start = new Date(schooljaarStart().getFullYear()-1, 8, 1);
  const aantalM = (nu.getFullYear()-start.getFullYear())*12 + nu.getMonth()-start.getMonth();
  for(let m=aantalM; m>=0; m--){
    const maand = new Date(nu.getFullYear(), nu.getMonth()-m, 1);
    const seizoen = [7,8].includes(maand.getMonth()) ? 0.15 : 1; // zomervakantie
    levs.forEach(lev=>{
      const n = Math.round((gewicht[lev]||1)*seizoen*(1+rnd()));
      const eigen = prods.filter(p=>p.leverancier===lev); const bron = eigen.length ? eigen : prods;
      for(let i=0;i<n;i++){
        const dag = new Date(maand.getFullYear(), maand.getMonth(), 1+Math.floor(rnd()*27));
        if(dag>nu) continue;
        const regels = Array.from({length:3+Math.floor(rnd()*6)},()=>{ const p=pick(bron); return {productId:p.id, naam:p.naam, eenheid:p.eenheid, aantal:1+Math.floor(rnd()*8), prijs:p.prijs}; });
        nr++;
        const waarde = Math.round(regels.reduce((s,r)=>s+r.aantal*r.prijs,0)*100)/100;
        const id = `BB-${dag.getFullYear()}-${String(nr).padStart(4,'0')}`;
        bonnen.push({id, leverancier:lev, datum:dag.toLocaleDateString('nl-BE')+' 09:00', regels, waarde, status:'besteld', door:'Magazijnbeheerder', kanalen:[{type:'mail'}]});
        const lvRegels = regels.map(r=>({...r, qty: rnd()<0.08 ? Math.max(0,r.aantal-1) : r.aantal}));
        const lvDag = new Date(dag.getTime()+2*864e5);
        if(lvDag<=nu) leveringen.push({id:'LV-'+nr, datum:lvDag.toLocaleDateString('nl-BE')+' 08:30', leverancier:lev, regels:lvRegels, waarde: Math.round(lvRegels.reduce((s,r)=>s+r.qty*r.prijs,0)*100)/100});
        if(lvDag<=nu && rnd()<0.35){
          const fr = lvRegels.map(r=>{ const hoger = rnd()<0.12; const meer = rnd()<0.08;
            return {productId:r.productId, naam:r.naam, eenheid:r.eenheid, qty: meer ? r.qty+1 : r.qty, lvQty:r.qty, prijs: hoger ? Math.round(r.prijs*1.08*100)/100 : r.prijs, oudPrijs:r.prijs}; });
          facturen.push(bkFactuurSamenvatting({id:'F-'+nr, datum:new Date(lvDag.getTime()+5*864e5).toLocaleDateString('nl-BE')+' 10:00', leverancier:lev, regels:fr}));
        }
      }
    });
    const nOrders = Math.round(14*seizoen*(0.8+rnd()*0.5));
    for(let i=0;i<nOrders;i++){
      const dag = new Date(maand.getFullYear(), maand.getMonth(), 1+Math.floor(rnd()*27)); if(dag>nu) continue;
      const chef = pick(chefs);
      orders.push({id:'od'+m+'-'+i, leerkracht:chef.naam, leerkrachtId:chef.id, les:pick(lessen), status:'geleverd',
        kost: Math.round((25+rnd()*160)*100)/100, aangemaakt:dag.toLocaleDateString('nl-BE')+' 08:00', geleverdOp:dag.toLocaleDateString('nl-BE')+' 10:00',
        items:[{productId:pick(prods).id, aantal:1+Math.floor(rnd()*5)}]});
    }
    const perCat = {}; CATEGORIES.forEach(c=>{ perCat[c] = Math.round((rnd()*900+(c==='Diepvries'||c==='Droge voeding & kruiden'?900:100))*100)/100; });
    waardeLog.push({d: isoDag(new Date(maand.getFullYear(), maand.getMonth(), 28 > nu.getDate() && m===0 ? nu.getDate() : 28)), totaal: Math.round(Object.values(perCat).reduce((s,v)=>s+v,0)*100)/100, perCat});
  }
  prods.slice(0,400).filter((p,i)=>i%17===0).forEach(p=>{
    const oud = Math.round(p.prijs*(0.84+rnd()*0.2)*100)/100;
    prijsLog[p.id] = [{d: isoDag(new Date(nu.getFullYear(), nu.getMonth()-4, 3)), p: oud}, {d: isoDag(new Date(nu.getFullYear(), nu.getMonth()-1, 12)), p: p.prijs}];
  });
  const budgetten = {}; const sj = schooljaarStart();
  chefs.forEach((c,i)=>{ const v = orders.filter(o=>o.leerkrachtId===c.id && bkDatum(o.geleverdOp)>=sj).reduce((s,o)=>s+o.kost,0);
    budgetten[c.id] = v>0 ? Math.max(50, Math.round(v/[0.45,0.86,1.08,0.3,0.62][i%5]/10)*10) : 1500; });
  window._bkDemoCache = {bonnen, orders, leveringen, facturen, prijsLog, waardeLog, budgetten, demo:true};
  return window._bkDemoCache;
}

/* Bijhouden: prijzen en voorraadwaarde (bij elke save), leveringen en facturen (bij bevestigen) */
function bkLogBij(){
  if(!state.prijsLog) state.prijsLog = {};
  const vandaag = isoDag(new Date());
  state.products.forEach(p=>{
    if(!(p.prijs>0)) return;
    const log = state.prijsLog[p.id] || (state.prijsLog[p.id] = []);
    const laatst = log[log.length-1];
    if(!laatst || Math.abs(laatst.p - p.prijs) > 0.004){
      log.push({d:vandaag, p:p.prijs});
      if(log.length>20) log.splice(0, log.length-20);
    }
  });
  if(!state.waardeLog) state.waardeLog = [];
  const perCat = {}; let totaal = 0;
  state.products.forEach(p=>{ const w = (p.voorraad||0)*(p.prijs||0); if(w>0){ perCat[p.categorie] = Math.round(((perCat[p.categorie]||0)+w)*100)/100; totaal += w; } });
  const rij = {d:vandaag, totaal: Math.round(totaal*100)/100, perCat};
  const laatst = state.waardeLog[state.waardeLog.length-1];
  if(laatst && laatst.d===vandaag) state.waardeLog[state.waardeLog.length-1] = rij; else state.waardeLog.push(rij);
}
function bkMeestVoorkomend(lijst){
  const t = {}; lijst.filter(Boolean).forEach(x=>t[x]=(t[x]||0)+1);
  return Object.keys(t).sort((a,b)=>t[b]-t[a])[0] || '';
}
function bkFactuurSamenvatting(f){
  // Terug te vragen: meer gefactureerd dan geleverd, of duurder dan de gekende prijs.
  let terug = 0, afw = 0, totaal = 0;
  f.regels.forEach(r=>{
    totaal += r.qty*(r.prijs||0);
    const teVeel = r.lvQty!=null ? Math.max(0, r.qty - r.lvQty) : 0;
    const duurder = r.oudPrijs!=null && r.prijs!=null ? Math.max(0, r.prijs - r.oudPrijs) : 0;
    r.terug = Math.round((teVeel*(r.prijs||0) + duurder*Math.min(r.qty, r.lvQty!=null?r.lvQty:r.qty))*100)/100;
    r.afwijking = teVeel>0.001 || (r.lvQty!=null && r.qty < r.lvQty-0.001) || duurder>0.004;
    if(r.afwijking) afw++;
    terug += r.terug;
  });
  return {...f, totaal: Math.round(totaal*100)/100, terug: Math.round(terug*100)/100, afwijkingen: afw};
}

/* Grafieken: eigen SVG/HTML, met kleurrollen uit :root (licht en donker apart gekozen) */
function bkLeeg(tekst){ return `<div class="bk-leeg">${tekst}</div>`; }
function bkKleur(i){ return i<0 ? 'var(--series-overig)' : `var(--series-${(i%6)+1})`; }
function bkTip(t){ return `data-tip="${esc(t)}" tabindex="0"`; }
function donutHtml(items, opts){
  opts = opts||{};
  items = items.filter(i=>i.waarde>0).sort((a,b)=>b.waarde-a.waarde);
  if(!items.length) return bkLeeg(opts.leeg||'Nog geen gegevens in deze periode.');
  if(items.length>6){ const rest = items.slice(5); items = items.slice(0,5).concat([{label:`Overig (${rest.length})`, waarde:rest.reduce((s,i)=>s+i.waarde,0), kleur:-1}]); }
  // Vaste kleur per leverancier/chef, behalve als twee getoonde stukken dezelfde kleur zouden krijgen.
  const vast = items.filter(i=>i.kleur!=null && i.kleur>=0).map(i=>i.kleur%6);
  if(new Set(vast).size!==vast.length) items = items.map(i=>i.kleur===-1 ? i : {...i, kleur:undefined});
  const tot = items.reduce((s,i)=>s+i.waarde,0);
  const cx=90, cy=90, R=78, r=50; let a = -Math.PI/2;
  const pt = (ang, rad)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
  const segs = items.map((it,idx)=>{
    const kleur = bkKleur(it.kleur!=null ? it.kleur : idx);
    const frac = it.waarde/tot; const pct = Math.round(frac*1000)/10;
    const tip = `${it.label}: ${euro(it.waarde)} (${String(pct).replace('.',',')}%)`;
    if(frac>0.9999) return `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" style="fill:none;stroke:${kleur};stroke-width:${R-r}px" ${bkTip(tip)}/>`;
    const a2 = a + frac*2*Math.PI; const groot = frac>0.5?1:0;
    const [x1,y1]=pt(a,R),[x2,y2]=pt(a2,R),[x3,y3]=pt(a2,r),[x4,y4]=pt(a,r);
    const d = `M${x1},${y1} A${R},${R} 0 ${groot} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${groot} 0 ${x4},${y4}Z`;
    a = a2;
    return `<path d="${d}" style="fill:${kleur};stroke:var(--panel);stroke-width:2px;stroke-linejoin:round" ${bkTip(tip)}/>`;
  }).join('');
  return `<div class="bk-donut">
    <svg viewBox="0 0 180 180" role="img" aria-label="${esc(opts.titel||'Verdeling')}">${segs}
      <text x="90" y="86" text-anchor="middle" class="bk-donut-tot">${euroKort(tot)}</text>
      <text x="90" y="104" text-anchor="middle" class="bk-donut-sub">${esc(opts.sub||'totaal')}</text></svg>
    <ul class="bk-legende">${items.map((it,idx)=>`<li><span class="bk-sw" style="background:${bkKleur(it.kleur!=null?it.kleur:idx)}"></span><span class="bk-ll">${esc(it.label)}</span><span class="bk-lv">${euro(it.waarde)}</span><span class="bk-lp">${String(Math.round(it.waarde/tot*1000)/10).replace('.',',')}%</span></li>`).join('')}</ul>
  </div>`;
}
function stapLijn(max){
  const ruw = max/4; const mag = Math.pow(10, Math.floor(Math.log10(ruw||1)));
  const stap = [1,2,2.5,5,10].map(f=>f*mag).find(s=>s>=ruw) || mag*10;
  return stap;
}
function kolomHtml(punten, opts){
  opts = opts||{};
  if(!punten.length || !punten.some(p=>p.waarde>0)) return bkLeeg(opts.leeg||'Nog geen gegevens in deze periode.');
  const W=opts.breed?1000:640, H=opts.breed?240:220, L=48, B=26, T=10, Rr=8;
  const max = Math.max(...punten.map(p=>p.waarde));
  const stap = stapLijn(max); const top = Math.ceil(max/stap)*stap || 1;
  const bw = (W-L-Rr)/punten.length; const breed = Math.min(36, bw*0.62);
  const y = v => T + (H-T-B)*(1 - v/top);
  let grid = '';
  for(let v=0; v<=top+0.001; v+=stap) grid += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" class="bk-grid"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="bk-as">${euroKort(v)}</text>`;
  const bars = punten.map((p,i)=>{
    const x = L + i*bw + (bw-breed)/2; const h = Math.max(0, y(0)-y(p.waarde)); const rr = Math.min(4, h/2, breed/2);
    const yy = y(p.waarde);
    const d = h>0 ? `M${x},${y(0)} V${yy+rr} Q${x},${yy} ${x+rr},${yy} H${x+breed-rr} Q${x+breed},${yy} ${x+breed},${yy+rr} V${y(0)}Z` : '';
    const toonLabel = punten.length<=14 || i%2===0;
    return `<g ${bkTip(p.tip || (p.label+': '+euro(p.waarde)))}><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>${d?`<path d="${d}" style="fill:${opts.kleur||'var(--series-1)'}"/>`:''}</g>
      ${toonLabel?`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" class="bk-as">${esc(p.label)}</text>`:''}`;
  }).join('');
  return `<svg class="bk-kolom" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.titel||'Grafiek')}">${grid}<line x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}" class="bk-basis"/>${bars}</svg>`;
}
function lijnHtml(punten, opts){
  opts = opts||{};
  if(punten.length<1) return bkLeeg(opts.leeg||'Nog geen gegevens.');
  const W=opts.breed?1000:640, H=opts.breed?240:220, L=52, B=26, T=12, Rr=12;
  const max = Math.max(...punten.map(p=>p.waarde), 1);
  const stap = stapLijn(max); const top = Math.ceil(max/stap)*stap || 1;
  const x = i => punten.length===1 ? (L+W-Rr)/2 : L + i*(W-L-Rr)/(punten.length-1);
  const y = v => T + (H-T-B)*(1 - v/top);
  let grid = '';
  for(let v=0; v<=top+0.001; v+=stap) grid += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" class="bk-grid"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="bk-as">${euroKort(v)}</text>`;
  const lijn = punten.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.waarde)}`).join(' ');
  const elk = Math.ceil(punten.length/8);
  const pts = punten.map((p,i)=>`<g ${bkTip(p.label+': '+euro(p.waarde))}><rect x="${x(i)-Math.max(8,(W-L-Rr)/punten.length/2)}" y="${T}" width="${Math.max(16,(W-L-Rr)/punten.length)}" height="${H-T-B}" fill="transparent"/><circle cx="${x(i)}" cy="${y(p.waarde)}" r="4" style="fill:var(--series-1);stroke:var(--panel);stroke-width:2px"/></g>
    ${i%elk===0 || i===punten.length-1 ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="bk-as">${esc(p.label)}</text>`:''}`).join('');
  return `<svg class="bk-kolom" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.titel||'Verloop')}">${grid}<line x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}" class="bk-basis"/><path d="${lijn}" style="fill:none;stroke:var(--series-1);stroke-width:2px;stroke-linejoin:round;stroke-linecap:round"/>${pts}</svg>`;
}
function balkenHtml(items, opts){
  opts = opts||{};
  if(!items.length) return bkLeeg(opts.leeg||'Nog geen gegevens in deze periode.');
  const max = Math.max(...items.map(i=>Math.abs(i.waarde)), 0.0001);

    <span class="bk-bv">${opts.fmt?opts.fmt(it.waarde):euro(it.waarde)}</span></div>`).join('')}</div>`;
}

/* CSV voor het boekhoudpakket: puntkomma, decimale komma, datum dd/mm/jjjj, UTF-8 met BOM (opent goed in Excel). */
function bkCsvGetal(n){ return (Math.round((n||0)*100)/100).toFixed(2).replace('.',','); }
function bkCsvDatum(str){ const d = bkDatum(str); return d ? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear() : ''; }
async function bkCsv(bestand, kop, rijen){
  if(window._bkDemo){ toast('Dit zijn voorbeeldgegevens. Schakel terug naar echte gegevens om te exporteren.'); return; }
  if(!rijen.length){ toast('Er zijn geen gegevens in deze periode om te exporteren.'); return; }
  const cel = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = '﻿' + [kop, ...rijen].map(r=>r.map(cel).join(';')).join('\r\n') + '\r\n';
  try{
    if(!window.claude || !window.claude.use){ toast('Bestand downloaden is in deze weergave niet beschikbaar.'); return; }
    const downloads = await window.claude.use('downloads');
    if(!downloads){ toast('Bestand downloaden is in deze weergave niet beschikbaar.'); return; }

/* Schermen */
function bkUitgavenPerMaand(d){
  const per = bkPeriode(); const maanden = bkMaanden(); const t = {}; maanden.forEach(m=>t[m]=0);
  d.bonnen.forEach(b=>{ const dt = bkDatum(b.datum); if(per.inPer(dt) && t[maandSleutel(dt)]!=null) t[maandSleutel(dt)] += b.waarde||0; });
  return maanden.map(m=>({label:maandLabel(m), waarde:t[m]}));
}
function bkPerLeverancier(d){
  const per = bkPeriode(); const t = {};
  d.bonnen.forEach(b=>{ if(per.inPer(bkDatum(b.datum))) t[b.leverancier||'Geen leverancier'] = (t[b.leverancier||'Geen leverancier']||0) + (b.waarde||0); });
  return Object.entries(t).map(([label,waarde])=>({label, waarde, kleur: levKleurIndex(label)}));
}
function bkVerbruikPerChef(d){
  const per = bkPeriode(); const t = {};
  d.orders.forEach(o=>{ if(per.inPer(bkDatum(o.geleverdOp||o.aangemaakt))){ const k = o.leerkrachtId||o.leerkracht; t[k] = t[k] || {label:o.leerkracht, waarde:0, kleur:chefKleurIndex(o.leerkrachtId)}; t[k].waarde += o.kost||0; } });
  return Object.values(t);
}
function bkBudgetStand(d){
  const sj = schooljaarStart();
  return state.users.filter(u=>isBesteller(u) && inScope(u.id)).map(u=>{
    const budget = d.budgetten[u.id]||0;
    const verbruik = d.orders.filter(o=>o.leerkrachtId===u.id && (bkDatum(o.geleverdOp||o.aangemaakt)||0)>=sj).reduce((s,o)=>s+(o.kost||0),0);
    return {u, budget, verbruik, pct: budget ? verbruik/budget*100 : 0};
  });
}
function bkStatusHtml(pct, budget){
  if(!budget) return '<span class="bk-status bk-st-geen">Geen budget</span>';
  if(pct>=100) return '<span class="bk-status bk-st-crit">⛔ Over budget</span>';
  if(pct>=80) return '<span class="bk-status bk-st-warn">⚠ Bijna op</span>';
  return '<span class="bk-status bk-st-ok">✓ Binnen budget</span>';

function zetBudget(uid, val){
  const n = parseFloat(String(val).replace(',','.'));
  if(!state.budgetten) state.budgetten = {};
  if(isNaN(n) || n<=0) delete state.budgetten[uid]; else state.budgetten[uid] = Math.round(n*100)/100;
  const u = state.users.find(x=>x.id===uid);
  state.activity.push({tijd:nowStr(), tekst:`Budget ${u?u.naam:uid}: ${state.budgetten[uid]?euro(state.budgetten[uid]):'geen'}.`});
  save(); renderMain();
}

function bkPrijswijzigingen(d){
  const per = bkPeriode(); const uit = [];
  Object.entries(d.prijsLog).forEach(([pid, log])=>{
    if(!log || log.length<2) return;
    const nieuw = log[log.length-1], oud = log[log.length-2];
    const dt = new Date(nieuw.d); if(!per.inPer(dt) || !(oud.p>0) || Math.abs(nieuw.p-oud.p)/oud.p<0.0005) return;
    const p = state.products.find(x=>x.id===pid); if(!p) return;

/* ---------- Kassa (Lightspeed) ---------- */
// Lightspeed exporteert verkooprapporten als CSV of Excel. Die lezen we in, koppelen elk kassaproduct
// aan een vast recept (1 verkoop = 1 portie) of aan een product (bv. een flesje), boeken de voorraad af
// en bewaren omzet en kost voor de boekhouding. Een rechtstreekse API-koppeling komt pas met de server
// (de API-sleutel hoort in de .env van de server, nooit in deze pagina).
const KASSA_KOLOMMEN = {
  naam:   /^(product|productnaam|artikel|artikelnaam|item|item ?name|name|naam|omschrijving|description|produit|libell[eé])$/i,
  aantal: /^(aantal|qty|quantity|hoeveelheid|verkocht|sold|quantit[eé]|count|#)$/i,
  netto:  /(excl|netto|net|ht\b|hors)/i,
  omzet:  /^(omzet|totaal|total|bedrag|amount|revenue|sales|verkoop|ca|chiffre|prix total|total incl.*|totaal incl.*|incl.*)$/i,
  datum:  /^(datum|date|dag|day|business ?day|jour)$/i,
  cat:    /^(categorie|category|groep|group|cat[eé]gorie|rubriek|account ?group|productgroep)$/i,
};
function kassaSleutel(naam){ return String(naam||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function kassaGetal(v){
  if(typeof v==='number') return v;
  let t = String(v==null?'':v).replace(/[€\s]/g,'');
  if(/,\d{1,2}$/.test(t)) t = t.replace(/\./g,'').replace(',','.');   // 1.234,50
  else t = t.replace(/,/g,'');                                        // 1,234.50
  const n = parseFloat(t); return isNaN(n) ? 0 : n;
}
function kassaCsvRijen(tekst){
  const eerste = tekst.split(/\r?\n/).find(l=>l.trim()) || '';
  const sep = [';','\t',','].map(s=>[s, eerste.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rijen = []; let rij = [], cel = '', q = false;
  for(let i=0;i<tekst.length;i++){
    const c = tekst[i];
    if(q){ if(c==='"' && tekst[i+1]==='"'){ cel+='"'; i++; } else if(c==='"') q=false; else cel+=c; }
    else if(c==='"') q = true;
    else if(c===sep){ rij.push(cel); cel=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && tekst[i+1]==='\n') i++; rij.push(cel); cel=''; if(rij.some(x=>x.trim())) rijen.push(rij); rij=[]; }
    else cel += c;
  }
  rij.push(cel); if(rij.some(x=>x.trim())) rijen.push(rij);
  return rijen;
}
function kassaRaadKolommen(kop){
  const k = kop.map(h=>String(h||'').trim());
  const vind = (re, behalve) => k.findIndex((h,i)=>re.test(h) && !(behalve||[]).includes(i));
  const naam = vind(KASSA_KOLOMMEN.naam), aantal = vind(KASSA_KOLOMMEN.aantal), datum = vind(KASSA_KOLOMMEN.datum), cat = vind(KASSA_KOLOMMEN.cat);
  // Liefst een bedrag excl. btw; anders het totaal.
  let omzet = k.findIndex(h=>KASSA_KOLOMMEN.netto.test(h) && /(omzet|totaal|total|bedrag|amount|sales|verkoop|revenue|prijs|price)/i.test(h));
  const netto = omzet>=0;
  if(omzet<0) omzet = vind(KASSA_KOLOMMEN.omzet);
  return {naam, aantal, omzet, datum, cat, netto};
}
async function kassaLeesBestand(input){
  const f = input.files && input.files[0]; if(!f) return;
  const st = document.getElementById('kassaStatus'); if(st) st.textContent = 'Bestand lezen…';
  try{
    let rijen;
    if(/\.(xlsx|xls)$/i.test(f.name)){
      if(!window.XLSX){
        await new Promise((ok,nok)=>{ const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = nok; document.head.appendChild(s); });
      }
      const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
      rijen = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''}).filter(r=>r.some(c=>String(c).trim()));
    } else {
      rijen = kassaCsvRijen((await f.text()).replace(/^﻿/,''));
    }
    kassaStart(rijen, f.name);
  }catch(e){ if(st) st.textContent = ''; toast('Dit bestand kon niet gelezen worden. Exporteer het rapport in Lightspeed als CSV of Excel en probeer opnieuw.'); }
}
function kassaPlak(){
  const t = (document.getElementById('kassaPlak')||{}).value || '';
  if(!t.trim()){ toast('Plak eerst de inhoud van het rapport.'); return; }
  kassaStart(kassaCsvRijen(t), 'geplakt rapport');
}
function kassaStart(rijen, bestand){
  // De kopregel is de eerste rij waarin we een productkolom herkennen (Lightspeed zet er soms titelregels boven).
  let kopIdx = rijen.findIndex(r=>{ const g = kassaRaadKolommen(r); return g.naam>=0 && (g.aantal>=0 || g.omzet>=0); });
  if(kopIdx<0) kopIdx = 0;
  const kop = rijen[kopIdx].map(h=>String(h||'').trim());
  // Zonder datumkolom: de datum uit de titelregels boven de tabel (bv. "Periode: 02/10/2026"), anders vandaag.
  const titelDatum = rijen.slice(0, kopIdx).map(r=>bkDatum(r.join(' '))).find(Boolean);
  window._kassa = {bestand, kop, data: rijen.slice(kopIdx+1), kol: kassaRaadKolommen(kop), datum: isoDag(titelDatum || new Date()), btw: 12, koppel:{}};
  renderMain();
}
function kassaRegels(){
  const k = window._kassa; if(!k) return [];
  const {naam, aantal, omzet, datum, cat} = k.kol;
  const groep = {};
  k.data.forEach(r=>{
    const n = String(r[naam]==null?'':r[naam]).trim();
    if(!n || /^(totaal|total|subtotaal|subtotal|som)$/i.test(n)) return;
    const d = datum>=0 && r[datum]!=='' ? (typeof r[datum]==='number' ? new Date(Math.round((r[datum]-25569)*864e5)) : bkDatum(r[datum])) : null;
    const dag = d ? isoDag(d) : k.datum;
    const sl = dag+'|'+kassaSleutel(n);
    const g = groep[sl] = groep[sl] || {sleutel:kassaSleutel(n), naam:n, dag, aantal:0, omzet:0, cat: cat>=0 ? String(r[cat]||'').trim() : ''};
    g.aantal += aantal>=0 ? kassaGetal(r[aantal]) : 1;
    g.omzet += omzet>=0 ? kassaGetal(r[omzet]) : 0;
  });
  const factor = k.kol.netto || !(k.btw>0) ? 1 : 1/(1+k.btw/100);
  return Object.values(groep).filter(g=>g.aantal!==0 || g.omzet!==0).map(g=>{
    const kp = k.koppel[g.sleutel] || (state.kassaKoppeling||{})[g.sleutel] || kassaRaad(g.naam);
    return {...g, omzetExcl: rond(g.omzet*factor,2), koppeling: kp, ...kassaKost(kp, g.aantal)};
  }).sort((a,b)=>a.dag.localeCompare(b.dag) || b.omzet-a.omzet);
}
function kassaRaad(naam){
  // Voorstel op naam: eerst een vast recept, dan een product met exact dezelfde naam.
  const s = kassaSleutel(naam);
  const r = state.recipes.find(x=>kassaSleutel(x.naam)===s && x.status!=='afgekeurd');
  if(r) return {type:'recept', id:r.id, voorstel:true};
  const p = state.products.find(x=>kassaSleutel(x.naam)===s);
  if(p) return {type:'product', id:p.id, voorstel:true};
  return {type:'geen'};
}
function kassaKost(kp, aantal){
  // Wat er uit de voorraad gaat en wat het kost.
  if(!kp || kp.type==='geen') return {kost:0, afboek:[], label:''};
  if(kp.type==='product'){
    const p = state.products.find(x=>x.id===kp.id); if(!p) return {kost:0, afboek:[], label:'(product weg)'};
    return {kost: rond(aantal*(p.prijs||0),2), afboek:[{product:p, aantal}], label:p.naam, zonderPrijs:!p.prijs};
  }
  const r = state.recipes.find(x=>x.id===kp.id); if(!r) return {kost:0, afboek:[], label:'(recept weg)'};
  const factor = aantal / (r.basisPersonen||1);
  const afboek = []; let kost = 0, zonderPrijs = false;
  (r.ingredienten||[]).forEach(l=>{ const i = regelInfo(l, factor); if(i.ontbreekt || !i.product){ zonderPrijs = true; return; } if(i.zonderPrijs) zonderPrijs = true; kost += i.kost||0; afboek.push({product:i.product, aantal:i.productAantal}); });
  return {kost: rond(kost,2), afboek, label:r.naam, zonderPrijs};
}
function kassaKoppelOpties(){
  return `<datalist id="kassaDoelen">${state.recipes.filter(r=>r.status!=='afgekeurd').map(r=>`<option value="Recept: ${esc(r.naam)}">`).join('')}${state.products.map(p=>`<option value="Product: ${esc(p.naam)}">`).join('')}</datalist>`;
}
function kassaKoppelTekst(kp){
  if(!kp || kp.type==='geen') return '';
  if(kp.type==='recept'){ const r = state.recipes.find(x=>x.id===kp.id); return r ? 'Recept: '+r.naam : ''; }
  const p = state.products.find(x=>x.id===kp.id); return p ? 'Product: '+p.naam : '';
}
function kassaZetKoppeling(sleutel, tekst){
  const k = window._kassa; const t = String(tekst||'').trim();
  let kp = {type:'geen'};
  const m = t.match(/^(Recept|Product):\s*(.+)$/i);
  if(m){
    if(/recept/i.test(m[1])){ const r = state.recipes.find(x=>x.naam===m[2]); if(r) kp = {type:'recept', id:r.id}; }
    else { const p = state.products.find(x=>x.naam===m[2]); if(p) kp = {type:'product', id:p.id}; }
    if(kp.type==='geen'){ toast('Kies een recept of product uit de lijst.'); }
  }
  k.koppel[sleutel] = kp;
  renderMain();
}
function kassaZetKolom(veld, idx){ window._kassa.kol[veld] = parseInt(idx,10); if(veld==='omzet') window._kassa.kol.netto = KASSA_KOLOMMEN.netto.test(window._kassa.kop[idx]||''); renderMain(); }
function kassaBevestig(){
  const k = window._kassa; const regels = kassaRegels();
  if(!regels.length){ toast('Er zijn geen verkoopregels herkend.'); return; }
  const dagen = [...new Set(regels.map(r=>r.dag))];
  const afd = kassaAfd();
  const dubbel = dagen.filter(d=>(state.kassaVerkoop||[]).some(v=>v.dag===d && kassaVanAfd(v, afd)));
  if(dubbel.length && !confirm(`Voor ${dubbel.map(d=>bkCsvDatum(d)).join(', ')} werd al een kassarapport ingelezen. Toch opnieuw inlezen? De voorraad wordt dan nog eens afgeboekt.`)) return;
  if(!state.kassaVerkoop) state.kassaVerkoop = [];
  if(!state.kassaKoppeling) state.kassaKoppeling = {};
  const tekort = []; let afgeboekt = 0;
  dagen.forEach(d=>{
    const rr = regels.filter(r=>r.dag===d);
    rr.forEach(r=>{
      if(r.koppeling && r.koppeling.type!=='geen') state.kassaKoppeling[r.sleutel] = {type:r.koppeling.type, id:r.koppeling.id};
      r.afboek.forEach(a=>{

function bkDemoKassa(afd){
  window._bkDemoKassaA = window._bkDemoKassaA || {};
  if(window._bkDemoKassaA[afd]) return window._bkDemoKassaA[afd];
  let seed = 23; const rnd = ()=>{ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; };
  const bak = afd==='bakkerij';
  if(bak) seed = 41;
  const kaart = bak ? [['Grijs brood','Brood',3.2,0.25],['Volkoren brood','Brood',3.4,0.26],['Croissant','Viennoiserie',1.4,0.3],['Chocoladebroodje','Viennoiserie',1.6,0.32],['Rozijnenkoek','Viennoiserie',1.8,0.3],['Appeltaart','Patisserie',14,0.28],['Eclair','Patisserie',2.8,0.27],['Pralines 250g','Chocolade',12,0.35]] : [['Dagsoep','Voorgerecht',4.5,0.22],['Garnaalkroket','Voorgerecht',14,0.38],['Vol-au-vent','Hoofdgerecht',18,0.31],['Stoofvlees met friet','Hoofdgerecht',19,0.33],['Vispannetje','Hoofdgerecht',22,0.41],['Vegetarische lasagne','Hoofdgerecht',16,0.24],['Dame blanche','Dessert',8,0.2],['Chocolademousse','Dessert',7,0.18],['Koffie','Drank',2.8,0.12],['Huiswijn glas','Drank',5.5,0.3],['Water 50cl','Drank',3.5,0.15]];
  const uit = []; const nu = new Date(); const start = new Date(schooljaarStart().getFullYear()-1, 8, 1);
  for(let d = new Date(start); d<=nu; d.setDate(d.getDate()+1)){
    const wd = d.getDay(); if(wd===0 || wd===6 || (!bak && wd===3) || [6,7].includes(d.getMonth())) continue; // restaurant op ma, di, do, vr; niet in de zomer
    const gasten = 18 + Math.floor(rnd()*30);
    const regels = kaart.map(([naam,cat,prijs,ratio])=>{ const aantal = Math.round(gasten*(bak?(prijs>10?0.1:0.6):cat==='Drank'?1.2:cat==='Hoofdgerecht'?0.3:0.45)*(0.6+rnd()*0.8));
      const omzetExcl = rond(aantal*prijs/(bak?1.06:cat==='Drank'&&/wijn/i.test(naam)?1.21:1.12),2); return {naam, cat, aantal, omzet:rond(aantal*prijs,2), omzetExcl, kost:rond(omzetExcl*ratio*(0.9+rnd()*0.2),2), koppeling:{type:'recept'}}; });

  }
  window._bkDemoKassaA[afd] = uit; return uit;
}

          <button class="btn ghost" aria-label="Eén meer" onclick="telStap('${p.id}',1)">+</button></div>
      </div>`; }).join('') || '<div class="empty">Geen producten gevonden.</div>'}
    ${lijst.length>toon?`<div style="text-align:center;margin:12px 0;"><button class="btn ghost" onclick="window._telToon=${toon+120};renderMain()">Toon meer (${lijst.length-toon} over)</button></div>`:''}

function telZet(pid, val){
  if(!state.telConcept) state.telConcept = {};
  const t = String(val).trim();
  if(t===''){ delete state.telConcept[pid]; }
  else { const n = parseFloat(t.replace(',','.')); if(isNaN(n) || n<0){ renderMain(); return; } state.telConcept[pid] = Math.round(n*100)/100; }
  save(); renderMain();
}
function telStap(pid, d){
  const p = state.products.find(x=>x.id===pid); if(!p) return;
  if(!state.telConcept) state.telConcept = {};
  const start = state.telConcept[pid]!=null ? state.telConcept[pid] : Math.max(0, p.voorraad);
  state.telConcept[pid] = Math.max(0, Math.round((start + d)*100)/100);
  save(); renderMain();
}
function telWis(){ if(!confirm('Het concept van deze telling wissen?')) return; state.telConcept = {}; save(); renderMain(); }
function telOpslaan(){
  const c = state.telConcept || {}; const ids = Object.keys(c);
  if(!ids.length) return;
  let gewijzigd = 0; const nu = nowStr();
  const tl = registreerTelling(c, 'telling');
  ids.forEach(pid=>{ const p = state.products.find(x=>x.id===pid); if(!p) return; if(Math.abs(p.voorraad - c[pid])>0.001) gewijzigd++; p.voorraad = c[pid]; p.laatstGeteld = nu; });
  state.activity.push({tijd:nu, tekst:`Voorraadtelling opgeslagen door ${currentUser().naam}: ${ids.length} producten geteld, ${gewijzigd} aangepast.`});
  state.telConcept = {}; save();
  const vs = tl ? tellingSamenvatting(tl) : null;
  toast(`Telling opgeslagen: ${ids.length} producten geteld, ${gewijzigd} aangepast.`+(vs && vs.nVerschil ? ` ${vs.nVerschil} product(en) wijken af van wat verwacht was (tekort ${euro(vs.manco)}). Bekijk het onder Rapporten › Verschilrapport.` : ''));
  renderMain();
}

/* ---------- Allergenen (de 14 wettelijke, EU 1169/2011) ---------- */
// Per product: p.allerg = {code:'b'|'s'} (b = bevat, s = kan sporen bevatten) en p.allergOk = true
// zodra het magazijn het product heeft nagekeken (ook als het geen enkel allergeen bevat).
// Een ingrediënt telt alle artikels mee die eraan gekoppeld zijn; een recept telt al zijn ingrediënten.
const ALLERGENEN = [
  {k:'gluten', n:'Gluten', i:'🌾'}, {k:'schaal', n:'Schaaldieren', i:'🦐'}, {k:'ei', n:'Eieren', i:'🥚'},
  {k:'vis', n:'Vis', i:'🐟'}, {k:'pinda', n:"Pinda's", i:'🥜'}, {k:'soja', n:'Soja', i:'🫘'},
  {k:'melk', n:'Melk', i:'🥛'}, {k:'noten', n:'Noten', i:'🌰'}, {k:'selder', n:'Selder', i:'🥬'},
  {k:'mosterd', n:'Mosterd', i:'🟡'}, {k:'sesam', n:'Sesam', i:'⚪'}, {k:'sulfiet', n:'Sulfieten', i:'🍷'},
  {k:'lupine', n:'Lupine', i:'🌼'}, {k:'weekdier', n:'Weekdieren', i:'🦪'},
];
const ALLERG_NAAM = Object.fromEntries(ALLERGENEN.map(a=>[a.k,a]));
// Alleen een VOORSTEL op basis van de productnaam: het magazijn controleert altijd het etiket.
const ALLERG_WOORDEN = {
  gluten:/bloem|brood|pasta|spaghetti|tagliatel|penne|fusilli|lasagne|macaroni|couscous|bulgur|paneermeel|panko|tarwe|spelt|rogge|gerst|haver|croissant|bladerdeeg|deeg|koek|cake|biscuit|wafel|taart|pizza|seitan|\bbier|semolina|griesmeel|noedel|wrap|beschuit|speculoos|crouton|sojasaus|soja saus|piccolo|baguette|pistolet|ciabatta|focaccia|bagel/,
  schaal:/garnaal|garnalen|scampi|krab|kreeft|langoustine|gamba|crevette/,
  ei:/\beieren\b|\bei\b|\beigeel|\beiwit|\bdooier|mayonai|\bmayo\b|aioli|meringue|bearnaise|béarnaise|hollandaise|eiernoedel/,
  vis:/zalm|kabeljauw|tonijn|ansjovis|makreel|haring|forel|\btong\b|schol|heek|pangasius|tilapia|zeebaars|dorade|\bvis\b|visfumet|vissaus|sardien|kaviaar|zeewolf|zeeduivel|tarbot|griet|koolvis|wijting|worcester/,
  pinda:/pinda|arachide|saté|pindakaas/,
  soja:/soja|tofu|tempeh|edamame|\bmiso|tamari|ketjap/,
  melk:/melk|\broom\b|room |slagroom|kookroom|zure room|boter|kaas|yoghurt|yogurt|mascarpone|mozzarella|parmez|parmigiano|grana padano|ricotta|crème fraîche|creme fraiche|karnemelk|kwark|roomijs|lactose|feta|brie|camembert|gruy|emmental|gouda|cheddar|ghee|béchamel|bechamel|burrata|mimolette|comté|roquefort|gorgonzola|chocolade/,
  noten:/hazelno|walno|amandel|cashew|pecan|pistach|macadamia|paranoot|\bnoten\b|praliné|praline|marsepein|frangipane|nougat|gianduja/,
  selder:/selder|céleri|bouillon|fond /,
  mosterd:/mosterd|moutarde|dijon/,
  sesam:/sesam|tahin|hummus|houmous|gomasio/,
  sulfiet:/\bwijn|porto|sherry|madeira|azijn|cider|gedroogde abrikoos|vermout|cognac|calvados|noilly/,
  lupine:/lupine/,
  weekdier:/mossel|oester|inktvis|calamar|octopus|sint-jakob|coquille|\bslak|escargot|wulk|kokkel|vongole|zeekat|pijlinktvis/,
};
const ALLERG_NIET = /nootmuskaat|kokosno|kokos/;
function allergVoorstel(naam){
  const t = ' '+String(naam||'').toLowerCase()+' ';
  return ALLERGENEN.map(a=>a.k).filter(k=>{
    if(k==='noten' && ALLERG_NIET.test(t) && !/hazelno|walno|amandel|cashew|pecan|pistach|macadamia|paranoot/.test(t)) return false;
    return ALLERG_WOORDEN[k].test(t);
  });
}
function allergBadges(set, sporen, klein){
  const b = [...set].map(k=>`<span class="al-b" title="Bevat ${esc(ALLERG_NAAM[k].n)}">${ALLERG_NAAM[k].i} ${klein?'':esc(ALLERG_NAAM[k].n)}</span>`);
  const s = [...(sporen||[])].map(k=>`<span class="al-b al-s" title="Kan sporen bevatten van ${esc(ALLERG_NAAM[k].n)}">${ALLERG_NAAM[k].i} ${klein?'':'sporen '+esc(ALLERG_NAAM[k].n.toLowerCase())}</span>`);
  return b.concat(s).join('');
}
function sorteerAllerg(set){ const volg = ALLERGENEN.map(a=>a.k); return [...set].sort((a,b)=>volg.indexOf(a)-volg.indexOf(b)); }
// Allergenen van een ingrediënt: alle gekoppelde artikels samen (welk artikel ook gekozen wordt).
function ingAllerg(ing){
  const bevat = new Set(), sporen = new Set(), onbekend = [];
  const arts = (ing.artikelen||[]).map(a=>state.products.find(p=>p.id===a.productId)).filter(Boolean);
  if(!arts.length) onbekend.push(ing.naam);
  arts.forEach(p=>{
    if(!p.allergOk) onbekend.push(p.naam);
    Object.entries(p.allerg||{}).forEach(([k,v])=>{ if(v==='b') bevat.add(k); else if(v==='s') sporen.add(k); });
  });
  bevat.forEach(k=>sporen.delete(k));
  return {bevat, sporen, onbekend};
}
function receptAllerg(r){
  const bevat = new Set(), sporen = new Set(), onbekend = [];
  (r.ingredienten||[]).forEach(l=>{
    let x;
    if(l.ingredientId){ const ing = state.ingredienten.find(i=>i.id===l.ingredientId); x = ing ? ingAllerg(ing) : {bevat:new Set(), sporen:new Set(), onbekend:['(onbekend ingrediënt)']}; }
    else { const p = state.products.find(q=>q.id===l.productId); x = {bevat:new Set(), sporen:new Set(), onbekend:[]};
      if(!p || !p.allergOk) x.onbekend.push(p?p.naam:'(onbekend product)');
      if(p) Object.entries(p.allerg||{}).forEach(([k,v])=>{ if(v==='b') x.bevat.add(k); else if(v==='s') x.sporen.add(k); }); }
    x.bevat.forEach(k=>bevat.add(k)); x.sporen.forEach(k=>sporen.add(k)); onbekend.push(...x.onbekend);
  });
  bevat.forEach(k=>sporen.delete(k));
  return {bevat:new Set(sorteerAllerg(bevat)), sporen:new Set(sorteerAllerg(sporen)), onbekend:[...new Set(onbekend)]};
}
function receptAllergPaneel(r){
  const a = receptAllerg(r);
  const geen = !a.bevat.size && !a.sporen.size;
  return `<div class="section-title">Allergenen</div>
    <div class="al-paneel">
      ${a.bevat.size||a.sporen.size ? `<div class="al-rij">${allergBadges(a.bevat, a.sporen)}</div>` : `<p style="margin:0;">${a.onbekend.length?'Nog geen allergenen gevonden.':'Bevat geen van de 14 allergenen.'}</p>`}
      ${a.onbekend.length ? `<p class="al-let">⚠ Nog niet volledig: het magazijn heeft de allergenen van ${a.onbekend.slice(0,6).map(esc).join(', ')}${a.onbekend.length>6?` en ${a.onbekend.length-6} andere`:''} nog niet nagekeken. Controleer het etiket voor je dit aan een gast meldt.</p>` : ''}
      <div class="row" style="margin-top:8px;"><button class="btn secondary small" onclick="printAllergKaart('${r.id}')">🖨 Allergenenkaart</button></div>
    </div>`;
}
function allergKaartHtml(r){

}

function allergWissel(pid, k){

}
function allergNeemVoorstel(pid){

function allergKlaar(pid){

/* ---------- HACCP bij ontvangst: THT, lotnummer, temperatuur ---------- */
// Maximale kerntemperatuur bij ontvangst (°C) per categorie. Gangbare FAVV-richtwaarden;
// diepvries: -18 °C is het doel, boven -15 °C wordt het geweigerd.
const HACCP_NORM = {'Vlees & gevogelte':4, 'Vis & zeevruchten':2, 'Zuivel & eieren':7, 'Traiteur & apero':7, 'Diepvries':-15};
const THT_WAARSCHUW_DAGEN = 3;
function haccpNorm(p){ return p && HACCP_NORM[p.categorie]!=null ? HACCP_NORM[p.categorie] : null; }
function setLeveringVeld(idx, k, v){
  const r = (window._leveringRows||[])[idx]; if(!r) return;
  if(k==='temp'){ const n = parseFloat(String(v).replace(',','.')); r.temp = isNaN(n) ? null : n; renderMain(); return; }
  r[k] = String(v||'').trim();
}
function haccpCellen(r, idx){
  const p = r.matchedId ? state.products.find(x=>x.id===r.matchedId) : null;
  const norm = haccpNorm(p);
  const teWarm = norm!=null && r.temp!=null && r.temp>norm;
  return `<td><input type="date" value="${esc(r.tht||'')}" style="width:140px;" aria-label="Houdbaar tot" onchange="setLeveringVeld(${idx},'tht',this.value)"></td>
    <td><input value="${esc(r.lot||'')}" style="width:100px;" placeholder="lot" aria-label="Lotnummer" onchange="setLeveringVeld(${idx},'lot',this.value)"></td>
    <td>${norm!=null ? `<input type="number" step="0.1" value="${r.temp!=null?r.temp:''}" style="width:70px;${teWarm?'border-color:var(--brick);':''}" placeholder="≤ ${norm}" aria-label="Temperatuur bij ontvangst" onchange="setLeveringVeld(${idx},'temp',this.value)">${teWarm?`<div class="tag crit" style="margin-top:3px;">te warm (≤ ${norm} °C)</div>`:''}` : '<span class="note" style="margin:0;">—</span>'}</td>`;
}
// Controle vóór het boeken: te warme producten en ontbrekende temperaturen.
function haccpControle(rows){
  const warm = [], zonder = [];
  rows.forEach(r=>{ const p = state.products.find(x=>x.id===r.matchedId); const n = haccpNorm(p); if(n==null) return;
    if(r.temp==null) zonder.push(p.naam); else if(r.temp>n) warm.push(`${p.naam} (${fmt(r.temp)} °C, max ${n} °C)`); });
  if(warm.length && !confirm(`Te warm bij ontvangst:\n${warm.join('\n')}\n\nVolgens HACCP weiger je dit best. Toch ontvangen en boeken?`)) return false;
  if(zonder.length && !confirm(`Geen temperatuur ingevuld voor ${zonder.length} gekoeld of diepgevroren product(en): ${zonder.slice(0,5).join(', ')}${zonder.length>5?'…':''}.\n\nToch boeken zonder temperatuur?`)) return false;
  return true;
}
function haccpRegistreer(rows, leveringId, leverancier){
  if(!state.ontvangsten) state.ontvangsten = [];
  const nu = nowStr();
  rows.forEach(r=>{ const p = state.products.find(x=>x.id===r.matchedId); if(!p) return; const n = haccpNorm(p);
    state.ontvangsten.push({id:'OV-'+Date.now().toString(36)+'-'+state.ontvangsten.length, datum:nu, leveringId, productId:p.id, naam:p.naam, eenheid:p.eenheid,
      leverancier:p.leverancier||leverancier||'', qty:r.qty, tht:r.tht||'', lot:r.lot||'', temp:r.temp!=null?r.temp:null, norm:n,
      teWarm: n!=null && r.temp!=null && r.temp>n, open: !!r.tht, door: currentUser().naam}); });
}
function dagenTot(iso){ const d = new Date(iso+'T00:00:00'); const v = new Date(); v.setHours(0,0,0,0); return Math.round((d-v)/864e5); }
function thtLabel(iso){ const n = dagenTot(iso); return n<0 ? `<span class="tag crit">vervallen (${-n} d)</span>` : n===0 ? '<span class="tag crit">vervalt vandaag</span>' : n===1 ? '<span class="tag low">nog 1 dag</span>' : `<span class="tag low">nog ${n} dagen</span>`; }
function bijnaVervallen(){
  return (state.ontvangsten||[]).filter(o=>o.open && o.tht && dagenTot(o.tht)<=THT_WAARSCHUW_DAGEN)
    .filter(o=>{ const p = state.products.find(x=>x.id===o.productId); return p && p.voorraad>0; })
    .sort((a,b)=>a.tht.localeCompare(b.tht));
}

  const l = bijnaVervallen(); if(!l.length) return '';
  return `<div class="panel" style="border-color:var(--rust);">

    ${l.map(o=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:9px 0;gap:8px;">
      <span><strong>${esc(o.naam)}</strong> ${thtLabel(o.tht)}<br><span class="note" style="margin:0;">THT ${new Date(o.tht+'T12:00:00').toLocaleDateString('nl-BE')}${o.lot?' · lot '+esc(o.lot):''} · geleverd ${esc(o.datum.split(' ')[0])}</span></span>
      <span class="row" style="gap:6px;"><button class="btn ghost small" onclick="thtSluit('${o.id}',false)">Opgebruikt</button><button class="btn secondary small" onclick="thtSluit('${o.id}',true)">Weggegooid</button></span></div>`).join('')}
  </div>`;

function thtSluit(id, weg){
  const o = (state.ontvangsten||[]).find(x=>x.id===id); if(!o) return;
  const p = state.products.find(x=>x.id===o.productId);
  if(weg && p){
    const voorstel = Math.min(o.qty, Math.max(0,p.voorraad));
    const inv = prompt(`Hoeveel ${p.eenheid} ${p.naam} werd weggegooid? Dit gaat uit de voorraad.`, String(voorstel).replace('.',','));
    if(inv===null) return;
    const n = Math.max(0, parseFloat(String(inv).replace(',','.'))||0);
    const echt = Math.min(n, Math.max(0,p.voorraad));
    p.voorraad = Math.round((p.voorraad-echt)*100)/100;
    boekMut(p.id, -echt, 'verspilling');
    if(!state.verspilling) state.verspilling = [];
    state.verspilling.push({datum:nowStr(), productId:p.id, naam:p.naam, eenheid:p.eenheid, qty:echt, waarde:Math.round(echt*(p.prijs||0)*100)/100, reden:'THT vervallen', lot:o.lot||''});
    state.activity.push({tijd:nowStr(), tekst:`Weggegooid (THT vervallen): ${fmt(echt)} ${p.eenheid} ${p.naam}${o.lot?' (lot '+o.lot+')':''}.`});
    o.weg = echt;
  }
  o.open = false; o.gesloten = nowStr();
  save(); renderMain();
}

    ${l.length ? `<div class="table-wrap"><table class="bk-tabel"><thead><tr><th>Ontvangen</th><th>Product</th><th>Leverancier</th><th class="num-cell">Aantal</th><th>Lot</th><th>THT</th><th class="num-cell">Temp.</th></tr></thead><tbody>

      </tbody></table></div>` : '<div class="empty">Nog geen ontvangsten in deze periode. Vul bij Levering verwerken de THT, het lotnummer en de temperatuur in.</div>'}
  </div>
  ${weg.length ? `<div class="panel"><h2>Weggegooid</h2>

const BH_ROLLEN = [['leerkracht','Keuken / Chef'],['bakker','Bakkerij / Bakker'],['zaal','Zaal / maître'],['magazijn','Magazijnbeheerder'],['keldermeester','Keldermeester'],['boekhouding','TA Horeca'],['ta-bakkerij','TA Bakkerij'],['beheerder','Systeembeheerder']];
function isBeheerder(u){ return !!u && u.rol==='beheerder'; }
function opServer(){ return !!window.COLOMARKT_SERVER; }
function rolSleutel(u){ return u.rol==='leerkracht' && u.afdeling==='bakkerij' ? 'bakker' : u.rol==='boekhouding' && u.afdeling==='bakkerij' ? 'ta-bakkerij' : u.rol; }
function zetRol(u, sleutel){
  const bak = sleutel==='bakker' || sleutel==='ta-bakkerij';

}
// Rollen waarvan er altijd minstens één moet blijven.
const BH_VERPLICHT = ['beheerder','magazijn','boekhouding','keldermeester'];
function laatsteVanRol(u){ return BH_VERPLICHT.includes(u.rol) && state.users.filter(x=>x.rol===u.rol).length<=1; }

window._bh = window._bh || {aangemeld:null, info:null, toestellen:null, backups:null, log:null, bezig:{}, fout:''};
async function bhApi(pad, body){
  const opt = body===undefined ? {cache:'no-store', credentials:'same-origin'} : {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)};
  const r = await fetch('/api/beheer/'+pad, opt);
  const j = await r.json().catch(()=>({}));
  if(r.status===401 && j.code==='beheer'){ window._bh.aangemeld = false; renderMain(); throw new Error(j.fout||'Meld je opnieuw aan.'); }
  if(!r.ok) throw new Error(j.fout || ('Fout '+r.status));
  return j;
}
function bhLaad(sleutel, pad, veld){
  const bh = window._bh;
  if(!opServer() || bh.aangemeld===false || bh.bezig[sleutel] || bh.fout) return; // na een fout pas opnieuw via "Opnieuw proberen"
  bh.bezig[sleutel] = true;
  bhApi(pad).then(j=>{ bh[sleutel] = veld ? j[veld] : j; bh.aangemeld = true; })
    .catch(e=>{ if(bh.aangemeld!==false) bh.fout = e.message; })
    .then(()=>{ bh.bezig[sleutel] = false; if(isBeheerder(currentUser())) renderMain(); });
}
function bhVernieuw(){ const bh = window._bh; bh.info = bh.toestellen = bh.backups = bh.log = null; bh.fout=''; renderMain(); }
function bhDatum(iso){ if(!iso) return '—'; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('nl-BE')+' '+d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}); }
function bhGrootte(n){ return n>=1048576 ? fmt(n/1048576)+' MB' : Math.max(1,Math.round(n/1024))+' kB'; }
function bhToestelNaam(ua){
  ua = ua||'';
  const os = /iPhone/.test(ua)?'iPhone':/iPad/.test(ua)?'iPad':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':/Mac OS X|Macintosh/.test(ua)?'Mac':/CrOS/.test(ua)?'Chromebook':/Linux/.test(ua)?'Linux':'Onbekend';
  const br = /Edg\//.test(ua)?'Edge':/Firefox\//.test(ua)?'Firefox':/Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':'';
  return os + (br?' · '+br:'');
}

async function bhHeraanmelden(){

function bhGebruikerDialoog(uid){
  const u = uid ? state.users.find(x=>x.id===uid) : null;
  const huidig = u ? rolSleutel(u) : 'leerkracht';
  const zelf = u && u.id===state.currentUser;
  document.getElementById('toastBody').innerHTML = `
    <h2 style="font-size:16px;margin-bottom:12px;">${u?'Gebruiker wijzigen':'Nieuwe gebruiker'}</h2>
    <div class="grid" style="gap:8px;">
      <label style="font-size:13px;">Naam<input id="bhNaam" value="${u?esc(u.naam):''}" placeholder="bv. Chef patisserie B" style="width:100%;"></label>
      <label style="font-size:13px;">Rol<select id="bhRol" style="width:100%;" ${zelf?'disabled':''}>${BH_ROLLEN.map(([k,l])=>`<option value="${k}" ${k===huidig?'selected':''}>${l}</option>`).join('')}</select></label>
      ${zelf?'<p class="note" style="margin:0;">Je eigen rol kan je niet wijzigen.</p>':''}
    </div>
    <div style="text-align:right;margin-top:14px;">
      <button class="btn ghost" onclick="document.getElementById('toastDialog').close()">Annuleer</button>
      <button class="btn" onclick="bhGebruikerBewaar(${u?`'${u.id}'`:'null'})">${u?'Bewaren':'Toevoegen'}</button>
    </div>`;
  document.getElementById('toastDialog').showModal();
  setTimeout(()=>{ const n = document.getElementById('bhNaam'); if(n) n.focus(); }, 30);
}
function bhGebruikerBewaar(uid){
  if(!isBeheerder(currentUser())) return;
  const naam = document.getElementById('bhNaam').value.trim();
  const sleutel = document.getElementById('bhRol').value;
  if(!naam){ toast('Geef een naam in.'); return; }
  if(state.users.some(x=>x.id!==uid && x.naam.toLowerCase()===naam.toLowerCase())){ toast('Er is al een gebruiker met die naam.'); return; }
  if(!uid){
    const u = {id:'usr'+Date.now(), naam}; zetRol(u, sleutel);
    state.users.push(u);
    state.activity.push({tijd:nowStr(), tekst:`Nieuwe gebruiker toegevoegd door ${currentUser().naam}: ${naam} (${rolLabel(u)}).`});
  } else {
    const u = state.users.find(x=>x.id===uid); if(!u) return;
    const oudeNaam = u.naam, oudeRol = rolLabel(u);
    if(u.id!==state.currentUser && sleutel!==rolSleutel(u)){
      const rolNa = {rol: sleutel==='bakker' ? 'leerkracht' : sleutel==='ta-bakkerij' ? 'boekhouding' : sleutel};
      if(rolNa.rol!==u.rol && laatsteVanRol(u)){ toast(`${u.naam} is de enige ${rolLabel(u)}. Maak eerst iemand anders aan met die rol.`); return; }
      zetRol(u, sleutel);
      // Een beheerder op de server gebruikt geen pincode.
      if(isBeheerder(u) && opServer()) delete u.pinHash;
    }
    u.naam = naam;
    const wat = [oudeNaam!==naam ? `naam "${oudeNaam}" → "${naam}"` : '', oudeRol!==rolLabel(u) ? `rol ${oudeRol} → ${rolLabel(u)}` : ''].filter(Boolean).join(', ');
    if(wat) state.activity.push({tijd:nowStr(), tekst:`Gebruiker gewijzigd door ${currentUser().naam}: ${wat}.`});
  }
  save();
  document.getElementById('toastDialog').close();
  renderShell();
}

  return `<div class="lg-pin" style="max-width:340px;">
    <h2 style="font-size:19px;">${esc(u.naam)}</h2>
    <p class="note" style="margin:2px 0 12px;">Geef het beheerwachtwoord van de server in.</p>
    <input id="bhLoginPw" type="password" autocomplete="current-password" style="width:100%;font-size:17px;padding:10px;" onkeydown="if(event.key==='Enter')bhLogin()">
    <div class="row" style="gap:8px;margin-top:12px;justify-content:space-between;">
      <button class="btn ghost" onclick="kiesGebruiker(null)">Terug</button>
      <button class="btn" onclick="bhLogin()">Aanmelden</button>
    </div>
    <div class="lg-fout">${esc(_lg.fout)}</div>
  </div>`;
}
async function bhLogin(){
  const pw = (document.getElementById('bhLoginPw')||{}).value||'';
  if(!pw) return;
  try{
    await bhApi('aanmelden', {wachtwoord:pw});
    window._bh = {aangemeld:true, info:null, toestellen:null, backups:null, log:null, bezig:{}, fout:''};
    aanmelden(_lg.uid);
  }catch(e){ _lg.fout = e.message; renderLogin(); setTimeout(()=>{ const n=document.getElementById('bhLoginPw'); if(n) n.focus(); }, 20); }
}

function viewHistoriek(){
  const all = state.activity.slice().reverse();
  return `<div class="panel"><h2>Volledige activiteitenhistoriek</h2>
  <div class="table-wrap">
  <table><tbody>
  ${all.map(a=>`<tr><td style="white-space:nowrap;color:var(--ink-soft);font-size:13px;">${a.tijd}</td><td style="font-size:13.5px;">${esc(a.tekst)}</td></tr>`).join('') || '<tr><td class="empty">Nog geen activiteit geregistreerd.</td></tr>'}
  </tbody></table>
  </div>
  </div>`;
}
