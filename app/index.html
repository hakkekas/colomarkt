:root{
  --bg:#F5F3EC;
  --panel:#FFFFFF;
  --ink:#232722;
  --ink-soft:#5B6459;
  --line:#DDD8C9;
  --sage:#3F6A4C;
  --sage-deep:#2C4A36;
  --sage-tint:#E4EDE3;
  --rust:#A8491F;
  --rust-tint:#F5E2D3;
  --brick:#9A2F2F;
  --brick-tint:#F5DEDE;
  --slate:#41586A;
  --slate-tint:#E3E9EE;
  /* Coloma-huisstijl */
  --brand:#E5456B; --brand-ink:#C42A55; --brand-deep:#B01E4B; --brand-hover:#9A1A42; --brand-tint:#FCE6EC; --brand-zacht:#FBD3DE; --brand-link:#B01E4B;
  --c-blauw:#6BA6CC; --c-geel:#F7D23E; --c-paars:#7B3F93; --c-lime:#A8B83F; --c-oranje:#F07F22;
  --radius:10px;
  --shadow:0 1px 2px rgba(35,39,34,0.06), 0 4px 14px rgba(35,39,34,0.05);
  /* Grafiekkleuren: vaste volgorde, licht en donker apart gekozen en gecontroleerd op kleurenblindheid. */
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300; --series-overig:#a3a199; --st-good:#0ca30c; --st-warn:#fab219; --st-crit:#d03b3b; --st-crit-ink:#9A2F2F; --st-good-ink:#2C4A36; --btn2-ink:#B01E4B; --btn2-line:#C42A55; --tag-pending-ink:#41586A; --tag-low-ink:#A8491F;
}

    --sage-tint:#26362A; --rust-tint:#3A2A1D; --brick-tint:#3A2323; --slate-tint:#232C34; --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#008300; --series-overig:#6b6f66; --st-crit-ink:#ef8a8a; --st-good-ink:#8fcf9a; --btn2-ink:#F7A3B8; --btn2-line:#C9506F; --tag-pending-ink:#A9BCCB; --tag-low-ink:#E89A6E;

  --sage-tint:#26362A; --rust-tint:#3A2A1D; --brick-tint:#3A2323; --slate-tint:#232C34; --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#008300; --series-overig:#6b6f66; --st-crit-ink:#ef8a8a; --st-good-ink:#8fcf9a; --btn2-ink:#F7A3B8; --btn2-line:#C9506F; --tag-pending-ink:#A9BCCB; --tag-low-ink:#E89A6E;

*{box-sizing:border-box;}
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif; font-size:15px; line-height:1.5;
  min-height:100vh;
}
h1,h2,h3{font-family:'Nunito',sans-serif; font-weight:600; margin:0 0 4px 0; color:var(--ink); overflow-wrap:anywhere;}
.app{max-width:1180px; margin:0 auto; padding:0 0 60px 0;}
header.top{
  position:relative; background:var(--panel); color:var(--ink); padding:26px 20px 16px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
header.top .brand{display:flex; align-items:center; gap:12px;}
header.top .brand h1{color:var(--brand); font-size:26px; font-weight:800; letter-spacing:-.01em; line-height:1.1; margin:0;}
header.top .brand span.sub{display:block; font-size:12.5px; color:var(--ink-soft); letter-spacing:.01em;}
header.top .drie-top{position:absolute; left:0; top:0; width:100%; height:14px;}
main a, .lg-body a, #toastDialog a{color:var(--brand-link);}
@media (max-width:600px){ header.top .sub-lang{display:none;} header.top .brand h1{font-size:23px;} }
.merk{flex:none; width:44px; height:44px; border-radius:10px; overflow:hidden; background:#fff; box-shadow:0 0 0 1px var(--line);}
.merk svg{display:block; width:100%; height:100%;}
.drie{display:block;}
.who{display:flex; align-items:center; gap:10px; font-size:13.5px;}
.who .wie{color:var(--ink); font-weight:600;}
.who .uit{background:var(--panel); color:var(--brand-link); border:1px solid var(--brand-link); border-radius:7px; padding:7px 12px; font-family:inherit; font-size:13.5px; cursor:pointer;}
.who .uit:hover{background:var(--brand-tint);}
#login{position:fixed; inset:0; z-index:50; background:var(--bg, #F5F3EC); overflow:auto;}
#login .lg-kop{background:var(--panel); color:var(--ink); text-align:center; border-bottom:1px solid var(--line);}
#login .lg-kop .drie-top{width:100%; height:64px;}
#login .lg-kop .drie-bot{width:100%; height:34px;}
#login .lg-kop .lg-tekst{padding:14px 20px 18px;}
#login .lg-kop h1{color:var(--brand); font-size:34px; font-weight:800; letter-spacing:-.01em;}
#login .lg-kop p{margin:4px 0 0; color:var(--ink-soft); font-size:14px;}
#login .lg-body{max-width:720px; margin:0 auto; padding:20px 16px 40px;}
#login .lg-groep{font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 8px;}
#login .lg-namen{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px;}
#login .lg-naam{background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:left; font:inherit; font-size:15px; cursor:pointer; min-height:52px;}
#login .lg-naam:hover{border-color:var(--brand-ink); box-shadow:0 0 0 3px var(--brand-tint);}
#login .lg-pin{max-width:320px; margin:10px auto 0; text-align:center;}
#login .lg-dots{display:flex; justify-content:center; gap:14px; margin:18px 0;}
#login .lg-dots span{width:16px; height:16px; border-radius:50%; border:2px solid var(--brand-ink);}
#login .lg-dots span.vol{background:var(--brand-ink);}
#login .lg-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
#login .lg-pad button{height:64px; font-size:24px; font-family:inherit; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;}
#login .lg-pad button:active{background:var(--brand-tint);}
#login .lg-fout{color:var(--brick); min-height:20px; font-size:14px; margin-top:10px;}
.who select{
  background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:7px;
  padding:7px 10px; font-family:inherit; font-size:13.5px;
}
nav.tabs{
  padding:10px 20px 0; background:var(--brand-deep);
}
.flat-row{display:flex; gap:4px; overflow-x:auto;}
.flat-row button, nav.tabs button{
  background:none; border:none; color:var(--brand-zacht); padding:10px 14px; font-family:inherit;
  font-size:14px; cursor:pointer; border-radius:8px 8px 0 0; white-space:nowrap;
}
.flat-row button.active{background:var(--bg); color:var(--ink); font-weight:600;}
.cat-row{display:flex; gap:2px; padding-bottom:8px; overflow-x:auto;}
.cat-btn{
  display:flex; align-items:center; gap:7px; background:none; border:none;
  color:var(--brand-zacht); padding:9px 13px; font-family:inherit; font-size:13.5px;
  cursor:pointer; border-radius:8px; white-space:nowrap;
}
.cat-btn svg{width:16px; height:16px; flex-shrink:0;}
.cat-btn.active{background:rgba(255,255,255,.12); color:#fff; font-weight:600;}
.sub-row{display:flex; gap:4px; padding:2px 0 0; overflow-x:auto; border-top:1px solid rgba(255,255,255,.12); padding-top:6px;}
.sub-row button{
  background:none; border:none; color:var(--brand-zacht); padding:8px 12px; font-family:inherit;
  font-size:13px; cursor:pointer; border-radius:7px 7px 0 0; white-space:nowrap;
}
.tab-zoek{margin-left:auto; flex-shrink:0; display:flex; align-items:center;}
.tab-zoek input{width:150px; padding:6px 10px; font-size:13px; border-radius:7px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff;}
.tab-zoek input::placeholder{color:rgba(255,255,255,.6);}
@media (max-width:700px){ .tab-zoek{display:none;} }
.ai-blok{background:var(--brand-tint); border-radius:12px; padding:12px 14px; margin:4px 0 16px;}
.ai-blok textarea{background:var(--panel);}
.sub-row button.active{background:var(--bg); color:var(--ink); font-weight:600;}
main{padding:22px 20px;}
.grid{display:grid; gap:14px;}
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.card .num{font-family:'Nunito',sans-serif; font-size:30px; font-weight:600; line-height:1;}
.card .lbl{color:var(--ink-soft); font-size:12.5px; margin-top:6px;}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:16px;}
.panel h2{font-size:18px; margin-bottom:12px;}
table{width:100%; border-collapse:collapse; font-size:14px;}
th{
  text-align:left; font-weight:600; color:var(--ink-soft); font-size:12.5px;
  padding:8px 10px; border-bottom:1px solid var(--line);
}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.num-cell{font-variant-numeric:tabular-nums; text-align:right;}
.table-wrap{overflow-x:auto;}
.tag{display:inline-block; padding:3px 9px; border-radius:99px; font-size:12px; font-weight:600;}
.tag.ok{background:var(--sage-tint); color:var(--st-good-ink);}
.tag.low{background:var(--rust-tint); color:var(--tag-low-ink);}
.ster{background:none; border:0; cursor:pointer; font-size:18px; line-height:1; padding:4px; color:var(--line); flex:none;}
.ster.aan{color:#d9a400;}
.ster:hover{color:#d9a400;}
.bp-snel{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
.bp-snel .lijst{display:inline-flex; align-items:center; gap:2px;}
.bp-snel .lijst .bp-x{margin-left:-2px;}
.fasen{display:flex; gap:0; margin:10px 0 4px; list-style:none; padding:0;}
.fasen li{flex:1; position:relative; text-align:center; font-size:12px; color:var(--ink-soft); padding-top:22px;}
.fasen li::before{content:''; position:absolute; top:5px; left:50%; transform:translateX(-50%); width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid var(--line); z-index:1;}
.fasen li::after{content:''; position:absolute; top:11px; left:-50%; width:100%; height:2px; background:var(--line);}
.fasen li:first-child::after{display:none;}
.fasen li.klaar{color:var(--sage-deep);}
.fasen li.klaar::before{background:var(--sage); border-color:var(--sage);}
.fasen li.klaar::after{background:var(--sage);}
.fasen li.nu{color:var(--ink); font-weight:700;}
.fasen li.nu::before{border-color:var(--sage); box-shadow:0 0 0 3px var(--sage-tint);}
.fasen li small{display:block; font-weight:400; font-size:11px; color:var(--ink-soft);}
.tag.crit{background:var(--brick-tint); color:var(--st-crit-ink);}
.tag.none{background:transparent; color:var(--ink-soft); border:1px dashed var(--line);}
.tag.pending{background:var(--slate-tint); color:var(--tag-pending-ink);}
input,select,textarea{
  font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line);
  border-radius:7px; background:var(--panel); color:var(--ink); width:100%;
}
input[type=number]{text-align:right;}
button.btn, label.btn{
  display:inline-block;   font-family:inherit; font-size:13.5px; font-weight:600; padding:8px 14px; border-radius:7px;
  border:1px solid var(--brand-ink); background:var(--brand-ink); color:#fff; cursor:pointer;
}
button.btn:not(.secondary):not(.ghost):not(:disabled):hover{background:var(--brand-hover); border-color:var(--brand-hover);}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand-ink); outline-offset:1px;}
button.btn.secondary, label.btn.secondary{background:var(--panel); color:var(--btn2-ink); border-color:var(--btn2-line);}
button.btn.ghost{background:none; border:1px solid var(--line); color:var(--ink-soft);}
button.btn.small, label.btn.small{padding:5px 10px; font-size:12.5px;}
button.btn:disabled{opacity:.45; cursor:not-allowed;}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.searchbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.searchbar input{flex:1; min-width:180px;}
.searchbar select{width:auto; min-width:150px;}
.qtybox{display:flex; align-items:center; gap:6px;}
.qtybox input{width:64px; text-align:center;}
.qtybox button{
  width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:var(--panel);
  cursor:pointer; font-size:15px; line-height:1; color:var(--ink);
}
.empty{color:var(--ink-soft); font-size:14px; padding:20px; text-align:center;}
.ht-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px;}
.ht-card{display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:var(--radius); padding:12px; background:var(--panel); min-width:0;}
.ht-card .ht-info{min-width:0; flex:1; display:flex; flex-direction:column; gap:3px;}
.ht-card .ht-naam{font-weight:600; font-size:14px; line-height:1.3;}
.ht-card .ht-meta{font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
.ht-foto{flex:none; border-radius:6px; background:#fff; border:1px solid var(--line); object-fit:contain; display:block;}
.ht-foto.leeg{background:var(--sage-tint);}
.pf{flex:none; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--sage-tint); border:1px solid var(--line); overflow:hidden; line-height:1;}
.pf img{width:100%; height:100%; object-fit:cover; display:block;}
button.pf{padding:0; cursor:pointer; position:relative;}
button.pf:hover{outline:2px solid var(--sage);}
button.pf .pf-plus{position:absolute; right:1px; bottom:1px; font-size:10px; background:#fff; border-radius:50%; width:14px; height:14px; display:flex; align-items:center; justify-content:center; color:var(--sage-deep); font-weight:700;}
.ht-prijs{font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; color:var(--sage-deep);}
.ht-pager{display:flex; gap:8px; align-items:center; justify-content:center; margin-top:14px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-soft);}
.cart-fab{
  position:sticky; bottom:14px; margin-top:10px; background:var(--brand-deep); color:#fff;
  border-radius:var(--radius); padding:12px 16px; display:flex; justify-content:space-between;
  align-items:center; box-shadow:var(--shadow); font-size:14px;
}
.cart-fab button{background:#fff; color:var(--brand-deep); border:none; border-radius:7px; padding:8px 14px; font-weight:700; cursor:pointer; font-family:inherit;}
.section-title{font-size:12.5px; text-transform:none; color:var(--ink-soft); margin:18px 0 8px; font-weight:600;}
.note{font-size:13px; color:var(--ink-soft); margin-top:8px;}
.split{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:720px){.split{grid-template-columns:1fr;}}
/* Bestellen voor chefs: categorieknoppen, lijst per categorie en een mandje opzij */
.bp-top{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px;}
.bp-top label{display:grid; gap:4px; font-size:12.5px; color:var(--ink-soft); font-weight:600;}
.bp-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
/* Boekhouding: grafieken */
.bk-filter{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px;}
.bk-filter label{display:flex; gap:6px; align-items:center; font-size:13px; color:var(--ink-soft);}
.bk-filter select, .bk-filter input{width:auto;}
.bk-filter .btn{margin-left:auto;}
.bk-check input{width:auto;}
.bk-demo{background:var(--slate-tint); border:1px dashed var(--slate); color:var(--ink); border-radius:8px; padding:8px 12px; font-size:13px; margin-bottom:14px;}
.bk-alarm{background:var(--rust-tint); border:1px solid var(--rust); border-radius:8px; padding:10px 14px; font-size:13.5px; margin-bottom:14px; line-height:1.7;}
.bk-kop{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.bk-kop h2{margin:0;}
.bk-leeg{color:var(--ink-soft); font-size:13.5px; padding:28px 8px; text-align:center; border:1px dashed var(--line); border-radius:8px;}
.bk-kolom{width:100%; height:auto; display:block; overflow:visible;}
.bk-grid{stroke:var(--line); stroke-width:1;}
.bk-basis{stroke:var(--ink-soft); stroke-width:1;}
.bk-as{fill:var(--ink-soft); font-size:11px; font-family:inherit;}
.bk-donut{display:flex; gap:18px; align-items:center; flex-wrap:wrap;}
.bk-donut svg{width:180px; max-width:100%; flex-shrink:0;}
.bk-donut-tot{fill:var(--ink); font-family:'Nunito',sans-serif; font-size:19px; font-weight:600;}
.bk-donut-sub{fill:var(--ink-soft); font-size:11px;}
.bk-legende{list-style:none; margin:0; padding:0; flex:1 1 200px; min-width:0; font-size:13px;}
.bk-legende li{display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid var(--line);}
.bk-legende li:last-child{border-bottom:none;}
.bk-sw{width:10px; height:10px; border-radius:3px; flex-shrink:0;}
.bk-ll{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink);}
.bk-lv{font-variant-numeric:tabular-nums; color:var(--ink);}
.bk-lp{font-variant-numeric:tabular-nums; color:var(--ink-soft); width:46px; text-align:right;}
.bk-balken{display:flex; flex-direction:column; gap:8px;}
.bk-balk{display:grid; grid-template-columns:minmax(110px,38%) 1fr auto; gap:10px; align-items:center; font-size:13px;}
.bk-bl{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink);}
.bk-bl small{display:block; color:var(--ink-soft); font-size:11.5px;}
.bk-bt{height:12px; background:var(--bg); border-radius:4px; overflow:hidden;}
.bk-bt span{display:block; height:100%; border-radius:0 4px 4px 0;}
.bk-bv{font-variant-numeric:tabular-nums; color:var(--ink); min-width:76px; text-align:right;}
.bk-meters{display:flex; flex-direction:column; gap:14px;}
.bk-mk{display:flex; justify-content:space-between; gap:8px; font-size:13.5px; margin-bottom:5px; flex-wrap:wrap;}
.bk-mt{position:relative; height:12px; background:var(--bg); border-radius:4px;}
.bk-mt span{display:block; height:100%; border-radius:4px;}
.bk-mt i{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink-soft); opacity:.6;}
.bk-mv{font-size:12px; color:var(--ink-soft); margin-top:4px; font-variant-numeric:tabular-nums;}
.bk-status{display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:99px; white-space:nowrap;}
.bk-st-ok{background:var(--sage-tint); color:var(--st-good-ink);}
.bk-st-warn{background:var(--rust-tint); color:var(--rust);}
.bk-st-crit{background:var(--brick-tint); color:var(--st-crit-ink);}
.bk-st-geen{background:var(--bg); color:var(--ink-soft);}
.bk-fact{border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--panel);}
.bk-fact summary{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 12px; cursor:pointer; font-size:13.5px;}
.bk-fact[open] summary{border-bottom:1px solid var(--line);}
.bk-fact .table-wrap{padding:0 8px 8px;}
.bk-afw td{background:var(--rust-tint);}
.bk-tabel td, .bk-tabel th{white-space:nowrap;}
.bk-export{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.bk-export:last-child{border-bottom:none;}
[data-tip]{outline:none;}
[data-tip]:focus-visible{outline:2px solid var(--ink); outline-offset:1px;}
#bkTip{position:fixed; z-index:50; pointer-events:none; background:var(--ink); color:var(--panel); font-size:12.5px; padding:6px 9px; border-radius:6px; max-width:260px; box-shadow:var(--shadow);}
@media (max-width:560px){ .cards .card .num{font-size:22px; white-space:nowrap;} .bk-balk{grid-template-columns:1fr auto;} .bk-bt{grid-column:1 / -1; order:3;} .bk-filter .btn{margin-left:0;} }
.tel-cat{font-size:15px; margin:14px 0 4px;}
.tel-rij{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 6px; border-bottom:1px solid var(--line); border-radius:6px;}
.tel-rij.tel-ok{background:var(--sage-tint);}
.tel-naam{flex:1; min-width:0;}
.tel-naam small{display:block; color:var(--ink-soft); font-size:12px;}
.tel-in{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.tel-in input{width:84px; text-align:center; font-size:16px;}
.tel-in .btn{min-width:40px; padding:6px 0; font-size:18px; line-height:1;}
.tel-voortgang{height:8px; background:var(--bg); border-radius:4px; overflow:hidden;}
.tel-voortgang span{display:block; height:100%; background:var(--brand); border-radius:4px;}
.chip{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:99px; padding:6px 12px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;}
.chip.active{background:var(--brand-deep); border-color:var(--brand-deep); color:#fff;}
.as-rij{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.as-rij:last-child{border-bottom:none;}
.as-naam{flex:1 1 220px; min-width:0; display:flex; align-items:center; gap:8px;}
.as-naam small{display:block; color:var(--ink-soft); font-size:12px;}
.as-mm{display:flex; gap:6px; align-items:center; font-size:12.5px; color:var(--ink-soft);}
.as-mm input{width:64px; display:inline-block;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex-shrink:0;}
.seg button{border:none; background:var(--panel); color:var(--ink); font:inherit; font-size:12.5px; font-weight:600; padding:6px 10px; cursor:pointer;}
.seg button + button{border-left:1px solid var(--line);}
.seg button.on.v{background:var(--sage-deep); color:#fff;}
.seg button.on.b{background:var(--rust); color:#fff;}
.seg button.on.u{background:var(--ink-soft); color:var(--panel);}
.as-kop{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin:6px 0 2px;}
.as-kop h3{margin:0; font-size:15px;}
.as-kop .seg button{font-weight:500;}
.chip .n{opacity:.65; font-weight:500; margin-left:6px; font-variant-numeric:tabular-nums;}
.bp-grid{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start;}
.bp-lijst{padding:4px 16px;}
.bp-groep{font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; padding:16px 0 4px;}
.bp-row{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line);}
.bp-groep + .bp-row{border-top:none;}
.bp-row.gekozen .bp-titel{color:var(--sage-deep);}
.bp-naam{display:flex; gap:10px; align-items:center; min-width:0;}
.bp-titel{font-weight:600; line-height:1.3;}
.bp-meta{font-size:12.5px; color:var(--ink-soft);}
.bp-mand{position:sticky; top:12px;}
.bp-mand-regels{display:flex; flex-direction:column; gap:6px; max-height:45vh; overflow:auto; margin:12px 0;}
.bp-mand-regel{display:flex; justify-content:space-between; gap:8px; font-size:13.5px; align-items:center; border-bottom:1px dotted var(--line); padding-bottom:4px;}
.bp-x{border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:0 2px;}
.bp-fab{display:none;}
@media (max-width:860px){ .bp-grid{grid-template-columns:1fr;} .bp-mand{position:static;} .bp-fab{display:flex;} }
@media (max-width:560px){ .bp-row{grid-template-columns:minmax(0,1fr) auto;} .bp-status{grid-column:1; grid-row:2;} .bp-row .qtybox{grid-column:2; grid-row:1 / span 2;} }
/* Gsm: producttabellen met aantalknoppen als kaartjes, zodat + en − altijd in beeld staan */
@media (max-width:640px){
  table.bestel-tabel thead{display:none;}
  table.bestel-tabel, table.bestel-tabel tbody{display:block;}
  table.bestel-tabel tr{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:10px 2px; border-bottom:1px solid var(--line);}
  table.bestel-tabel tr:last-child{border-bottom:none;}
  table.bestel-tabel td{display:block; border:none; padding:0; grid-column:1; min-width:0;}
  table.bestel-tabel td.col-cat{display:none;}
  table.bestel-tabel td.col-voorraad{text-align:left; font-size:12.5px; color:var(--ink-soft);}
  table.bestel-tabel td.col-voorraad::before{content:"Voorraad: ";}
  table.bestel-tabel td.col-qty{grid-column:2; grid-row:1 / span 3; width:auto !important;}
  table.bestel-tabel td.empty{grid-column:1 / -1;}
  .qtybox button{width:36px; height:36px; font-size:18px;}
  .qtybox input{width:56px;}
}
.badge-count{background:var(--rust); color:#fff; border-radius:99px; font-size:11px; padding:1px 7px; margin-left:6px;}
dialog{border:none; border-radius:var(--radius); padding:0; max-width:420px; width:92%; box-shadow:0 12px 40px rgba(0,0,0,.25);}
dialog::backdrop{background:rgba(20,24,18,.45);}
dialog .dbody{padding:18px;}
#printArea{display:none;}
@media (pointer:coarse){
  .seg button{min-height:40px; padding:8px 12px;}
  .btn{min-height:44px;}

/* Apple-stijl (Stefan 2026-10-09): systeemlettertype van iPhone/Mac, grijze achtergrond met witte kaarten,
   doorschijnende menubalk, segmentknoppen. Coloma-roze blijft de accentkleur. Alles hieronder overschrijft
   de basisstijl; dit blok weghalen zet de vorige vormgeving terug. */
:root{
  --bg:#F2F2F7; --panel:#FFFFFF; --ink:#1C1C1E; --ink-soft:#6C6C70; --line:#E5E5EA;
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.08); --bar:rgba(249,249,251,.82);
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.04);
  --sf:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --sf-d:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000000; --panel:#1C1C1E; --ink:#F2F2F7; --ink-soft:#98989F; --line:#38383A;
    --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16); --bar:rgba(22,22,24,.78); --shadow:none; }
}
:root[data-theme="dark"]{ --bg:#000000; --panel:#1C1C1E; --ink:#F2F2F7; --ink-soft:#98989F; --line:#38383A;
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16); --bar:rgba(22,22,24,.78); --shadow:none; }
body{font-family:var(--sf); font-size:15px; letter-spacing:-.01em; -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--sf-d); font-weight:700; letter-spacing:-.02em;}
.panel h2{font-size:20px;}
#login .lg-kop h1, header.top .brand h1{font-family:var(--sf-d); font-weight:800; letter-spacing:-.03em;}
.merk text{font-family:var(--sf-d) !important;}
/* Kop en menubalk */
header.top{background:var(--bg);}
nav.tabs{position:sticky; top:0; z-index:20; background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);

button.btn.secondary, label.btn.secondary, a.btn.secondary{background:var(--brand-tint); border-color:transparent; color:var(--brand-link);}
button.btn.ghost{background:var(--fill-2); border-color:transparent; color:var(--ink);}
button.btn:active{opacity:.7;}
input, select, textarea{border-radius:10px; border:1px solid var(--line); background:var(--panel);}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--brand-link); box-shadow:0 0 0 3px var(--brand-tint);}
.searchbar input{background:var(--fill); border-color:transparent;}
.chip{border:none; background:var(--fill); color:var(--ink); font-weight:500;}
.chip.active{background:var(--brand-ink); color:#fff;}
.tag{border-radius:7px; font-weight:600;}
.qtybox button{border:none; background:var(--fill); border-radius:50%; color:var(--brand-link); font-weight:600;}
.seg{border:none; background:var(--fill); border-radius:9px; padding:2px;}

.seg button + button{border-left:none;}
.cart-fab{background:var(--bar); color:var(--ink); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);

function catJsonResponse(obj){ return new Response(JSON.stringify(obj), {status:200, headers:{'Content-Type':'application/json'}}); }
function catFetch(path){
  if(CAT_INLINE[path]) return Promise.resolve(catJsonResponse(CAT_INLINE[path]));
  const m = /^catalogus\/foto-(\d+)\.json$/.exec(path);
  if(m){
    const b = CAT_FOTOBUNDEL[m[1]];
    if(!b) return Promise.resolve(catJsonResponse({}));
    const key = 'ht-fotos-'+b;

    return _catBundels[key].then(bundel=>catJsonResponse(bundel[m[1]]||{}));
  }
  return fetch(CAT_ASSETS[path] || path);
}

// Een opmerking uit OrderFlow met minstens 3 regels vóór de ingrediëntopmerkingen is een bereidingswijze.
function ofTeksten(opm){
  opm = opm||'';
  const i = opm.indexOf('Opmerkingen bij ingrediënten');
  const vrij = (i>=0 ? opm.slice(0,i) : opm).trim(), rest = i>=0 ? opm.slice(i).trim() : '';
  const regels = vrij.split('\n').map(x=>x.trim()).filter(Boolean);
  if(regels.length>=3) return {bereidingswijze: regels.join('\n'), notities: rest};
  return {bereidingswijze:'', notities: opm.trim()};
}

// Bij een leverancier bestel je hele verpakkingen (zak, doos, stuk); alleen kg/g/l… mag deelbaar zijn.
function heleVerpakking(aantal, eenheid){ return DEELBARE_EENHEDEN.includes(eenheid) ? rond(aantal, 3) : Math.ceil(aantal - 1e-9); }
function bestelbonRegels(leverancier){
  // Alleen wat nog niet besteld is: zo komt niets twee keer op een bon.
  const low = slimVoorstellen().filter(x=>x.p.leverancier===leverancier && !x.besteld && x.aantal>0);
  const tekorten = state.tekorten.filter(t=>t.leverancier===leverancier && t.status==='open');
  const regels = [];
  // Per chef en product samengeteld, gesorteerd op chef: zo kan de leverancier per chef leveren.
  const perChefProd = {};
  tekorten.forEach(t=>{ const k = t.productId+'|'+t.leerkracht; const r = perChefProd[k];
    if(r){ r.ruw = rond(r.ruw + t.aantal, 3); r.tekortIds.push(t.id); return; }
    const p = state.products.find(x=>x.id===t.productId);
    perChefProd[k] = {art: p ? (p.htArt||p.levArt||'') : '', naam:t.naam, ruw:t.aantal, eenheid:t.eenheid, voor:t.leerkracht||'—', prijs: p?p.prijs:0, productId:t.productId, tekortIds:[t.id]}; });
  Object.values(perChefProd).sort((a,b)=>a.voor.localeCompare(b.voor) || a.naam.localeCompare(b.naam)).forEach(r=>{ r.aantal = heleVerpakking(r.ruw, r.eenheid); delete r.ruw; regels.push(r); });
  low.forEach(({p, aantal})=>{
    regels.push({art: p.htArt||p.levArt||'', naam:p.naam, aantal, eenheid:p.eenheid, voor:'Magazijn (algemene voorraad)', prijs:p.prijs||0, productId:p.id});
  });
  // Zelf gekozen producten (knop "Bestellen bij …"): komen bovenop de voorstellen.
  const vrij = window._vrij;
  if(vrij && vrij.lev===leverancier){
    Object.entries(vrij.qty).forEach(([pid,n])=>{
      const p = state.products.find(x=>x.id===pid);
      if(!p || !(n>0)) return;
      const al = regels.find(r=>r.productId===pid && !r.tekortId && !r.tekortIds);
      if(al){ al.aantal = heleVerpakking(al.aantal + n, p.eenheid); return; }
      regels.push({art: p.htArt||p.levArt||'', naam:p.naam, aantal:heleVerpakking(n, p.eenheid), eenheid:p.eenheid, voor:'Magazijn (zelf gekozen)', prijs:p.prijs||0, productId:p.id});
    });
  }
  return regels;
}

// Zet een bon en alle producten/tekorten erop op "besteld".
function pasBonBesteldToe(bon, bron, info){
  if(!bon || bon.status==='besteld' || bon.status==='ontvangen' || bon.status==='geannuleerd') return false;
  bon.regels.forEach(r=>{
    if(r.tekortId || r.tekortIds){ (r.tekortIds||[r.tekortId]).forEach(id=>{ const t = state.tekorten.find(x=>x.id===id); if(t && t.status==='open') t.status='besteld'; }); }
    else if(r.productId){ const p = state.products.find(x=>x.id===r.productId); if(p && p.besteldStatus!=='besteld') p.besteldStatus='besteld'; }
  });
  bon.status = 'besteld';
  bon.besteldInfo = {bron, ...(info||{})};
  bon.kanalen.push({type:'besteld', tijd: nowStr(), naar: bron});
  state.activity.push({tijd:nowStr(), tekst:`Bestelbon ${bon.id} (${bon.leverancier}) is besteld — ${bron}${info && info.leverdatum ? ', levering '+info.leverdatum : ''}.`});
  return true;
}

let _bonCheckBezig = false;
async function controleerBestelstatus(opts){
  opts = opts || {};
  if(_bonCheckBezig) return;
  const open = state.bestelbonnen.filter(b=>b.status==='aangemaakt');
  if(!open.length && !opts.handmatig) return;
  _bonCheckBezig = true;
  let gevonden = 0;
  try{
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if(db){
      const snap = await db.collection('bonstatus').get();
      snap.docs.forEach(d=>{
        const data = d.data() || {};
        const bon = state.bestelbonnen.find(b=>b.id===d.id);
        if(bon && data.status==='besteld' && pasBonBesteldToe(bon, data.bron||'bestelgeschiedenis', {besteldOp:data.besteldOp, leverdatum:data.leverdatum, totaalExclBtw:data.totaalExclBtw})) gevonden++;
      });
    }
  }catch(e){}
  try{
    const m = bonGmail || (window.claude && window.claude.use ? await window.claude.use('mcp') : null);
    if(m){
      const mailBonnen = state.bestelbonnen.filter(b=>b.status==='aangemaakt' && b.kanalen.some(k=>k.type==='gmail')).slice(-15);
      for(const b of mailBonnen){
        try{
          const r = await m.callTool('Gmail', 'search_threads', {query:`in:sent subject:${b.id}`, pageSize:1});
          const pl = r && r.payload;
          if(pl && pl.threads && pl.threads.length){
            const msg = (pl.threads[0].messages||[])[0] || {};
            if(pasBonBesteldToe(b, 'mail verstuurd', {besteldOp: msg.date ? new Date(msg.date).toLocaleDateString('nl-BE') : ''})) gevonden++;
          }
        }catch(e){}
      }
    }
  }catch(e){}
  if(gevonden) save();
  _bonCheckBezig = false;
  if(opts.handmatig || gevonden) renderMain();
  return gevonden;
}

async function maakBestelbonPdf(leverancier, regels, opts){
  opts = opts || {};
  const JsPDF = await laadPdfLib();
  const doc = new JsPDF({unit:'mm', format:'a4'});
  doc.setFontSize(18); doc.text('Bestelbon' + (opts.nummer ? ' ' + opts.nummer : ''), 14, 18);
  doc.setFontSize(10);
  const meta = [
    `Leverancier: ${leverancier}`,
    `Datum: ${opts.datum || nowStr()}`,
    'Klant: Colomaplus - Huis van de Gastronomie',
    'Leveradres: Tervuursesteenweg 2, 2800 Mechelen - af te leveren bij het economaat',
    'Graag per chef gescheiden of gelabeld leveren (zie kolom Voor).'
  ];
  meta.forEach((m,i)=>doc.text(m, 14, 27+i*5));
  const metArt = regels.some(r=>r.art);
  const totaal = regels.reduce((s,r)=>s+r.aantal*(r.prijs||0),0);
  doc.autoTable({
    startY: 27+meta.length*5+4,
    head: [[...(metArt?['Art.nr']:[]), 'Artikel', 'Aantal', 'Voor', 'Richtprijs']],
    body: regels.map(r=>[...(metArt?[r.art]:[]), r.naam, `${fmt(r.aantal)} ${r.eenheid}`, r.voor, r.prijs?('€ '+(r.aantal*r.prijs).toFixed(2).replace('.',',')):'—']),
    styles: {fontSize:9, cellPadding:2},
    headStyles: {fillColor:[44,74,54]},
    columnStyles: metArt ? {2:{halign:'right'},4:{halign:'right'}} : {1:{halign:'right'},3:{halign:'right'}}
  });
  const y = doc.lastAutoTable.finalY + 7;
  doc.setFontSize(10);
  if(totaal>0) doc.text(`Geschatte waarde volgens richtprijzen: € ${totaal.toFixed(2).replace('.',',')}`, 14, y);
  return doc;
}

const SESSIE_KEY = 'colomarkt_sessie';
function sessieLees(){ try{ return sessionStorage.getItem(SESSIE_KEY); }catch(e){ return window._sessie||null; } }
function sessieZet(uid){ window._sessie = uid; try{ if(uid) sessionStorage.setItem(SESSIE_KEY, uid); else sessionStorage.removeItem(SESSIE_KEY); }catch(e){} }
async function pinHash(uid, pin){
  const data = new TextEncoder().encode('colomarkt:'+uid+':'+pin);
  try{ const h = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let x=0; for(const b of data) x=(x*31+b)>>>0; return 'f'+x.toString(16); }
}

async function pinToets(k){
  if(k==='del'){ _lg.pin = _lg.pin.slice(0,-1); renderLogin(); return; }
  if(_lg.pin.length>=4) return;
  _lg.pin += k; _lg.fout=''; renderLogin();
  if(_lg.pin.length<4) return;
  const u = state.users.find(x=>x.id===_lg.uid);
  if(_lg.stap==='nieuw'){ _lg.eerste=_lg.pin; _lg.pin=''; _lg.stap='herhaal'; renderLogin(); return; }
  if(_lg.stap==='herhaal'){
    if(_lg.pin!==_lg.eerste){ _lg = {..._lg, pin:'', eerste:'', stap:'nieuw', fout:'De twee pincodes waren niet gelijk. Probeer opnieuw.'}; renderLogin(); return; }
    u.pinHash = await pinHash(u.id, _lg.pin); save(); return aanmelden(u.id);
  }
  if(await pinHash(u.id, _lg.pin) === u.pinHash) return aanmelden(u.id);
  _lg.pin=''; _lg.fout='Verkeerde pincode. Vergeten? Vraag het magazijn om ze te wissen.'; renderLogin();
}

function dagFilter(o){
  const f = window._dag || 'alles';
  if(f==='alles') return true;
  const d = new Date(); if(f==='morgen') d.setDate(d.getDate()+1);
  const iso = isoDag(d);
  return o.nodigOp ? o.nodigOp<=iso : f==='vandaag';
}
// Per chef samen klaarzetten en leveren (Stefan 2026-10-04): aanvragen van dezelfde chef voor dezelfde dag
// worden één blok, ingrediënten opgeteld. Een recept of les komt niet op bon of picklijst, alleen de chef.
function perChef(orders){
  const g = {};
  orders.forEach(o=>{ const k = (o.leerkrachtId||o.leerkracht)+'_'+(o.nodigOp||'z'); (g[k] = g[k] || {k, chef:o.leerkracht, nodigOp:o.nodigOp||'', orders:[]}).orders.push(o); });
  return Object.values(g).sort((a,b)=>(a.nodigOp||'9999-12-31').localeCompare(b.nodigOp||'9999-12-31') || a.chef.localeCompare(b.chef));
}
function chefRegels(orders){
  const m = {};
  orders.forEach(o=>picklijstRegels(o).forEach(x=>{ const k = x.naam+'|'+x.eenheid;
    if(!m[k]) m[k] = {...x}; else { m[k].aantal = rond(m[k].aantal+x.aantal,3); m[k].totaal = rond(m[k].totaal+x.totaal,3); m[k].wacht = m[k].wacht || x.wacht; } }));
  // In de volgorde van de looproute, zodat de magazijnier één keer rondgaat.
  const pr = id=>state.products.find(p=>p.id===id);
  return Object.values(m).sort((a,b)=>{ const pa = pr(a.productId), pb = pr(b.productId); return (pa&&pb ? routeIdx(pa)-routeIdx(pb) : 0) || a.naam.localeCompare(b.naam); });
}
function nodigOpTekst(d){ return d ? ' — nodig op '+new Date(d+'T12:00:00').toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'}) : ''; }

function afgeleverdGroep(ids){ ids.split(',').forEach(id=>{ const o = state.orders.find(x=>x.id===id); if(o && !o.afgeleverdOp){ if(!o.klaargezetOp) o.klaargezetOp = nowStr(); o.afgeleverdOp = nowStr(); state.activity.push({tijd:nowStr(), tekst:`Aanvraag van ${o.leerkracht} geleverd aan de chef.`}); } }); save(); renderMain(); }

// Alles staat in de browser van dit toestel. Een back-up bewaart voorraad, bestellingen,
// recepten, gebruikers en historiek in één bestand dat je later kan terugzetten.
function viewBackup(){
  const b = window._backup || {};
  return `<div class="panel">
    <div class="row" style="justify-content:space-between;">
      <h2 style="margin:0;">Back-up</h2>
      <div class="row" style="gap:8px;">
        <button class="btn secondary small" onclick="downloadBackup()">Back-up downloaden</button>
        <label class="btn ghost small" style="cursor:pointer;">Back-up terugzetten
          <input id="backupFile" type="file" accept="application/json,.json" style="display:none;" onchange="leesBackup(this)">
        </label>
      </div>
    </div>
    <p class="note">Alle gegevens staan in de browser van dit toestel. Download geregeld een back-up${state.laatsteBackup?` (laatste: ${state.laatsteBackup})`:''}.</p>
    ${b.data ? `<div class="row" style="margin-top:10px;padding:10px;border-radius:7px;background:var(--rust-tint);">
      <span style="flex:1;min-width:200px;font-size:13.5px;">Back-up van ${b.datum||'onbekende datum'}: ${b.data.products.length} producten, ${(b.data.orders||[]).length} aanvragen, ${(b.data.recipes||[]).length} recepten. Terugzetten vervangt alle huidige gegevens op dit toestel.</span>
      <button class="btn small" onclick="zetBackupTerug()">Vervang alle gegevens</button>
      <button class="btn ghost small" onclick="window._backup=null;renderMain();">Annuleer</button>
    </div>` : ''}
  </div>`;
}
async function downloadBackup(){
  const datum = nowStr();
  const data = JSON.stringify({app:'Colomarkt+', versie:1, gemaakt:datum, state}, null, 1);
  try{
    if(!window.claude || !window.claude.use){ toast('Bestand downloaden is in deze weergave niet beschikbaar.'); return; }
    const downloads = await window.claude.use('downloads');
    if(!downloads){ toast('Bestand downloaden is in deze weergave niet beschikbaar.'); return; }
    const res = await downloads.save({filename:`colomarkt-backup_${fileDateStr()}.json`, data});
    if(res && res.status){
      state.laatsteBackup = datum; state.activity.push({tijd:datum, tekst:'Back-up van alle gegevens gedownload.'}); save();
      toast('Back-up gestart. Bewaar het bestand op een veilige plaats.'); renderMain();
    }
  }catch(e){ toast('Downloaden is niet gelukt of werd geannuleerd.'); }
}
function leesBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = JSON.parse(reader.result);
      const st = d && d.state;
      if(!st || !Array.isArray(st.products) || !Array.isArray(st.users)) throw new Error('geen back-up');
      window._backup = {data:st, datum:d.gemaakt};
    }catch(e){ window._backup = null; toast('Dit bestand is geen back-up van Colomarkt+. Kies een bestand dat begint met colomarkt-backup.'); }
    renderMain();
  };
  reader.onerror = ()=>toast('Het bestand kon niet gelezen worden.');
  reader.readAsText(file);
}
function zetBackupTerug(){
  const b = window._backup;
  if(!b || !b.data) return;
  const huidigeGebruiker = state.currentUser;
  state = b.data;
  ['orders','activity','recipes','tekorten','bestelbonnen','ingredienten','leveranciers','ontvangsten','verspilling'].forEach(k=>{ if(!Array.isArray(state[k])) state[k] = []; });
  if(!state.leveranciers.length) state.leveranciers = seedLeveranciers();
  if(state.users.some(u=>u.id===huidigeGebruiker)) state.currentUser = huidigeGebruiker;
  state.activity.push({tijd:nowStr(), tekst:`Back-up van ${b.datum||'onbekende datum'} teruggezet.`});
  window._backup = null; cart = {};
  save();
  toast('Back-up teruggezet.');
  renderShell();
}

// Leesbare naam voor chefs (2026-10-09). Claessens-namen zijn afkortingen ("Aard charlotte pr (zak 2,5kg)").
// Alleen weergave: de originele naam blijft voor het magazijn, de bestelbon en de leverancier.
function chefNaam(p){
  if(!p) return '';
  if(p.chefNaam) return p.chefNaam;
  let n = String(p.naam||'');
  if(!/\spr(\s|$)/.test(n)) return n;
  n = n.replace(/\s+pr(?=\s|$)/, '');
  const vol = {Aard:'Aardappel', Champ:'Champignon', Sinaas:'Sinaasappel'};
  n = n.replace(/^(Aard|Champ|Sinaas)\s/, (m,w)=>vol[w]+' ');
  n = n.replace(/^Aardappel (\S*aardappel)/, (m,w)=>w[0].toUpperCase()+w.slice(1));
  return n.replace(/\s{2,}/g,' ').trim();
}
function itemNaamChef(i){ const p = i && state.products.find(x=>x.id===i.productId); return p && p.naam===i.naam ? chefNaam(p) : (i ? i.naam : ''); }

// Extra producten uit de grote catalogus (Horeca Totaal), getoond bij een gekozen categorie of zoekterm.
// Voor de chef maakt de leverancier niet uit: ze staan gewoon mee in de lijst.
function htExtra(catFilter, q){
  const leeg = {items:[], totaal:0};
  if(!HT.data || !HT.cat || catFilter==='Vaste' || catFilter==='Favorieten') return leeg;
  const woorden = q.trim().split(/\s+/).filter(w=>w.length>0);
  if(catFilter==='Alle' && !woorden.some(w=>w.length>=2)) return leeg;
  const al = new Set(state.products.filter(p=>p.htArt).map(p=>p.htArt));
  // Alleen eigen producten die niet zelf uit deze catalogus komen: anders verdwijnen andere verpakkingen met
  // dezelfde naam zodra een chef er één aanklikt (Stefan 2026-10-10, tomatenpuree).
  const eigen = new Set(state.products.filter(p=>!p.htArt).map(p=>prodSleutel(p.naam)));
  const items = [];
  HT.data.producten.forEach((p,i)=>{
    if(al.has(p[0]) || eigen.has(prodSleutel(p[1]))) return;
    if(catFilter!=='Alle' && HT.cat[i]!==catFilter) return;
    const t = (p[1]+' '+p[0]).toLowerCase();
    if(woorden.every(w=>t.includes(w))) items.push({p, cat:HT.cat[i]});
  });
  return {items, totaal: items.length};
}
function htRij(p){
  const [art, naam, verp, , afdIdx, st] = p;
  return `<div class="bp-row">
    <div class="bp-naam">${sterHtml('ht-'+art, `htFavoriet('${art}')`)}${htFotoHtml(art, afdIdx, 44)}<div style="min-width:0;"><div class="bp-titel">${esc(naam)}</div><div class="bp-meta">${verp?'per '+esc(verp):''}</div></div></div>
    <div class="bp-status">${st && st!=='Beste koop' && st!=='Nieuw artikel' ? htStatusTag(st) : '<span class="tag pending">Wordt besteld</span>'}</div>
    <div class="qtybox">
      <button onclick="htCartStep('${art}',-1)" aria-label="Minder">−</button>
      <input type="number" min="0" step="1" value="" placeholder="0" onchange="htCartSet('${art}',this.value)" aria-label="Aantal ${esc(naam)}">
      <button onclick="htCartStep('${art}',1)" aria-label="Meer">+</button>
    </div>
  </div>`;
}
// Bij de eerste + wordt het product opgenomen in de lijst (zoals vroeger via de catalogus).
function htCartStep(art, d){ if(d<=0) return; const prod = htNaarProduct(art); if(!prod) return; save(); cartStep(prod.id, d); }
function htCartSet(art, val){ if(!(parseFloat(String(val).replace(',','.'))>0)) return; const prod = htNaarProduct(art); if(!prod) return; save(); cartSet(prod.id, val); }
/* Sneller bestellen: favorieten, vorige aanvraag opnieuw, eigen lijsten per les. */
function mijnFavorieten(){ const u=currentUser().id; state.favorieten = state.favorieten||{}; return state.favorieten[u] = state.favorieten[u]||[]; }
function isFavoriet(pid){ return (state.favorieten && state.favorieten[currentUser().id]||[]).includes(pid); }
function wisselFavoriet(pid){ const f=mijnFavorieten(); const i=f.indexOf(pid); if(i>=0) f.splice(i,1); else f.push(pid); save(); renderMain(); }
function htFavoriet(art){ const prod=htNaarProduct(art); if(prod) wisselFavoriet(prod.id); }
function sterHtml(pid, onclick){ const aan=isFavoriet(pid); return `<button class="ster ${aan?'aan':''}" title="${aan?'Uit favorieten':'Bij favorieten'}" aria-label="${aan?'Uit favorieten':'Bij favorieten'}" onclick="${onclick||`wisselFavoriet('${pid}')`}">${aan?'★':'☆'}</button>`; }
function opnieuwBestellen(oid){
  const o = state.orders.find(x=>x.id===oid); if(!o) return;
  let n=0, weg=0;
  o.items.forEach(i=>{ if(state.products.some(p=>p.id===i.productId)){ cart[i.productId]=Math.round(((cart[i.productId]||0)+i.aantal)*100)/100; n++; } else weg++; });
  if(o.les && !window._lesInput) window._lesInput = o.les;
  window._nodigOp = '';
  activeTab='bestellen'; renderTabs(); renderMain(); window.scrollTo(0,0);
  toast(`${n} product(en) van je aanvraag ${o.les?'voor '+esc(o.les)+' ':''}staan in je nieuwe aanvraag. Pas de aantallen aan en kies de datum.${weg?` ${weg} product(en) bestaan niet meer.`:''}`);
}
function bewaarLijst(){
  const items = Object.fromEntries(Object.entries(cart).filter(([id])=>state.products.some(p=>p.id===id)));
  if(!Object.keys(items).length) return;
  const voorstel = (window._lesInput||'').trim();
  const naam = (prompt('Naam van de lijst (bv. "3RK1 warme keuken")', voorstel)||'').trim();
  if(!naam) return;
  state.lijsten = state.lijsten||[];
  const bestaand = state.lijsten.find(l=>l.uid===currentUser().id && l.naam.toLowerCase()===naam.toLowerCase());
  if(bestaand) bestaand.items = items; else state.lijsten.push({id:'l'+Date.now(), uid:currentUser().id, naam, items});
  save(); toast(`Lijst "${esc(naam)}" bewaard. Je vindt ze bovenaan bij Bestellen.`); renderMain();
}
function laadLijst(lid){
  const l = (state.lijsten||[]).find(x=>x.id===lid); if(!l) return;
  Object.entries(l.items).forEach(([pid,q])=>{ if(state.products.some(p=>p.id===pid)) cart[pid]=Math.round(((cart[pid]||0)+q)*100)/100; });
  if(!window._lesInput) window._lesInput = l.naam;
  renderMain();
}
function wisLijst(lid){ const l=(state.lijsten||[]).find(x=>x.id===lid); if(!l || !confirm(`Lijst "${l.naam}" verwijderen?`)) return; state.lijsten = state.lijsten.filter(x=>x.id!==lid); save(); renderMain(); }
// Producten die deze chef het vaakst bestelde, voor de knop "Mijn vaste producten".
function vasteProducten(uid){
  const n = {};
  state.orders.filter(o=>o.leerkrachtId===uid && !o.type).forEach(o=>o.items.forEach(i=>{ n[i.productId]=(n[i.productId]||0)+1; }));
  return Object.keys(n).filter(id=>state.products.some(p=>p.id===id)).sort((a,b)=>n[b]-n[a]).slice(0,30);
}
function cartStep(pid, delta){
  const p = state.products.find(x=>x.id===pid);
  const step = p.eenheid==='kg' || p.eenheid==='l' ? 0.5 : 1;
  const cur = cart[pid]||0;
  const next = Math.max(0, Math.round((cur+delta*step)*10)/10);
  if(next<=0) delete cart[pid]; else cart[pid]=next;
  renderMain();
}
function cartSet(pid, val){
  const n = parseFloat(val.replace(',','.'));
  if(!n || n<=0) delete cart[pid]; else cart[pid]=n;
  renderMain();
}
// Vrije voorraad = voorraad min wat al voor andere, nog niet geleverde aanvragen opzij staat.
function vrijeVoorraad(pid){
  const p = state.products.find(x=>x.id===pid);
  if(!p) return 0;
  const gereserveerd = state.orders.filter(o=>o.status==='aangevraagd')
    .reduce((s,o)=>s+o.items.filter(i=>i.productId===pid).reduce((t,i)=>t+(i.uitVoorraad!=null?i.uitVoorraad:i.aantal),0),0);
  return Math.max(0, Math.round((p.voorraad - gereserveerd)*100)/100);
}
function maakTekort(p, aantal, o){
  state.tekorten.push({
    id:'t'+Date.now()+Math.random().toString(36).slice(2,6),
    productId:p.id, naam:p.naam, eenheid:p.eenheid, aantal,
    leverancier:p.leverancier, les:o.les, leerkracht:o.leerkracht,
    orderId:o.id, status:'open', aangemaakt:nowStr()
  });
}
// Maakt één aanvraag van {productId: aantal}; wat niet op voorraad is gaat meteen op de bestellijst.
function maakAanvraag(regels, les, nodigOp, extra){
  const items = Object.entries(regels).map(([pid,qty])=>{
    const p = state.products.find(x=>x.id===pid);
    const vrij = vrijeVoorraad(pid);
    const uitVoorraad = Math.round(Math.min(qty, vrij)*100)/100;
    return {productId:pid, naam:p.naam, eenheid:p.eenheid, aantal:qty, uitVoorraad, teBestellen: Math.round((qty-uitVoorraad)*100)/100, leverancier:p.leverancier};
  }).filter(i=>i.aantal>0);
  if(!items.length) return null;
  const order = Object.assign({
    id:'o'+Date.now()+Math.random().toString(36).slice(2,5), leerkracht: currentUser().naam, leerkrachtId: currentUser().id,
    les: (les||'').trim(), nodigOp: nodigOp||'',
    items, status:'aangevraagd', aangemaakt: nowStr()
  }, extra||{});
  state.orders.push(order);
  const teBestellen = items.filter(i=>i.teBestellen>0);
  teBestellen.forEach(i=>maakTekort(state.products.find(x=>x.id===i.productId), i.teBestellen, order));
  state.activity.push({tijd:nowStr(), tekst:`${currentUser().naam} vroeg ${items.length} product(en) aan${order.les?' voor '+order.les:''}.`
    + (teBestellen.length ? ` Niet (genoeg) op voorraad, meteen op de bestellijst gezet: ${teBestellen.map(i=>`${fmt(i.teBestellen)} ${i.eenheid} ${i.naam} (${i.leverancier||'leverancier?'})`).join(', ')}.` : '')});
  return {order, teBestellen};
}
function submitOrder(){
  const res = maakAanvraag(cart, window._lesInput, window._nodigOp);
  if(!res) return;
  const teBestellen = res.teBestellen;
  cart = {};
  save();
  toast(teBestellen.length
    ? `Aanvraag verstuurd. ${teBestellen.length} product(en) zijn niet (genoeg) op voorraad en staan meteen op de bestellijst bij de leverancier. Je volgt alles onder "Mijn bestellingen".`
    : 'Aanvraag verstuurd naar het magazijn. Alles is op voorraad. Je vindt de status onder "Mijn bestellingen".');
  switchTab('mijnbestellingen');
}
// Datum "nodig op" van een aanvraag, met een opvallende kleur als het vandaag of morgen is.
function nodigOpTag(o){
  if(!o.nodigOp) return '';
  const d = new Date(o.nodigOp+'T12:00:00');
  if(isNaN(d)) return '';
  const vandaag = new Date(); vandaag.setHours(12,0,0,0);
  const dagen = Math.round((d - vandaag)/86400000);
  const tekst = 'Nodig op ' + d.toLocaleDateString('nl-BE',{weekday:'short', day:'numeric', month:'short'});
  return `<span class="tag ${dagen<=1?'low':'pending'}">${tekst}${dagen===0?' (vandaag)':dagen===1?' (morgen)':dagen<0?' (voorbij)':''}</span>`;
}
function bestelStatusTekst(o, i){
  const delen = [];
  const uit = i.uitVoorraad!=null ? i.uitVoorraad : null;
  if(uit!=null && uit>0) delen.push(`${fmt(uit)} uit voorraad`);
  const tk = state.tekorten.filter(t=>t.orderId===o.id && t.productId===i.productId);
  // Chefs zien de leverancier niet: die ligt op de achtergrond bij het magazijn.
  const chef = isBesteller(currentUser());
  tk.forEach(t=>delen.push(chef ? `${fmt(t.aantal)} ${t.status==='besteld'?'besteld':'wordt besteld'}` : `${fmt(t.aantal)} ${t.status==='besteld'?'besteld bij':'te bestellen bij'} ${t.leverancier||'leverancier'}`));
  const ontvangen = (i.ontvangenVanLeverancier||0);
  if(ontvangen>0) delen.push(chef ? `${fmt(ontvangen)} binnen` : `${fmt(ontvangen)} geleverd door ${i.leverancier||'leverancier'}`);
  return delen.join(' · ');
}
function viewMijnBestellingen(){
  const mine = state.orders.filter(o=>o.leerkrachtId===currentUser().id).slice().reverse();
  return `<div class="panel"><h2>Mijn bestelaanvragen</h2>
  ${mine.length===0 ? '<div class="empty">Je hebt nog geen aanvragen ingediend.</div>' : mine.map(o=>`
    <div style="border-top:1px solid var(--line); padding:12px 0;">
      <div class="row" style="justify-content:space-between;">

      </div>

      </div>
      <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap;">
        ${orderAanpasbaar(o) ? `<button class="btn secondary small" onclick="obStart('${o.id}')">✎ Aanpassen of intrekken</button><span class="note" style="margin:0;">Kan tot het magazijn je aanvraag verwerkt.</span>` : ''}
        <button class="btn ghost small" onclick="opnieuwBestellen('${o.id}')">↻ Opnieuw bestellen</button>
      </div>`}
    </div>
  `).join('')}
  </div>`;
}

/* ---------- Chef: startscherm (Stefan 2026-10-10) ---------- */
// Eén blik bij het aanmelden: wat staat vandaag en deze week gepland, en hoe ver staan mijn aanvragen.
function viewChefStart(){
  const me = currentUser(), vandaag = isoDag(new Date());
  const week = standaardWeek(), dagen = weekDagen(week);

/* ---------- Chef: ingediende aanvraag aanpassen of intrekken ---------- */
// Zolang het magazijn een aanvraag niet verwerkt (of als besteld markeerde), kan de chef ze nog wijzigen.
// Regels waarvan het tekort al op een bestelbon staat, liggen vast: die vraagt de chef aan het magazijn.
function orderAanpasbaar(o){ return !!o && o.leerkrachtId===currentUser().id && !o.type && o.status==='aangevraagd' && orderFase(o)==='ingediend'; }
function obRegelVast(o, pid){
  return state.tekorten.some(t=>t.orderId===o.id && t.productId===pid && (t.status!=='open'
    || (state.bestelbonnen||[]).some(b=>b.status!=='geannuleerd' && b.regels.some(r=>r.tekortId===t.id || (r.tekortIds||[]).includes(t.id)))));
}
function obStart(oid){
  const o = state.orders.find(x=>x.id===oid); if(!orderAanpasbaar(o)) return;
  const regels = {}; o.items.forEach(i=>{ regels[i.productId] = i.aantal; });
  window._obBewerk = {oid, regels, les:o.les||'', nodigOp:o.nodigOp||''}; window._obQ = '';
  renderMain();
}
function obStop(){ window._obBewerk = null; window._obQ = ''; renderMain(); }
function obZet(pid, val){
  const b = window._obBewerk; if(!b) return;
  const n = Math.round((parseFloat(String(val).replace(',','.'))||0)*100)/100;
  if(n>0) b.regels[pid] = n; else delete b.regels[pid];
  window._obQ = ''; setTimeout(renderMain, 0);
}
function obEditor(o){
  const b = window._obBewerk;
  const q = (window._obQ||'').trim().toLowerCase();
  const pids = [...new Set([...o.items.map(i=>i.productId), ...Object.keys(b.regels)])];
  const regel = pid=>{
    const p = state.products.find(x=>x.id===pid); const it = o.items.find(i=>i.productId===pid);
    const naam = p ? p.naam : it.naam, eenheid = p ? p.eenheid : it.eenheid;
    const vast = it && obRegelVast(o, pid);
    const n = b.regels[pid]||0;
    if(vast) return `<div class="ob-regel"><span style="min-width:90px;font-weight:600;">${fmt(it.aantal)} ${esc(eenheid)}</span><span>${esc(naam)}<br><span class="note" style="margin:0;">Al besteld voor jou. Vraag het magazijn als dit niet klopt.</span></span></div>`;
    return `<div class="ob-regel${n?'':' weg'}">
      <div class="qtybox"><input type="number" min="0" step="0.1" value="${n||''}" placeholder="0" aria-label="Aantal ${esc(naam)}" onchange="obZet('${pid}',this.value)"></div>
      <span style="flex:1;min-width:0;">${n?'':'<s>'}${esc(naam)}${n?'':'</s>'} <span class="note" style="margin:0;">per ${esc(eenheid)}</span>${!it?' <span class="tag low">nieuw</span>':''}</span>
      ${n?`<button class="btn ghost small" aria-label="${esc(naam)} schrappen" onclick="obZet('${pid}',0)">Schrappen</button>`:`<button class="btn ghost small" onclick="obZet('${pid}','${it?it.aantal:1}')">Terugzetten</button>`}
    </div>`;
  };
  const treffers = q.length<2 ? [] : zonderDubbels(state.products.filter(p=>!p.uit && !pids.includes(p.id) && p.naam.toLowerCase().includes(q))).sort((a,c)=>a.naam.localeCompare(c.naam)).slice(0,8);
  const vasteRegels = o.items.some(i=>obRegelVast(o, i.productId));
  return `<div class="ob-bewerk">
    <div class="bp-top" style="margin-bottom:8px;">
      <label>${lesLabel(currentUser()).kort}<input value="${esc(b.les)}" oninput="window._obBewerk.les=this.value"></label>
      <label>Nodig op<input type="date" value="${esc(b.nodigOp)}" onchange="window._obBewerk.nodigOp=this.value"></label>
    </div>
    ${pids.map(regel).join('')}
    <label class="kp-zoeklabel" style="margin-top:10px;">Product toevoegen<input id="obZoek" placeholder="Zoek een product…" value="${esc(window._obQ||'')}" autocomplete="off"></label>
    ${treffers.length ? `<div style="display:grid;gap:4px;margin-top:6px;">${treffers.map(p=>`<button class="btn ghost small" style="justify-content:flex-start;text-align:left;" onclick="obZet('${p.id}',1)">+ ${esc(p.naam)} <span class="note" style="margin:0 0 0 6px;">per ${esc(p.eenheid)}</span></button>`).join('')}</div>` : q.length>=2 ? '<div class="note">Geen product gevonden.</div>' : ''}
    <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn" onclick="obBewaar()">Wijzigingen opslaan</button>
      <button class="btn ghost" onclick="obStop()">Niet wijzigen</button>
      ${vasteRegels ? '' : `<button class="btn ghost" style="margin-left:auto;color:var(--brick);" onclick="obIntrekken('${o.id}')">Hele aanvraag intrekken</button>`}
    </div>
  </div>`;
}
function obBewaar(){
  const b = window._obBewerk; if(!b) return;
  const o = state.orders.find(x=>x.id===b.oid);
  if(!orderAanpasbaar(o)){ window._obBewerk = null; renderMain(); toast('Het magazijn heeft deze aanvraag intussen verwerkt. Ze kan niet meer gewijzigd worden; vraag het magazijn.'); return; }
  const vast = new Set(o.items.filter(i=>obRegelVast(o, i.productId)).map(i=>i.productId));
  const nieuw = Object.entries(b.regels).filter(([pid,n])=>n>0 && !vast.has(pid) && state.products.some(p=>p.id===pid));
  if(!nieuw.length && !vast.size){ obIntrekken(o.id); return; }
  const oud = o.items.map(i=>`${fmt(i.aantal)} ${i.eenheid} ${i.naam}`).join(', ');
  // Open tekorten van de gewijzigde regels vervallen; ze worden hieronder opnieuw berekend.
  state.tekorten = state.tekorten.filter(t=>!(t.orderId===o.id && t.status==='open' && !vast.has(t.productId)));
  const oudeItems = o.items;
  o.items = oudeItems.filter(i=>vast.has(i.productId));
  nieuw.forEach(([pid,qty])=>{
    const p = state.products.find(x=>x.id===pid);
    const vrij = vrijeVoorraad(pid);
    const uitVoorraad = Math.round(Math.min(qty, vrij)*100)/100;
    const item = {productId:pid, naam:p.naam, eenheid:p.eenheid, aantal:qty, uitVoorraad, teBestellen: Math.round((qty-uitVoorraad)*100)/100, leverancier:p.leverancier};
    o.items.push(item);
    if(item.teBestellen>0) maakTekort(p, item.teBestellen, o);
  });
  o.les = (b.les||'').trim(); o.nodigOp = b.nodigOp||'';
  o.gewijzigdOp = nowStr();
  state.activity.push({tijd:nowStr(), tekst:`${currentUser().naam} wijzigde de aanvraag${o.les?' voor '+o.les:''}. Was: ${oud}. Nu: ${o.items.map(i=>`${fmt(i.aantal)} ${i.eenheid} ${i.naam}`).join(', ')}.`});
  window._obBewerk = null; window._obQ = '';
  save(); renderTabs(); renderMain();
  toast('Je aanvraag is aangepast. Het magazijn ziet de nieuwe versie.');
}
function obIntrekken(oid){
  const o = state.orders.find(x=>x.id===oid);
  if(!orderAanpasbaar(o)){ toast('Het magazijn heeft deze aanvraag intussen verwerkt. Vraag het magazijn.'); renderMain(); return; }
  if(o.items.some(i=>obRegelVast(o, i.productId))) return;
  if(!confirm('Deze aanvraag helemaal intrekken? Het magazijn ziet ze dan niet meer.')) return;
  state.tekorten = state.tekorten.filter(t=>!(t.orderId===oid && t.status==='open'));
  state.orders = state.orders.filter(x=>x.id!==oid);
  (state.planning||[]).forEach(p=>{ if(p.orderId===oid) delete p.orderId; });
  state.activity.push({tijd:nowStr(), tekst:`${currentUser().naam} trok de aanvraag${o.les?' voor '+o.les:''} van ${o.aangemaakt} in.`});
  window._obBewerk = null; window._obQ = '';
  save(); renderTabs(); renderMain();
  toast('De aanvraag is ingetrokken.');
}

/* ---------- Leerkracht: Recepten & bestellen per recept ---------- */

// Dubbele recepten: zelfde naam zonder toevoegsels als (3de jaar), #nummer, (R), (B), GK.
function receptSleutel(n){
  return String(n||'').toLowerCase()
    .replace(/#\d+/g,'')
    .replace(/\((?:1ste|2de|3de|4de|5de|6de|7de)[^)]*\)/g,'')
    .replace(/\((?:r|b|gk|resto|self)\)/g,'')
    .replace(/\bgk\b/g,'')
    .replace(/\b(?:1ste|2de|3de) graad\b/g,'')
    .replace(/[^a-z0-9à-ÿ]+/g,' ').trim();
}
function dubbeleRecepten(lijst){
  const m = {}; lijst.forEach(r=>{ const k = receptSleutel(r.naam); (m[k]=m[k]||[]).push(r); });
  return Object.values(m).filter(g=>g.length>1);
}
// Twee receptenbibliotheken (Stefan 2026-10-09): de zaal (maîtres) heeft heel andere recepten dan de keuken.
// Recept met bib 'zaal' hoort bij de zaal, alle andere bij de keuken. Zaal ziet alleen zaal, chefs alleen keuken;
// magazijn en TA zien beide en kiezen bovenaan welke.
const REC_BIBS = [['keuken','Keuken'],['bakkerij','Bakkerij'],['zaal','Zaal']];
function recBib(r){ return r && (r.bib==='zaal' || r.bib==='bakkerij') ? r.bib : 'keuken'; }
function eigenBib(u){ u = u || currentUser(); return u.rol==='zaal' ? 'zaal' : u.rol==='leerkracht' ? (u.afdeling==='bakkerij' ? 'bakkerij' : 'keuken') : null; }
function zieRecept(r){ const b = eigenBib(); return !b || recBib(r)===b; }
function recBibWissel(rid, naar){
  const r = state.recipes.find(x=>x.id===rid); if(!r) return;
  if(!naar) naar = recBib(r)==='zaal' ? 'keuken' : 'zaal';
  if(naar==='keuken') delete r.bib; else r.bib = naar;
  state.activity.push({tijd:nowStr(), tekst:`${currentUser().naam} zette recept "${r.naam}" in de receptenbibliotheek van de ${recBib(r)}.`});
  save(); toast(`"${r.naam}" staat nu in de bibliotheek van de ${recBib(r)}.`); renderMain();
}

    ${eigen ? '' : `<div class="bp-chips">${[['alle','Alle']].concat(REC_BIBS).map(([id,l])=>`<button class="chip ${bibF===id?'active':''}" onclick="window._recBibF='${id}';renderMain();">${l}${id!=='alle'?`<span class="n">${bibTel(id)}</span>`:''}</button>`).join('')}</div>`}
    ${meestGebruikt.length && !ingebed ? `

function recipeStepsHtml(tekst){
  const stappen = (tekst||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!stappen.length) return '<p class="note">Geen bereidingswijze opgegeven.</p>';
  return `<ol style="margin:0;padding-left:20px;">${stappen.map(s=>`<li style="margin-bottom:6px;">${esc(s)}</li>`).join('')}</ol>`;

// Hoeveelheid in keukeneenheden zoals in Basisbegrippen van de keuken: g, kg, dl, cl, l, st.
function getalTekst(n, dec){ const f=Math.pow(10,dec==null?2:dec); return String(Math.round(n*f)/f).replace('.',','); }
function hoevTekst(h, eenheid){
  if(!(h>0)) return '—';
  const e = eenheid||'';
  if(e==='kg' || e==='g'){ const g = e==='kg' ? h*1000 : h; return g>=1000 ? getalTekst(g/1000,3)+' kg' : getalTekst(g, g<10?1:0)+' g'; }
  if(e==='l' || e==='cl' || e==='ml'){ const l = e==='l' ? h : e==='cl' ? h/100 : h/1000;
    if(l>=1) return getalTekst(l,2)+' l'; if(l>=0.1) return getalTekst(l*10,1)+' dl'; if(l>=0.01) return getalTekst(l*100,1)+' cl'; return getalTekst(l*1000,0)+' ml'; }
  if(e==='stuk') return getalTekst(h,2)+' st';
  return getalTekst(h,3)+' '+e;
}

let _aiFotoKan = null;
async function aiFotoKan(){
  if(_aiFotoKan!==null) return _aiFotoKan;
  try{ const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
    const caps = sample ? await sample.limits().catch(()=>null) : null;
    _aiFotoKan = caps && caps.images ? caps.images : false;
  }catch(e){ _aiFotoKan = false; }
  return _aiFotoKan;
}
function aiFotoToon(id){ aiFotoKan().then(c=>{ const el = document.getElementById(id); if(el){ el.hidden = !c; const inp = el.querySelector('input[type=file]'); if(inp && c && c.mediaTypes) inp.accept = c.mediaTypes.join(','); } }); }
function aiFout(e){
  const map = {not_granted:'Je hebt Claude voor deze app niet toegestaan.', rate_limited:'Te veel aanvragen op dit moment, probeer zo opnieuw.', images_unavailable:'Foto\'s kunnen in deze weergave niet gelezen worden. Plak de tekst.', image_rejected:'Deze foto kon niet gelezen worden. Probeer een JPG of PNG.', cancelled:'Gestopt.'};
  return map[e && e.code] || 'Claude kon dit niet lezen. Probeer opnieuw of vul het zelf in.';
}
function omrekenen(hoev, van, naar){
  const a = EENHEID_DIM[van], b = EENHEID_DIM[naar];
  if(!a || !b || a[0]!==b[0]) return null;
  return Math.round(hoev*a[1]/b[1]*1000)/1000;
}
async function recImport(){
  const f = window._recipeForm; if(!f) return;
  const tekst = (document.getElementById('recImpTekst')||{}).value || '';
  const fotoIn = document.getElementById('recImpFoto');
  const fotos = fotoIn && fotoIn.files && fotoIn.files.length ? Array.from(fotoIn.files) : [];
  if(!tekst.trim() && !fotos.length){ toast('Plak de tekst van het recept of kies een foto.'); return; }
  const btn = document.getElementById('recImpBtn'); if(btn){ btn.disabled = true; btn.textContent = 'Claude leest het recept…'; }
  try{
    const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
    if(!sample){ toast('Claude is niet beschikbaar in deze weergave.'); return; }
    const ings = state.ingredienten.map(i=>[i.id, i.naam, i.eenheid]);
    const prompt = `Je helpt een chef van een hotelschool een recept in te voeren. ${fotos.length?'De foto('+fotos.length+') toont een receptfiche.':''} ${tekst.trim()?'Hieronder staat ook tekst van het recept.':''}
Lees het recept en geef: de naam, voor hoeveel personen het basisrecept is (getal; 4 als het er niet staat), de ingrediënten met hoeveelheid en eenheid, de bereidingswijze (één stap per regel, zonder nummers) en eventuele nuttige informatie.
Koppel elk ingrediënt aan een ingrediënt uit de lijst [id, naam, eenheid] als het duidelijk hetzelfde is (ook bij een andere schrijfwijze); anders "ingredientId":"". Eenheid kies je uit kg, g, l, dl, cl, ml, stuk; reken eetlepels, theelepels en dergelijke om naar g of ml. Zet "naar smaak" of zonder hoeveelheid op 0.
Antwoord ALLEEN met JSON in dit formaat:
{"naam":"","basisPersonen":4,"ingredienten":[{"naam":"","ingredientId":"","hoeveelheid":0,"eenheid":"kg"}],"bereidingswijze":"stap\nstap","notities":""}

Ingrediënten: ${JSON.stringify(ings)}
${tekst.trim()?'\nTekst van het recept:\n'+tekst.slice(0,15000):''}`;
    const opts = {modelTier:'default'}; if(fotos.length) opts.images = fotos;
    const r = await sample.json(prompt, opts);
    if(!r || !Array.isArray(r.ingredienten) || !r.ingredienten.length){ toast('Claude vond geen ingrediënten. Probeer een scherpere foto of plak de tekst.'); return; }
    let nieuw = 0, gekoppeld = 0;
    const regels = r.ingredienten.map(x=>{
      let eenheid = String(x.eenheid||'').toLowerCase().trim();
      let hoev = toNumberLoose(x.hoeveelheid) || 0;
      if(eenheid==='dl'){ eenheid = 'l'; hoev = Math.round(hoev*100)/1000; }
      if(!ING_EENHEDEN.includes(eenheid)) eenheid = 'stuk';
      const ing = state.ingredienten.find(i=>i.id===x.ingredientId);
      if(ing){ const h = omrekenen(hoev, eenheid, ing.eenheid); if(h!==null){ gekoppeld++; return {ingredientId:ing.id, hoeveelheid:h}; } }
      const naam = String(x.naam||'').trim().slice(0,80); if(!naam) return null;
      const bestaand = state.ingredienten.find(i=>i.naam.toLowerCase()===naam.toLowerCase());
      if(bestaand){ const h = omrekenen(hoev, eenheid, bestaand.eenheid); if(h!==null){ gekoppeld++; return {ingredientId:bestaand.id, hoeveelheid:h}; } }
      nieuw++; return {ingredientId:'', hoeveelheid:hoev, nieuw:{naam, eenheid}};
    }).filter(Boolean);
    if(r.naam && !f.naam.trim()) f.naam = String(r.naam).slice(0,120);
    const pers = toNumberLoose(r.basisPersonen); if(pers>0) f.basisPersonen = pers;
    f.ingredienten = f.ingredienten.filter(l=>l.ingredientId||l.nieuw).concat(regels);
    if(r.bereidingswijze && !(f.bereidingswijze||'').trim()) f.bereidingswijze = String(r.bereidingswijze).slice(0,8000);
    if(r.notities && !(f.notities||'').trim()) f.notities = String(r.notities).slice(0,3000);
    window._recImpTekst = '';
    renderMain();
    toast(`Recept ingelezen: ${gekoppeld} ingrediënt(en) gekoppeld${nieuw?`, ${nieuw} nieuw (wordt aangemaakt bij opslaan)`:''}. Controleer alles voor je opslaat.`);
  }catch(e){ toast(aiFout(e)); }
  finally{ const b = document.getElementById('recImpBtn'); if(b){ b.disabled = false; b.textContent = 'Invullen met Claude'; } }
}

/* ---------- Ingrediënten en artikelen ---------- */
// Een recept gebruikt INGREDIËNTEN ("boter", in kg). Aan een ingrediënt hangen
// één of meer ARTIKELEN: producten uit de productenlijst bij een leverancier,
// met hoeveel ingrediënt-eenheden er in één producteenheid zitten (1 zak = 10 kg).
// Voor kostprijs en bestellen kiest de app het vaste artikel, of anders het
// goedkoopste leverbare artikel per ingrediënt-eenheid.
const ING_EENHEDEN = ['kg','g','l','cl','ml','stuk'];
const EENHEID_DIM = {kg:['massa',1], g:['massa',0.001], l:['volume',1], cl:['volume',0.01], ml:['volume',0.001], stuk:['stuk',1]};
const DEELBARE_EENHEDEN = ['kg','g','l','cl','ml'];
function rond(n, d){ const f = Math.pow(10, d==null?3:d); return Math.round(n*f)/f; }
function migreerReceptIngredienten(){
  if(!state.ingredienten) state.ingredienten = [];
  state.recipes.forEach(r=>(r.ingredienten||[]).forEach(l=>{
    if(l.ingredientId || !l.productId) return;
    const ing = ingredientVoorProduct(l.productId, true);
    if(ing){ l.ingredientId = ing.id; delete l.productId; }
  }));
}
function ingredientVoorProduct(pid, maakAan){
  let ing = state.ingredienten.find(i=>(i.artikelen||[]).some(a=>a.productId===pid));
  if(ing || !maakAan) return ing || null;
  const p = state.products.find(x=>x.id===pid);
  if(!p) return null;
  ing = { id:'ing-'+pid, naam: (p.naam.replace(/\s*\([^)]*\)/g,'').replace(/\b\d+([.,]\d+)?\s*(kg|g|gr|l|cl|ml|st|stuks?)\b\.?/gi,'').replace(/\s{2,}/g,' ').trim() || p.naam), eenheid: p.eenheid || 'stuk', artikelen:[{productId:pid, inhoud:1}], vastProductId:null };
  state.ingredienten.push(ing);
  return ing;
}
function artikelBruikbaar(p){
  if(!p) return false;
  if(p.htArt && HT.byArt && HT.byArt[p.htArt] && HT.byArt[p.htArt][5]==='Leverprobleem producent') return false;
  return true;
}
function artikelPrijsPerEenheid(a){
  const p = state.products.find(x=>x.id===a.productId);
  if(!p || !(a.inhoud>0) || !(p.prijs>0)) return null;
  return p.prijs / a.inhoud;
}
// Geeft {product, inhoud, prijsPerEenheid, reden} voor het artikel dat gebruikt wordt.
function gekozenArtikel(ing){
  const arts = (ing.artikelen||[]).filter(a=>state.products.some(p=>p.id===a.productId));
  if(!arts.length) return null;
  const maak = (a, reden)=>({product: state.products.find(p=>p.id===a.productId), inhoud:a.inhoud||1, prijsPerEenheid: artikelPrijsPerEenheid(a), reden});
  if(ing.vastProductId){ const v = arts.find(a=>a.productId===ing.vastProductId); if(v) return maak(v,'vast'); }
  const metPrijs = arts.filter(a=>artikelPrijsPerEenheid(a)!=null && artikelBruikbaar(state.products.find(p=>p.id===a.productId)));
  if(metPrijs.length){
    metPrijs.sort((x,y)=>artikelPrijsPerEenheid(x)-artikelPrijsPerEenheid(y));
    return maak(metPrijs[0], metPrijs.length>1 ? 'goedkoopst' : 'enige');
  }
  return maak(arts[0], 'zonder prijs');
}
function goedkoopsteArtikel(ing){
  const metPrijs = (ing.artikelen||[]).filter(a=>artikelPrijsPerEenheid(a)!=null && artikelBruikbaar(state.products.find(p=>p.id===a.productId)));
  if(!metPrijs.length) return null;
  metPrijs.sort((x,y)=>artikelPrijsPerEenheid(x)-artikelPrijsPerEenheid(y));
  return metPrijs[0];
}
// Info voor één receptregel bij een schaalfactor.
function regelInfo(l, factor){
  factor = factor || 1;
  const hoeveelheid = rond(l.hoeveelheid*factor, 3);
  if(l.ingredientId){
    const ing = state.ingredienten.find(i=>i.id===l.ingredientId);
    if(!ing) return {key:l.ingredientId, naam:'(ingrediënt niet meer gevonden)', eenheid:'', hoeveelheid, ontbreekt:true};
    const g = gekozenArtikel(ing);
    if(!g) return {key:ing.id, ing, naam:ing.naam, eenheid:ing.eenheid, hoeveelheid, ontbreekt:true, geenArtikel:true};
    const productAantal = rond(hoeveelheid / g.inhoud, 3);
    const eenheidsprijs = g.prijsPerEenheid || 0;
    return {key:ing.id, ing, naam:ing.naam, eenheid:ing.eenheid, hoeveelheid, product:g.product, inhoud:g.inhoud, productAantal, eenheidsprijs, kost: rond(hoeveelheid*eenheidsprijs,2), reden:g.reden, ontbreekt:false, zonderPrijs: !g.prijsPerEenheid};
  }
  const p = state.products.find(x=>x.id===l.productId);
  if(!p) return {key:l.productId, naam:'(product niet meer gevonden)', eenheid:'', hoeveelheid, ontbreekt:true};
  return {key:p.id, naam:p.naam, eenheid:p.eenheid, hoeveelheid, product:p, inhoud:1, productAantal:hoeveelheid, eenheidsprijs:p.prijs||0, kost: rond(hoeveelheid*(p.prijs||0),2), ontbreekt:false, zonderPrijs: !p.prijs};
}
// Verpakking lezen: "zak van 10 Kilo", "pot van 140 Gram", "fles van 75 Centiliter", "Boter 1 KG".
function leesVerpakking(tekst){
  const t = String(tekst||'');
  const m = t.match(/(\d+(?:[.,]\d+)?)\s*(kilo(?:gram)?|kg|gram|gr|g|liter|ltr|l|centiliter|cl|mililiter|milliliter|ml|stuks?|st)\b/i);
  if(!m) return null;
  const n = parseFloat(m[1].replace(',','.'));
  const u = m[2].toLowerCase();
  if(/^kilo|^kg/.test(u)) return {dim:'massa', basis:n};
  if(/^gr|^g$|^gram/.test(u)) return {dim:'massa', basis:n*0.001};
  if(/^liter|^ltr|^l$/.test(u)) return {dim:'volume', basis:n};
  if(/^centi|^cl/.test(u)) return {dim:'volume', basis:n*0.01};
  if(/^mil|^ml/.test(u)) return {dim:'volume', basis:n*0.001};
  return {dim:'stuk', basis:n};
}
// Hoeveel ingrediënt-eenheden zitten in één eenheid van dit product? null = onbekend.
function raadInhoud(product, ingEenheid){
  const doel = EENHEID_DIM[ingEenheid];
  if(!doel) return product.eenheid===ingEenheid ? 1 : null;
  const pe = EENHEID_DIM[product.eenheid];
  if(pe && pe[0]===doel[0]) return rond(pe[1]/doel[1], 4);
  const v = leesVerpakking(product.verpakking) || leesVerpakking(product.naam);
  if(v && v.dim===doel[0]) return rond(v.basis/doel[1], 4);
  return null;
}

function ingWijzig(id, veld, val){
  const ing = state.ingredienten.find(i=>i.id===id); if(!ing) return;
  if(veld==='naam'){ if(!val.trim()) return renderMain(); ing.naam = val.trim(); }
  if(veld==='eenheid' && val!==ing.eenheid){
    const oud = EENHEID_DIM[ing.eenheid], nieuw = EENHEID_DIM[val];
    if(oud && nieuw && oud[0]===nieuw[0]){
      const f = oud[1]/nieuw[1]; // 1 oude eenheid = f nieuwe
      (ing.artikelen||[]).forEach(a=>{ if(a.inhoud) a.inhoud = rond(a.inhoud*f, 4); });
      receptenMetIngredient(id).forEach(r=>r.ingredienten.forEach(l=>{ if(l.ingredientId===id) l.hoeveelheid = rond(l.hoeveelheid*f, 4); }));
      toast(`Eenheid omgezet naar ${val}. Inhoud van de artikelen en hoeveelheden in recepten zijn mee omgerekend.`);
    } else if(receptenMetIngredient(id).length){
      toast(`Let op: ${ing.eenheid} en ${val} kunnen niet automatisch omgerekend worden. Controleer de hoeveelheden in de recepten en de inhoud van de artikelen.`);
    }
    ing.eenheid = val;
  }
  save(); renderMain();
}
function ingVast(id, pid){ const ing = state.ingredienten.find(i=>i.id===id); if(!ing) return; ing.vastProductId = pid || null; save(); renderMain(); }
function ingInhoud(id, pid, val){
  const ing = state.ingredienten.find(i=>i.id===id); if(!ing) return;
  const a = ing.artikelen.find(x=>x.productId===pid); if(!a) return;
  const n = parseFloat(String(val).replace(',','.')); a.inhoud = (n>0) ? n : null; save(); renderMain();
}
function ingKoppel(id, pid){
  const ing = state.ingredienten.find(i=>i.id===id); const p = state.products.find(x=>x.id===pid);
  if(!ing || !p) return;
  if(!ing.artikelen) ing.artikelen = [];
  if(ing.artikelen.some(a=>a.productId===pid)) return;
  const inh = raadInhoud(p, ing.eenheid);
  ing.artikelen.push({productId:pid, inhoud: inh});
  state.activity.push({tijd:nowStr(), tekst:`Artikel "${p.naam}" (${p.leverancier||'—'}) gekoppeld aan ingrediënt ${ing.naam}.`});
  save();
  if(!inh) toast(`Gekoppeld. Vul nog in hoeveel ${ing.eenheid} er in 1 ${p.eenheid} "${p.naam}" zit, anders kan de prijs niet vergeleken worden.`);
  window._ingProdQ=''; renderMain();
}
function ingKoppelHt(id, art){
  const prod = htNaarProduct(art);
  if(!prod) return;
  window._ingHtQ='';
  ingKoppel(id, prod.id);
}
function ingOntkoppel(id, pid){
  const ing = state.ingredienten.find(i=>i.id===id); if(!ing) return;
  ing.artikelen = (ing.artikelen||[]).filter(a=>a.productId!==pid);
  if(ing.vastProductId===pid) ing.vastProductId = null;
  save(); renderMain();
}
function ingVerwijder(id){
  if(receptenMetIngredient(id).length) return;
  state.ingredienten = state.ingredienten.filter(i=>i.id!==id);
  window._ingOpen = null; save(); renderMain();
}
function nieuwIngredientMagazijn(){
  const ing = {id:'ing-'+Date.now(), naam:'Nieuw ingrediënt', eenheid:'kg', artikelen:[], vastProductId:null};
  state.ingredienten.push(ing); save();
  window._ingOpen = ing.id; window._ingProdQ=''; window._ingHtQ=''; renderMain();
}
function recipeKost(r, aantalPersonen){
  const factor = aantalPersonen / r.basisPersonen;
  let totaal = 0, incompleet = false;
  const regels = r.ingredienten.map(l=>{
    const i = regelInfo(l, factor);
    if(i.ontbreekt || i.zonderPrijs) incompleet = true;
    if(i.ontbreekt) return {naam:i.naam + (i.geenArtikel?' (nog geen artikel gekoppeld)':''), eenheid:i.eenheid, hoeveelheid:i.hoeveelheid, eenheidsprijs:0, kost:0, ontbreekt:true};
    totaal += i.kost;
    return {naam:i.naam, eenheid:i.eenheid, hoeveelheid:i.hoeveelheid, eenheidsprijs:i.eenheidsprijs, kost:i.kost, ontbreekt:false, product:i.product,
      artikel: i.product ? `${i.product.naam}${i.product.leverancier && !isBesteller(currentUser())?' · '+i.product.leverancier:''}${i.reden==='goedkoopst'?' · goedkoopst':''}` : ''};
  });
  return {regels, totaal: Math.round(totaal*100)/100, incompleet};
}

function setReceptAantal(val){
  const n = parseFloat(String(val).replace(',','.'));
  window._receptBestelling.aantalPersonen = (!n || n<=0) ? 1 : n;
  // Hoeveelheden zijn op een nieuw aantal personen gebaseerd — eerdere
  // handmatige aanpassingen voor dit aantal gelden niet meer.
  window._receptBestelling.overrides = {};
  window._receptBestelling.uitgesloten = [];
